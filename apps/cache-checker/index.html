  <style>
    /* ── Container: widen when result is visible ── */

    /* ── Input ── */
    .input-area { margin-bottom: var(--sp-4); }
    .input-row { display: flex; gap: var(--sp-2); }
    .input-field {
      flex: 1; padding: 12px 14px; border: 1.5px solid var(--border);
      font-size: var(--text-base); font-family: var(--font-sans); color: var(--text); background: var(--surface); outline: none;

    .input-field::placeholder { color: var(--text-faint); }

    .check-btn { padding: 12px 28px; width: auto; white-space: nowrap; }
    .sample-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); flex-wrap: wrap; }
    .sample-label { font-size: var(--text-xs); color: var(--text-faint); }
    .sample-btn {
      background: none; border: 1px solid var(--border); color: var(--text-muted);

    /* ── How it works: collapsible inline ── */
    .how-toggle {
      background: none; border: none; cursor: pointer; font-family: var(--font-sans);
      font-size: var(--text-xs); color: var(--text-faint); display: flex; align-items: center; gap: 4px;
      padding: 0; margin-bottom: var(--sp-3);
    }
    .how-toggle:hover { color: var(--navy); }
    .how-toggle-arrow { transition: transform 0.2s ease; display: inline-block; }
    .how-toggle.open .how-toggle-arrow { transform: rotate(90deg); }
    .how-panel { display: none; margin-bottom: var(--sp-4); }
    .how-panel.open { display: block; }
    .how-flow { display: flex; align-items: center; gap: 0; }
    @media (max-width: 600px) { .how-flow { flex-direction: column; } }

    }
    .how-step-icon { font-size: 1.3rem; flex-shrink: 0; }
    .how-step-text { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; }
    .how-step-text strong { color: var(--navy); }
    .how-arrow { font-size: 1rem; color: var(--navy-20); padding: 0 4px; flex-shrink: 0; }
    @media (max-width: 600px) { .how-arrow { transform: rotate(90deg); padding: 4px 0; } }

    /* ── ローディング ── */
    .loading { text-align: center; padding: 48px 0; display: none; }
    .loading.show { display: block; }
    .loading-text { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--sp-3); }
    .loading-progress {
      width: 200px; height: 3px; background: var(--border); margin: 0 auto var(--sp-3);
      overflow: hidden; position: relative;
    }
    .loading-progress-bar {
      height: 100%; background: var(--gold); width: 0%;
      transition: width 0.4s ease;
    }
    .cancel-btn {
      margin-top: var(--sp-3); padding: 6px 20px;
      background: none; border: 1.5px solid var(--border); color: var(--text-muted);
      font-size: var(--text-xs); font-weight: 600; cursor: pointer; font-family: var(--font-sans);
      transition: border-color var(--ease-base), color var(--ease-base);
    }
    .cancel-btn:hover { border-color: var(--navy); color: var(--navy); }

    /* ── エラー ── */
    .error-msg { margin-bottom: var(--sp-4); }

    /* ── 診断結果 ── */
    .verdict {
      display: none; padding: 24px 28px; margin-bottom: var(--sp-4);
      border: 1.5px solid var(--border);
    }
    .verdict.synced { background: var(--surface); border-left: 4px solid var(--navy); }
    .verdict.cache-wait { background: var(--surface); border-left: 4px solid var(--gold); }
    .verdict-row { display: flex; align-items: flex-start; gap: 16px; }

    /* ── 変更サマリー ── */

    /* ── OGP画像比較 ── */

    .ogp-compare-title {

      text-transform: uppercase; letter-spacing: 0.06em;

    .ogp-compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }

    .ogp-card { background: var(--surface); border: 1.5px solid var(--border); overflow: hidden; }

    .browser-tab {

    .browser-addressbar {
      padding: 6px 14px; background: rgba(0,31,51,0.02); border-bottom: 1px solid var(--border);
      font-size: 0.65rem; color: var(--text-faint); font-family: var(--font-mono);
      word-break: break-all; display: flex; align-items: center; gap: 6px;
    }
    .browser-addressbar-icon { font-size: var(--text-xs); opacity: 0.4; }
    .browser-label {
      padding: var(--sp-2) var(--sp-3); font-size: var(--text-xs); font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .browser-label-current { background: rgba(0,31,51,0.03); color: var(--text-muted); }
    .browser-label-latest { background: rgba(255,184,28,0.08); color: var(--navy); }
    .browser-content { position: relative; overflow: hidden; }
    .browser-iframe {
      width: 1280px; height: 960px; border: none; display: block;
      background: var(--surface); transform-origin: top left;
    }

    /* ── 次のステップ ── */
    .next-steps { padding: var(--sp-4); margin-bottom: var(--sp-4); display: none; background: var(--surface); border: 1.5px solid var(--border); }
    .next-steps-title { font-size: var(--text-xs); font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .next-step-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: var(--text-xs); color: var(--text-muted); line-height: 1.5; }
    .next-step-item + .next-step-item { border-top: 1px solid var(--border-light); }
    .next-step-num { width: 18px; height: 18px; background: var(--navy); color: var(--white); font-size: 0.6rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* ── アクションボタン ── */
    .result-actions { display: none; gap: 8px; flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .result-actions.show { display: flex; }
    .result-action-btn { background: var(--surface); border: 1.5px solid var(--border); color: var(--text-muted); font-size: var(--text-xs); font-weight: 600; padding: 8px 16px; cursor: pointer; flex: 1; min-width: 120px; text-align: center; font-family: var(--font-sans); transition: border-color var(--ease-base), color var(--ease-base); }
    .result-action-btn:hover { border-color: var(--navy); color: var(--navy); }
    .result-action-btn.primary { background: var(--navy); border-color: var(--navy); color: var(--white); font-weight: 700; }
    .result-action-btn.primary:hover { opacity: 0.9; }

    /* ── チェック履歴 ── */
    .history-section { margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: 1px solid var(--border); }
    .history-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--sp-2);
    }
    .history-title {
      font-size: var(--text-xs); font-weight: 700; color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .history-clear-btn {
      background: none; border: none; color: var(--text-faint);
      font-size: var(--text-xs); cursor: pointer; font-family: var(--font-sans);
      transition: color var(--ease-base);
    }
    .history-clear-btn:hover { color: var(--navy); }
    .history-list { display: flex; flex-direction: column; gap: 0; }
    .history-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);

    .history-item-result { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; flex-shrink: 0; }
    .history-item-result.synced { color: var(--navy); background: rgba(0,31,51,0.06); }
    .history-item-result.diff { color: var(--navy); background: rgba(255,184,28,0.12); }
    .history-empty { text-align: center; padding: 16px; font-size: var(--text-xs); color: var(--text-faint); }

    /* ── キャッシュヘッダー情報 ── */
    .cache-headers { display: none; margin-bottom: var(--sp-4); }
    .cache-headers.show { display: block; }
    .cache-headers-title {
      font-size: var(--text-xs); font-weight: 700; color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: var(--sp-2);
    }
    .cache-headers-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .cache-header-item { padding: 6px 10px; background: var(--surface); border: 1px solid var(--border); display: inline-flex; align-items: baseline; gap: 6px; }
    .cache-header-label { font-size: 0.65rem; color: var(--text-faint); }
    .cache-header-value { font-size: 0.65rem; font-weight: 600; color: var(--navy); font-family: var(--font-mono); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .input-row { flex-direction: column; }
      .change-badges { flex-direction: column; }
    }

<body>
  <script>if(localStorage.getItem('auth')!=='1')location.href='/';</script>

        <div class="how-step">

          <div class="how-step-text"><strong>差分比較</strong>（反映状況を診断）</div>

    <div class="error-msg" id="error-msg" role="alert"></div>

  <script>
    const urlInput = document.getElementById('url-input');
    const checkBtn = document.getElementById('check-btn');
    const errorEl = document.getElementById('error-msg');
    const loadingEl = document.getElementById('loading');
    const loadingTextEl = document.getElementById('loading-text');
    const loadingBar = document.getElementById('loading-bar');
    const PROXY_URL = '/api/proxy';
    let lastResult = null;
    let currentController = null;
    const HISTORY_KEY = 'cache-checker-history';
    const MAX_HISTORY = 10;

    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('show'); }
    function clearError() { errorEl.textContent = ''; errorEl.classList.remove('show'); }
    function setLoading(on, msg, progress) {
      loadingEl.classList.toggle('show', on);
      checkBtn.disabled = on;
      checkBtn.textContent = on ? 'チェック中...' : 'チェック';
      if (msg) loadingTextEl.textContent = msg;
      else if (!on) loadingTextEl.textContent = 'ページの内容を取得しています...';
      if (progress !== undefined) loadingBar.style.width = progress + '%';
      else if (!on) loadingBar.style.width = '0%';
    }
    function fillSample(url) { urlInput.value = url; urlInput.focus(); }

    // ── HTML解析（差分検出用） ──
    function parsePageContent(html, baseUrl) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const base = new URL(baseUrl);
      function resolveUrl(src) { if (!src) return ''; try { return new URL(src, base).href; } catch { return src; } }
      function getMeta(name) { const el = doc.querySelector(`meta[property="${name}"], meta[name="${name}"]`); return el ? el.getAttribute('content') : ''; }
      const ogp = {
        title: getMeta('og:title') || doc.title || '',
        description: getMeta('og:description') || getMeta('description') || '',
        image: resolveUrl(getMeta('og:image')),
      };
      const imgEls = doc.querySelectorAll('img[src]');
      const seen = new Set(); const images = [];
      imgEls.forEach(img => { const src = resolveUrl(img.getAttribute('src')); if (!src || src.startsWith('data:') || seen.has(src)) return; seen.add(src); images.push({ src }); });
      const textEls = doc.querySelectorAll('h1, h2, h3, h4, p, li, td, th, figcaption, span, a, label, dt, dd');
      const textParts = []; const seenText = new Set();
      textEls.forEach(el => { const t = el.textContent.trim(); if (t && t.length > 2 && !seenText.has(t)) { seenText.add(t); textParts.push(t); } });
      return { ogp, images, textContent: textParts.join('\n'), title: doc.title || '' };
    }

    // ── iframe にHTMLを表示 ──
    function renderIframe(iframeId, url) {
      const iframe = document.getElementById(iframeId);
      const container = iframe.parentElement;
      const containerWidth = container.clientWidth;
      const iframeWidth = 1280;
      const scale = containerWidth / iframeWidth;
      iframe.style.transform = `scale(${scale})`;
      container.style.height = (960 * scale) + 'px';
      iframe.src = PROXY_URL + '?url=' + encodeURIComponent(url);
    }

    // ── 詳細差分分析 ──
    function compareDetailed(current, latest) {
      const items = [];
      if (current.ogp.title !== latest.ogp.title) items.push({ type: 'title', label: 'タイトル', old: current.ogp.title || current.title, new: latest.ogp.title || latest.title });
      if (current.ogp.description !== latest.ogp.description) items.push({ type: 'description', label: '説明文', old: current.ogp.description, new: latest.ogp.description });
      if (current.ogp.image !== latest.ogp.image) items.push({ type: 'ogp-image', label: 'OGP画像', oldImage: current.ogp.image, newImage: latest.ogp.image });
      const curSet = new Set(current.images.map(i => i.src));
      const latSet = new Set(latest.images.map(i => i.src));
      const addedImgs = latest.images.filter(i => !curSet.has(i.src));
      const removedImgs = current.images.filter(i => !latSet.has(i.src));
      if (addedImgs.length > 0 || removedImgs.length > 0) items.push({ type: 'images', label: 'ページ内の画像', added: addedImgs, removed: removedImgs });
      if (current.textContent !== latest.textContent) items.push({ type: 'text', label: 'テキスト内容' });
      return items;
    }

    // ── 変更サマリー描画 ──
    function renderChangeSummary(changes) {
      const el = document.getElementById('change-summary');
      const header = document.getElementById('change-summary-header');
      const body = document.getElementById('change-summary-body');
      if (changes.length === 0) { el.classList.remove('show'); return; }
      header.textContent = `${changes.length}件の変更を検出`;
      const icons = { title: '📝', description: '📝', 'ogp-image': '🖼️', images: '🖼️', text: '📄' };
      body.innerHTML = changes.map(c => {
        let detail = '';
        if (c.type === 'title') detail = `「${c.old || ''}」→「${c.new || ''}」`;
        else if (c.type === 'description') detail = '説明文が変更';
        else if (c.type === 'ogp-image') detail = 'OGP画像が変更';
        else if (c.type === 'images') { const parts = []; if (c.added && c.added.length) parts.push(`${c.added.length}枚追加`); if (c.removed && c.removed.length) parts.push(`${c.removed.length}枚削除`); detail = parts.join('・'); }
        else if (c.type === 'text') detail = 'テキスト内容が変更';
        return `<span class="change-badge"><span class="change-badge-icon">${icons[c.type] || '📋'}</span>${escHtml(c.label)}${detail ? '：' + escHtml(detail) : ''}</span>`;
      }).join('');
      el.classList.add('show');
    }

    // ── OGP画像比較 ──
    function renderOgpCompare(changes) {
      const el = document.getElementById('ogp-compare');
      const ogpChange = changes.find(c => c.type === 'ogp-image');
      if (!ogpChange) { el.classList.remove('show'); return; }
      const curEl = document.getElementById('ogp-current');
      const latEl = document.getElementById('ogp-latest');
      curEl.innerHTML = ogpChange.oldImage ? `<img src="${escHtml(ogpChange.oldImage)}" alt="現在のOGP画像" onerror="this.outerHTML='<div class=ogp-no-image>画像を読み込めません</div>'">` : '<div class="ogp-no-image">OGP画像なし</div>';
      latEl.innerHTML = ogpChange.newImage ? `<img src="${escHtml(ogpChange.newImage)}" alt="最新のOGP画像" onerror="this.outerHTML='<div class=ogp-no-image>画像を読み込めません</div>'">` : '<div class="ogp-no-image">OGP画像なし</div>';
      el.classList.add('show');
    }

    // ── キャッシュヘッダー表示 ──
    function renderCacheHeaders(headers) {
      const el = document.getElementById('cache-headers');
      const grid = document.getElementById('cache-headers-grid');
      const interesting = ['cache-control', 'age', 'x-cache', 'cf-cache-status', 'x-cdn-cache', 'expires', 'etag', 'last-modified'];
      const found = [];
      if (headers) {
        for (const key of interesting) {
          const val = headers[key];
          if (val) found.push({ label: key, value: val });
        }
      }
      if (found.length === 0) { el.classList.remove('show'); return; }
      grid.innerHTML = found.map(h => `<div class="cache-header-item"><div class="cache-header-label">${escHtml(h.label)}</div><div class="cache-header-value">${escHtml(h.value)}</div></div>`).join('');
      el.classList.add('show');
    }

    // ── プロキシ取得 ──
    async function fetchViaProxy(url, signal) {
      const res = await fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }), signal });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Proxy error (${res.status})`);
      return data;
    }

    // ── キャンセル ──
    function cancelCheck() {
      if (currentController) { currentController.abort(); currentController = null; }
    }

    // ── チェック履歴管理 ──
    function getHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
    }
    function saveToHistory(entry) {
      const hist = getHistory();
      hist.unshift(entry);
      if (hist.length > MAX_HISTORY) hist.length = MAX_HISTORY;
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(hist)); } catch (_) { /* Safari private mode 等で書き込み失敗してもアプリは動かす */ }
      renderHistory();
    }
    function clearHistory() {
      try { localStorage.removeItem(HISTORY_KEY); } catch (_) {}
      renderHistory();
    }
    function formatRelativeTime(ts) {
      const diffSec = Math.floor((Date.now() - ts) / 1000);
      if (diffSec < 30) return 'たった今';
      if (diffSec < 60) return `${diffSec}秒前`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}分前`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}時間前`;
      const diffDay = Math.floor(diffHour / 24);
      if (diffDay < 7) return `${diffDay}日前`;
      const d = new Date(ts);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    let _historyTickTimer = null;
    function renderHistory() {
      const hist = getHistory();
      const container = document.getElementById('history-list');
      const clearBtn = document.getElementById('history-clear-btn');
      if (hist.length === 0) {
        container.innerHTML = '<div class="history-empty">チェック履歴はまだありません</div>';
        clearBtn.style.display = 'none';
        if (_historyTickTimer) { clearInterval(_historyTickTimer); _historyTickTimer = null; }
        return;
      }
      clearBtn.style.display = '';
      container.innerHTML = '<div class="history-list">' + hist.map((h, i) => {
        const isSynced = h.changeCount === 0;
        const timeLabel = h.ts ? formatRelativeTime(h.ts) : escHtml(h.date || '');
        const timeTitle = h.ts ? new Date(h.ts).toLocaleString('ja-JP') : (h.date || '');
        return `<div class="history-item" onclick="recheck(${i})" title="${escHtml(h.url)}">
          <div class="history-item-icon">${isSynced ? '✅' : '⏳'}</div>
          <div class="history-item-body">
            <div class="history-item-url">${escHtml(h.url)}</div>
            <div class="history-item-meta"><span class="history-time" data-ts="${h.ts || ''}" title="${escHtml(timeTitle)}">${timeLabel}</span>${h.duration ? ' · ' + escHtml(h.duration) : ''}</div>
          </div>
          <div class="history-item-result ${isSynced ? 'synced' : 'diff'}">${isSynced ? '反映済み' : h.changeCount + '件差分'}</div>
        </div>`;
      }).join('') + '</div>';
      if (!_historyTickTimer) {
        _historyTickTimer = setInterval(() => {
          document.querySelectorAll('.history-time[data-ts]').forEach(el => {
            const ts = Number(el.dataset.ts);
            if (ts) el.textContent = formatRelativeTime(ts);
          });
        }, 30000);
      }
    }
    function recheck(index) {
      const hist = getHistory();
      if (hist[index]) {
        urlInput.value = hist[index].url;
        runCheck();
      }
    }

    // ── メイン ──
    async function runCheck() {
      clearError();
      document.getElementById('verdict').style.display = 'none';
      document.getElementById('verdict-warn').style.display = 'none';
      document.getElementById('change-summary').classList.remove('show');
      document.getElementById('ogp-compare').classList.remove('show');
      document.getElementById('cache-headers').classList.remove('show');
      document.getElementById('compare-grid').classList.remove('show');
      document.getElementById('next-steps').style.display = 'none';
      document.getElementById('result-actions').classList.remove('show');

      const rawUrl = urlInput.value.trim();
      if (!rawUrl) { showError('URLを入力してください'); urlInput.focus(); return; }
      let parsed;
      try { parsed = new URL(rawUrl); } catch { showError('有効なURLを入力してください（例: https://www.akkodis.com/ja/）'); urlInput.focus(); return; }
      if (!['http:', 'https:'].includes(parsed.protocol)) { showError('HTTP/HTTPS のURLを入力してください'); return; }

      currentController = new AbortController();
      const signal = currentController.signal;
      const startTime = Date.now();
      setLoading(true, 'サイト訪問者が見る状態を取得中...', 15);
      try {
        const bypassUrl = new URL(rawUrl);
        bypassUrl.searchParams.set('_cb', Date.now() + '-' + Math.random().toString(36).slice(2));
        const bypassUrlStr = bypassUrl.toString();

        const currentRes = await fetchViaProxy(rawUrl, signal);
        setLoading(true, 'CMSの最新状態を取得中...', 55);
        const latestRes = await fetchViaProxy(bypassUrlStr, signal);
        setLoading(true, '比較中...', 85);

        const currentData = parsePageContent(currentRes.body, rawUrl);
        const latestData = parsePageContent(latestRes.body, rawUrl);

        document.getElementById('url-current').textContent = rawUrl;
        document.getElementById('url-latest').textContent = bypassUrlStr;
        document.getElementById('tab-current').textContent = currentData.ogp.title || currentData.title || rawUrl;
        document.getElementById('tab-latest').textContent = latestData.ogp.title || latestData.title || rawUrl;

        const changes = compareDetailed(currentData, latestData);
        renderChangeSummary(changes);
        renderOgpCompare(changes);
        renderCacheHeaders(currentRes.headers);

        setLoading(true, '完了', 100);
        const elapsed = Date.now() - startTime;
        const durationStr = elapsed < 1000 ? elapsed + 'ms' : (elapsed / 1000).toFixed(1) + '秒';

        const verdict = document.getElementById('verdict');
        const verdictIcon = document.getElementById('verdict-icon');
        const verdictTitle = document.getElementById('verdict-title');
        const verdictMeta = document.getElementById('verdict-meta');
        const verdictDesc = document.getElementById('verdict-desc');
        const verdictWarn = document.getElementById('verdict-warn');

        verdictMeta.textContent = `チェック所要時間: ${durationStr} · ${new Date().toLocaleString('ja-JP')}`;

        if (changes.length === 0) {
          verdict.className = 'verdict synced';
          verdictIcon.textContent = '✅';
          verdictTitle.textContent = '反映済み';
          verdictDesc.textContent = '通常表示とCMS最新に差分はありません。';
          verdictWarn.style.display = '';
          verdictWarn.innerHTML = '<strong>期待と違う場合：</strong> CMS側のパブリッシュ状態を確認してください。';
          document.getElementById('next-steps').style.display = 'none';
        } else {
          verdict.className = 'verdict cache-wait';
          verdictIcon.textContent = '⏳';
          verdictTitle.textContent = 'キャッシュ待ち — ' + changes.map(c => c.label).join('・') + ' に差分';
          verdictDesc.textContent = 'CMS最新は更新済みですが、サイトにはまだ反映されていません。';
          verdictWarn.style.display = '';
          verdictWarn.innerHTML = '<strong>右側が期待と違う場合：</strong> CMSのパブリッシュ状態を確認してください。';

          document.getElementById('next-steps').style.display = '';
          document.getElementById('next-steps-body').innerHTML = `
            <div class="next-step-item"><span class="next-step-num">1</span><span>数分〜数十分待ってから再チェック</span></div>
            <div class="next-step-item"><span class="next-step-num">2</span><span>急ぎならIT部門にキャッシュパージを依頼</span></div>
          `;
        }

        verdict.style.display = '';
        document.querySelector('.container').classList.add('has-result');
        document.getElementById('compare-grid').classList.add('show');

        renderIframe('iframe-current', rawUrl);
        renderIframe('iframe-latest', bypassUrlStr);

        document.getElementById('result-actions').classList.add('show');

        lastResult = { url: rawUrl, bypassUrl: bypassUrlStr, changes, currentData, latestData, duration: durationStr };
        saveToHistory({ url: rawUrl, changeCount: changes.length, ts: Date.now(), date: new Date().toLocaleString('ja-JP'), duration: durationStr });
        if (typeof HistoryManager !== 'undefined' && HistoryManager.save) {
          HistoryManager.save(`${rawUrl} → ${changes.length === 0 ? '反映済み' : changes.map(c=>c.label).join('・') + 'に差分'}`, rawUrl);
        }
      } catch (err) {
        if (err.name === 'AbortError') { /* キャンセル */ }
        else showError(err.message || 'チェック中にエラーが発生しました');
      } finally {
        currentController = null;
        setLoading(false);
      }
    }

    function copyReport() {
      if (!lastResult) return;
      const r = lastResult;
      const lines = [
        `## CMS更新 反映チェック結果`,
        `- **URL**: ${r.url}`,
        `- **パラメータ付きURL**: ${r.bypassUrl}`,
        `- **結果**: ${r.changes.length === 0 ? '✅ 反映済み' : '⏳ キャッシュ待ち（' + r.changes.map(c=>c.label).join('、') + ' に差分）'}`,
        `- **所要時間**: ${r.duration}`,
        `- **日時**: ${new Date().toLocaleString('ja-JP')}`,
      ];
      if (r.changes.length > 0) {
        lines.push('', '### 変更箇所');
        for (const c of r.changes) {
          if (c.type === 'title' || c.type === 'description') lines.push(`- **${c.label}**: 「${c.old || '(なし)'}」→「${c.new || '(なし)'}」`);
          else if (c.type === 'ogp-image') lines.push(`- **OGP画像**: 変更あり`);
          else if (c.type === 'images') { if (c.added && c.added.length) lines.push(`- **画像追加**: ${c.added.length}枚`); if (c.removed && c.removed.length) lines.push(`- **画像削除**: ${c.removed.length}枚`); }
          else if (c.type === 'text') lines.push(`- **テキスト内容**: 変更あり`);
        }
      }
      const text = lines.join('\n');
      const btn = document.querySelector('.result-action-btn:not(.primary)');
      if (typeof copyToClipboard === 'function') { copyToClipboard(text, btn); }
      else { navigator.clipboard.writeText(text).then(() => { btn.textContent = '✅ コピーしました'; setTimeout(() => { btn.textContent = '結果をコピー'; }, 2000); }); }
    }

    function clearResults() {
      document.getElementById('verdict').style.display = 'none';
      document.getElementById('change-summary').classList.remove('show');
      document.getElementById('ogp-compare').classList.remove('show');
      document.getElementById('cache-headers').classList.remove('show');
      document.getElementById('compare-grid').classList.remove('show');
      document.getElementById('next-steps').style.display = 'none';
      document.getElementById('result-actions').classList.remove('show');
      document.querySelector('.container').classList.remove('has-result');
      clearError();
      lastResult = null;
    }

    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') runCheck(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (currentController) cancelCheck();
        else clearResults();
      }
    });
    HistoryManager.init('Cache Checker');
    renderHistory();
  </script>
  <script src="../../assets/onboarding.js?v=20260503"></script>
  <script>initOnboarding({
    appName: 'cache-checker',
    title: 'Cache Checker',
    description: '「CMS更新したのに反映されない」をすぐ調査できます',
    features: [
      { icon: '🔄', text: 'キャッシュ版と最新版をページプレビューで並べて比較' },
      { icon: '📋', text: 'タイトル・画像・テキストの変更箇所を自動検出' },
      { icon: '📝', text: '結果をMarkdownでコピーして共有' }
    ],
    updates: [
      { date: '05/01', text: 'チェック履歴の時刻表記を「5分前」「2時間前」のような相対時間に変更（30秒ごとに自動更新）。Safari 私的モードでも履歴保存が落ちないようガード追加' },
      { date: '04/09', text: 'デザイン刷新・チェック履歴・OGP画像比較・キャッシュヘッダー表示・所要時間表示' },
      { date: '04/08', text: 'キャンセルボタン追加・進捗ステージ表示・Escキー対応' }
    ]
  });</script>
