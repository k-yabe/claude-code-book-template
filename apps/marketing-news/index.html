<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing News Radar</title>
  <link rel="stylesheet" href="../../assets/app-styles.css">
  <style>
    /* ── App-specific styles ───────────────────────────────── */

    /* Hero */
    .mn-hero {
      background: linear-gradient(135deg, #001f33 0%, #002d4a 55%, #00466f 100%);
      color: var(--white);
      border-radius: 0;
      padding: 32px 36px 36px;
      margin-bottom: var(--sp-6);
      position: relative;
      overflow: hidden;
    }
    .mn-hero::after {
      content: '';
      position: absolute;
      right: -80px; top: -60px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(255,184,28,0.18) 0%, rgba(255,184,28,0) 70%);
      pointer-events: none;
    }
    .mn-hero-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--sp-3);
      margin-bottom: var(--sp-3);
    }
    .mn-hero-label {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }
    .mn-hero-date {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.7);
      font-variant-numeric: tabular-nums;
    }
    .mn-hero-title {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.25;
      margin-bottom: var(--sp-2);
    }
    .mn-hero-tagline {
      color: rgba(255,255,255,0.75);
      font-size: var(--text-base);
      margin-bottom: var(--sp-5);
      max-width: 720px;
    }

    .mn-digest {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid var(--gold);
      padding: 16px 20px;
      position: relative;
      max-width: 780px;
    }
    .mn-digest-label {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: var(--sp-2);
      text-transform: uppercase;
    }
    .mn-digest-body {
      font-size: var(--text-md);
      line-height: 1.7;
      color: rgba(255,255,255,0.92);
      white-space: pre-line;
      font-weight: 500;
    }
    .mn-digest-skeleton {
      height: 56px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 100%);
      background-size: 200% 100%;
      animation: mn-shimmer 1.4s linear infinite;
    }
    @keyframes mn-shimmer { to { background-position: -200% 0; } }

    /* Controls bar */
    .mn-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      margin-bottom: var(--sp-5);
      flex-wrap: wrap;
    }
    .mn-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mn-tab {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 8px 14px;
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--ease-fast);
    }
    .mn-tab:hover { border-color: var(--navy-40); color: var(--navy); }
    .mn-tab.active {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }
    .mn-tab .mn-tab-count {
      font-size: 0.68rem;
      background: rgba(0,31,51,0.08);
      color: var(--navy);
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
      min-width: 20px;
      text-align: center;
    }
    .mn-tab.active .mn-tab-count {
      background: var(--gold);
      color: var(--navy);
    }

    .mn-controls-right {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .mn-select {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 8px 12px;
      font-size: var(--text-base);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
    }
    .mn-refresh {
      background: var(--gold);
      color: var(--navy);
      border: none;
      padding: 8px 16px;
      font-size: var(--text-base);
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-btn);
      transition: all var(--ease-fast);
    }
    .mn-refresh:hover { box-shadow: var(--shadow-btn-hover); transform: translateY(-1px); }
    .mn-refresh:disabled { opacity: 0.6; cursor: wait; transform: none; }

    /* Grid */
    .mn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--sp-4);
    }
    .mn-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      transition: box-shadow var(--ease), transform var(--ease);
      position: relative;
      border-left: 3px solid var(--navy-20);
    }
    .mn-card[data-category="ai"]         { border-left-color: #0066cc; }
    .mn-card[data-category="marketing"]  { border-left-color: var(--gold); }
    .mn-card[data-category="community"]  { border-left-color: #8e44ad; }
    .mn-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .mn-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      margin-bottom: 10px;
    }
    .mn-chip {
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mn-chip[data-category="ai"]        { background: #e7f1ff; color: #0054a6; }
    .mn-chip[data-category="marketing"] { background: var(--gold-40); color: #7a4a00; }
    .mn-chip[data-category="community"] { background: #f1e7ff; color: #5a2d99; }
    .mn-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .mn-meta .mn-dot { opacity: 0.5; }
    .mn-source {
      font-weight: 600;
      color: var(--text-secondary);
    }
    .mn-card-title {
      font-size: var(--text-md);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.45;
      margin-bottom: 10px;
      letter-spacing: -0.005em;
    }
    .mn-card-title a {
      color: inherit;
      text-decoration: none;
    }
    .mn-card-title a:hover { text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
    .mn-card-summary {
      font-size: var(--text-base);
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 14px;
      flex: 1;
    }
    .mn-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
      font-size: var(--text-sm);
    }
    .mn-link {
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mn-link:hover { color: #00406b; }
    .mn-lang {
      font-size: 0.66rem;
      color: var(--text-faint);
      border: 1px solid var(--border);
      padding: 1px 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Empty / error / loading */
    .mn-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
    }
    .mn-state-emoji { font-size: 2.4rem; margin-bottom: var(--sp-3); display: block; }
    .mn-state-title { font-size: var(--text-md); color: var(--text-secondary); font-weight: 700; margin-bottom: var(--sp-2); }
    .mn-state-desc { font-size: var(--text-base); line-height: 1.6; }

    .mn-skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px 20px;
      height: 180px;
      position: relative;
      overflow: hidden;
    }
    .mn-skeleton-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(0,31,51,0.04) 50%, transparent 100%);
      animation: mn-shimmer 1.4s linear infinite;
      background-size: 200% 100%;
    }

    /* Sources strip */
    .mn-sources {
      margin-top: var(--sp-8);
      padding-top: var(--sp-5);
      border-top: 1px solid var(--border);
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.8;
    }
    .mn-sources strong { color: var(--text-secondary); font-weight: 700; margin-right: 6px; }
    .mn-sources-list {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }
    .mn-sources-list span {
      border: 1px solid var(--border);
      padding: 2px 8px;
      color: var(--text-secondary);
      background: var(--surface);
    }

    /* Error inline */
    .mn-error {
      background: var(--error-bg);
      color: var(--error-text);
      border-left: 3px solid var(--error-border);
      padding: 12px 16px;
      font-size: var(--text-base);
      margin-bottom: var(--sp-4);
    }
    .mn-ai-missing {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-left: 3px solid var(--warn-border);
      padding: 10px 14px;
      font-size: var(--text-sm);
      margin-bottom: var(--sp-4);
    }

    /* Spin */
    .mn-spin {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,31,51,0.3);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile */
    @media (max-width: 640px) {
      .mn-hero { padding: 24px 20px 26px; }
      .mn-hero-title { font-size: 1.35rem; }
      .mn-hero-tagline { font-size: var(--text-sm); }
      .mn-controls { flex-direction: column; align-items: stretch; }
      .mn-controls-right { justify-content: space-between; }
      .mn-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <a href="../../" class="back-btn">← アプリ一覧へ</a>
      <div class="navbar-divider"></div>
      <span class="navbar-title">Marketing News Radar</span>
    </div>
  </nav>

  <div class="container">

    <!-- Hero / Digest -->
    <section class="mn-hero" aria-label="本日のサマリ">
      <div class="mn-hero-meta">
        <span class="mn-hero-label">📡 Marketing News Radar</span>
        <span class="mn-hero-date" id="mn-date">—</span>
      </div>
      <h1 class="mn-hero-title">前日の動きを、マーケ視点で3行に。</h1>
      <p class="mn-hero-tagline">
        AI・マーケ・市場・コミュニティの11媒体から直近のトピックを自動収集し、マーケ担当者向けに日本語要約をつけて一覧表示します。
      </p>
      <div class="mn-digest" id="mn-digest-box">
        <div class="mn-digest-label">今日のサマリ（AI生成）</div>
        <div class="mn-digest-body" id="mn-digest">
          <div class="mn-digest-skeleton" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <!-- AI missing warning -->
    <div id="mn-ai-warn" class="mn-ai-missing" hidden>
      ANTHROPIC_API_KEY が未設定のため、日本語要約とサマリはオフです。環境変数を設定すると自動で有効になります。
    </div>

    <!-- Controls -->
    <div class="mn-controls">
      <div class="mn-tabs" role="tablist" aria-label="カテゴリ">
        <button class="mn-tab active" data-category="all"       role="tab" aria-selected="true">すべて <span class="mn-tab-count" data-count="all">0</span></button>
        <button class="mn-tab"         data-category="ai"        role="tab">🤖 AI <span class="mn-tab-count" data-count="ai">0</span></button>
        <button class="mn-tab"         data-category="marketing" role="tab">📈 マーケ <span class="mn-tab-count" data-count="marketing">0</span></button>
        <button class="mn-tab"         data-category="community" role="tab">💬 コミュニティ <span class="mn-tab-count" data-count="community">0</span></button>
      </div>
      <div class="mn-controls-right">
        <label for="mn-window" style="font-size:var(--text-sm);color:var(--text-muted);">期間</label>
        <select id="mn-window" class="mn-select" aria-label="表示する期間">
          <option value="24h">直近24時間</option>
          <option value="48h">直近48時間</option>
          <option value="7d">直近7日</option>
        </select>
        <button class="mn-refresh" id="mn-refresh" type="button">
          <span id="mn-refresh-icon">↻</span>
          <span id="mn-refresh-text">更新</span>
        </button>
      </div>
    </div>

    <div id="mn-error" class="mn-error" hidden></div>

    <!-- Articles grid -->
    <div class="mn-grid" id="mn-grid" aria-live="polite">
      <!-- skeletons -->
      <div class="mn-skeleton-card"></div>
      <div class="mn-skeleton-card"></div>
      <div class="mn-skeleton-card"></div>
      <div class="mn-skeleton-card"></div>
      <div class="mn-skeleton-card"></div>
      <div class="mn-skeleton-card"></div>
    </div>

    <!-- Sources strip -->
    <div class="mn-sources" id="mn-sources" hidden>
      <strong>収集元:</strong>
      <span class="mn-sources-list" id="mn-sources-list"></span>
    </div>

  </div>

  <script src="../../assets/onboarding.js"></script>
  <script>
    initOnboarding({
      appName: 'marketing-news',
      title: 'Marketing News Radar',
      description: 'AI・マーケ・市場トレンドの最新動向を、毎朝3行サマリで。',
      features: [
        { icon: '📡', text: 'AI・マーケ・市場・コミュニティ11媒体から自動収集' },
        { icon: '🇯🇵', text: '英語記事も日本語タイトル＋マーケ視点の要約つき' },
        { icon: '⚡', text: '「今日のサマリ」で要点を3行キャッチアップ' },
        { icon: '🎛️', text: '期間（24h/48h/7d）とカテゴリで絞り込み可能' }
      ],
      updates: [
        { date: '04/15', text: '新規公開：AI・マーケ・市場・コミュニティ11媒体を統合ダッシュボード化' }
      ]
    });
  </script>

  <script>
    // ── Marketing News Radar client ─────────────────────────

    const state = {
      category: 'all',
      window: '24h',
      loading: false,
      articles: [],
      counts: { all: 0, ai: 0, marketing: 0, community: 0 },
      sources: [],
      digest: '',
      hasAI: true,
    };

    const $  = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // Today label
    function todayLabel() {
      const d = new Date();
      const days = ['日','月','火','水','木','金','土'];
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
    }
    $('#mn-date').textContent = todayLabel();

    // Escaping
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function categoryLabel(c) {
      return { ai: 'AI', marketing: 'MARKETING', community: 'COMMUNITY' }[c] || c;
    }

    function relativeTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
      if (mins < 60) return `${mins}分前`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs}時間前`;
      const days = Math.round(hrs / 24);
      return `${days}日前`;
    }

    function renderDigest() {
      const box = $('#mn-digest');
      if (!state.digest) {
        box.innerHTML = state.hasAI
          ? '<div style="opacity:0.6;font-size:0.9em;">（該当期間のニュースが少ないためサマリを省略）</div>'
          : '<div style="opacity:0.7;">AI要約は無効です（ANTHROPIC_API_KEY 未設定）</div>';
        return;
      }
      box.textContent = state.digest;
    }

    function renderCounts() {
      for (const cat of ['all', 'ai', 'marketing', 'community']) {
        const el = document.querySelector(`.mn-tab-count[data-count="${cat}"]`);
        if (el) el.textContent = state.counts[cat] || 0;
      }
    }

    function renderGrid() {
      const grid = $('#mn-grid');
      const list = state.articles.filter(a => state.category === 'all' || a.category === state.category);

      if (!list.length) {
        grid.innerHTML = `
          <div class="mn-state" style="grid-column: 1 / -1;">
            <span class="mn-state-emoji">🫧</span>
            <div class="mn-state-title">該当する記事がありませんでした</div>
            <div class="mn-state-desc">期間やカテゴリを変更してお試しください。</div>
          </div>`;
        return;
      }

      grid.innerHTML = list.map(a => {
        const title = a.title_ja || a.title;
        const summary = a.summary_ja || a.summary || '';
        return `
          <article class="mn-card" data-category="${esc(a.category)}">
            <header class="mn-card-head">
              <span class="mn-chip" data-category="${esc(a.category)}">${esc(categoryLabel(a.category))}</span>
              <span class="mn-meta">
                <span class="mn-source">${esc(a.source)}</span>
                <span class="mn-dot">·</span>
                <span>${esc(relativeTime(a.published))}</span>
              </span>
            </header>
            <h3 class="mn-card-title">
              <a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>
            </h3>
            <p class="mn-card-summary">${esc(summary).slice(0, 280) || '<span style="color:var(--text-faint);">（要約は準備中です）</span>'}</p>
            <footer class="mn-card-foot">
              <a class="mn-link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">元記事を読む →</a>
              <span class="mn-lang">${esc((a.lang || '').toUpperCase())}</span>
            </footer>
          </article>`;
      }).join('');
    }

    function renderSources() {
      if (!state.sources.length) return;
      $('#mn-sources').hidden = false;
      $('#mn-sources-list').innerHTML = state.sources
        .map(s => `<span title="${esc(s.category)}">${esc(s.name)}</span>`)
        .join('');
    }

    function showError(msg) {
      const el = $('#mn-error');
      el.textContent = msg;
      el.hidden = false;
    }

    function hideError() { $('#mn-error').hidden = true; }

    function setLoading(on) {
      state.loading = on;
      const btn = $('#mn-refresh');
      const icon = $('#mn-refresh-icon');
      const txt = $('#mn-refresh-text');
      btn.disabled = on;
      if (on) {
        icon.outerHTML = '<span class="mn-spin" id="mn-refresh-icon" aria-hidden="true"></span>';
        txt.textContent = '読み込み中…';
        $('#mn-grid').innerHTML = Array(6).fill('<div class="mn-skeleton-card"></div>').join('');
        $('#mn-digest').innerHTML = '<div class="mn-digest-skeleton" aria-hidden="true"></div>';
      } else {
        // restore icon
        const cur = $('#mn-refresh-icon');
        if (cur) cur.outerHTML = '<span id="mn-refresh-icon">↻</span>';
        txt.textContent = '更新';
      }
    }

    async function fetchNews({ force = false } = {}) {
      hideError();
      setLoading(true);
      try {
        const params = new URLSearchParams({ window: state.window, category: 'all' });
        if (force) params.set('_', Date.now().toString());
        const res = await fetch(`/api/marketing-news?${params.toString()}`);
        if (!res.ok) throw new Error(`APIエラー (${res.status})`);
        const data = await res.json();
        state.articles = Array.isArray(data.articles) ? data.articles : [];
        state.counts = data.counts || state.counts;
        state.sources = data.sources || [];
        state.digest = data.digest || '';
        state.hasAI = data.hasAI !== false;
        if (!state.hasAI) $('#mn-ai-warn').hidden = false;
        renderCounts();
        renderDigest();
        renderGrid();
        renderSources();
      } catch (err) {
        showError('記事の取得に失敗しました: ' + err.message);
        $('#mn-grid').innerHTML = `
          <div class="mn-state" style="grid-column: 1 / -1;">
            <span class="mn-state-emoji">⚠️</span>
            <div class="mn-state-title">読み込みに失敗しました</div>
            <div class="mn-state-desc">ネットワークを確認して「更新」を押してください。</div>
          </div>`;
      } finally {
        setLoading(false);
      }
    }

    // Event wiring
    $$('.mn-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.mn-tab').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        state.category = btn.dataset.category;
        renderGrid();
      });
    });

    $('#mn-window').addEventListener('change', (e) => {
      state.window = e.target.value;
      fetchNews({ force: true });
    });

    $('#mn-refresh').addEventListener('click', () => fetchNews({ force: true }));

    // Initial load
    fetchNews();
  </script>
</body>
</html>
