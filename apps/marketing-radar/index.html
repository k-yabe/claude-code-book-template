<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Radar</title>
  <link rel="stylesheet" href="../../assets/app-styles.css">
  <style>
    body { min-height: 100vh; padding: 0; background: var(--bg); }

    /* ── Masthead (Navy全幅ヘッダー) ── */
    .masthead {
      background: var(--navy);
      color: #fff;
      padding: 0 0 32px;
      position: relative;
      overflow: hidden;
    }
    .masthead::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 90% 20%, rgba(255,184,28,0.07) 0%, transparent 50%),
        radial-gradient(circle at 10% 80%, rgba(0,255,255,0.05) 0%, transparent 40%);
      pointer-events: none;
    }
    .mast-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--sp-5);
      position: relative;
    }

    /* ── Greeting row ── */
    .greeting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 28px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .greeting {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.6);
      font-weight: 500;
    }
    .greeting strong {
      color: var(--gold);
      font-weight: 700;
    }
    .mast-date {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.45);
      font-variant-numeric: tabular-nums;
    }

    /* ── Title block ── */
    .mast-title-block { margin-bottom: 24px; }
    .mast-kicker {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.62rem;
      font-weight: 800;
      padding: 3px 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .mast-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin: 0;
    }
    .mast-title .accent { color: var(--gold); }
    .mast-sub {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ── Stats strip ── */
    .stats-strip {
      display: flex;
      gap: 2px;
      margin-bottom: 28px;
    }
    .stat-box {
      flex: 1;
      background: rgba(255,255,255,0.06);
      padding: 12px 16px;
      text-align: center;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .stat-box:hover { border-bottom-color: var(--gold); }
    .stat-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 2px;
    }
    .stat-num.gold { color: var(--gold); }
    .stat-label {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.45);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* ── Hero (非対称グリッド: 1 featured + 2 sub) ── */
    .hero-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
    }
    @media (max-width: 760px) {
      .hero-grid { grid-template-columns: 1fr; }
    }
    .hero-card {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid var(--gold);
      padding: 16px 18px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: background 0.2s;
    }
    .hero-card:hover { background: rgba(255,255,255,0.1); }
    .hero-card.featured {
      grid-row: 1 / 3;
      padding: 24px;
      border-left-width: 4px;
    }
    .hero-card.featured .hero-card-title {
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.35;
      -webkit-line-clamp: 4;
    }
    .hero-card.featured .hero-card-summary {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.5;
      margin-top: 10px;
    }
    .hero-card-source {
      font-size: 0.68rem;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .hero-card-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-card-summary { display: none; }
    .hero-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 20px;
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* ── Content area ── */
    .content-area {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--sp-4) var(--sp-5) 60px;
    }

    /* ── Sticky filter bar ── */
    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      padding: 14px 0 12px;
      margin-bottom: var(--sp-3);
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--navy); color: var(--navy); }
    .chip.is-active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }
    .chip .cnt {
      display: inline-block;
      min-width: 18px;
      text-align: center;
      background: rgba(0,0,0,0.08);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      margin-left: 5px;
      font-variant-numeric: tabular-nums;
    }
    .chip.is-active .cnt {
      background: rgba(255,255,255,0.2);
    }
    .date-chips .chip.is-active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
    }
    .date-chips .chip.is-active .cnt { background: rgba(0,31,51,0.15); }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .search-box input {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 6px 10px;
      font-size: 0.78rem;
      color: var(--navy);
      width: 180px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--navy); }
    .search-box input::placeholder { color: var(--text-faint); }

    /* ── Section header ── */
    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--sp-3);
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy);
      position: relative;
      padding-bottom: 4px;
    }
    .section-title::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 2px;
      background: var(--gold);
    }
    .section-count {
      font-size: 0.72rem;
      color: var(--text-faint);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ── News grid ── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    /* ── News card ── */
    .news-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 0;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: cardIn 0.35s ease forwards;
    }
    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,31,51,0.1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-accent {
      height: 3px;
      width: 100%;
    }
    .news-card[data-cat="marketing_jp"]     .card-accent { background: var(--gold); }
    .news-card[data-cat="marketing_global"] .card-accent { background: var(--cyan); }
    .news-card[data-cat="business"]         .card-accent { background: var(--navy); }
    .news-card[data-cat="tech"]             .card-accent { background: var(--navy-60); }
    .news-card[data-cat="sns"]              .card-accent { background: var(--gold-60); }

    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Source avatar + meta */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .src-avatar {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--gold);
      background: var(--navy);
      flex-shrink: 0;
    }
    .src-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .src-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .src-time {
      font-size: 0.65rem;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }
    .card-cat-badge {
      margin-left: auto;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 8px;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      background: var(--surface-alt);
    }
    .news-card[data-cat="marketing_jp"]     .card-cat-badge { border-color: var(--gold-40); color: var(--navy); background: var(--gold-20); }
    .news-card[data-cat="marketing_global"] .card-cat-badge { border-color: rgba(0,255,255,0.25); color: var(--navy); background: rgba(0,255,255,0.08); }
    .news-card[data-cat="business"]         .card-cat-badge { border-color: var(--navy-20); color: var(--navy); background: rgba(0,31,51,0.05); }
    .news-card[data-cat="tech"]             .card-cat-badge { border-color: var(--navy-40); color: var(--navy-80); background: rgba(0,31,51,0.04); }
    .news-card[data-cat="sns"]              .card-cat-badge { border-color: var(--gold-40); color: var(--navy); background: var(--gold-20); }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.45;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-summary {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 16px;
      border-top: 1px solid var(--border-light);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--navy);
      gap: 4px;
    }
    .card-footer .arr { transition: transform 0.15s; }
    .news-card:hover .card-footer .arr { transform: translateX(3px); }

    /* Yesterday badge */
    .news-card.is-yesterday .card-accent {
      background: var(--gold);
      height: 4px;
    }
    .ystd-badge {
      position: absolute;
      top: 3px;
      right: 0;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.58rem;
      font-weight: 800;
      padding: 2px 8px;
      letter-spacing: 0.06em;
    }

    /* ── Empty / skeleton ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-faint);
    }
    .empty-state .e-icon { font-size: 2.5rem; opacity: 0.4; margin-bottom: 10px; }
    .empty-state .e-msg { font-size: 0.88rem; line-height: 1.6; }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .sk-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 16px;
      height: 180px;
    }
    .sk-line {
      background: linear-gradient(90deg, var(--border-light) 0%, var(--surface-alt) 50%, var(--border-light) 100%);
      background-size: 200% 100%;
      animation: sk 1.4s ease-in-out infinite;
      height: 10px;
      margin-bottom: 10px;
    }
    .sk-line.w60 { width: 60%; } .sk-line.w80 { width: 80%; } .sk-line.w40 { width: 40%; }
    .sk-line.w30 { width: 30%; }
    @keyframes sk { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }

    /* ── Refresh button ── */
    .refresh-btn {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .mast-title { font-size: 1.4rem; }
      .stats-strip { flex-wrap: wrap; }
      .stat-box { flex: 1 1 45%; }
      .hero-grid { grid-template-columns: 1fr; }
      .hero-card.featured { grid-row: auto; padding: 16px; }
      .hero-card.featured .hero-card-title { font-size: 1rem; }
      .search-box input { width: 130px; }
      .news-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-card.featured { grid-row: auto; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <a href="../../" class="back-btn">&larr; アプリ一覧へ</a>
      <div class="navbar-divider"></div>
      <span class="navbar-title">Marketing Radar</span>
    </div>
  </nav>

  <!-- ── Masthead ── -->
  <header class="masthead">
    <div class="mast-inner">
      <div class="greeting-row">
        <div class="greeting" id="greeting"></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="mast-date" id="mast-date"></span>
          <button class="refresh-btn" id="refresh-btn" aria-label="データ再読み込み">&#x21bb; 更新</button>
        </div>
      </div>

      <div class="mast-title-block">
        <span class="mast-kicker">DAILY MARKETING INTELLIGENCE</span>
        <h1 class="mast-title">Marketing <span class="accent">Radar</span></h1>
        <p class="mast-sub">国内外マーケ・市場・テックの主要ニュースを12媒体から日次収集</p>
      </div>

      <!-- Stats strip -->
      <div class="stats-strip" id="stats-strip">
        <div class="stat-box"><div class="stat-num" id="st-today">—</div><div class="stat-label">今日</div></div>
        <div class="stat-box"><div class="stat-num gold" id="st-yesterday">—</div><div class="stat-label">前日</div></div>
        <div class="stat-box"><div class="stat-num" id="st-week">—</div><div class="stat-label">7日間</div></div>
        <div class="stat-box"><div class="stat-num" id="st-sources">12</div><div class="stat-label">ソース数</div></div>
      </div>

      <!-- Hero -->
      <div class="hero-section-title">YESTERDAY'S HIGHLIGHTS</div>
      <div class="hero-grid" id="hero-grid"></div>
    </div>
  </header>

  <!-- ── Content ── -->
  <main class="content-area">
    <div class="filter-bar">
      <div class="chip-group" id="cat-chips" role="tablist" aria-label="カテゴリ"></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <div class="chip-group date-chips" role="tablist" aria-label="期間">
          <button class="chip" data-range="today">今日</button>
          <button class="chip is-active" data-range="yesterday">前日</button>
          <button class="chip" data-range="7d">7日間</button>
          <button class="chip" data-range="all">全期間</button>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="キーワード検索…" aria-label="キーワード検索" />
        </div>
      </div>
    </div>

    <div class="section-head">
      <div class="section-title" id="section-title">ニュース一覧</div>
      <span class="section-count" id="section-count"></span>
    </div>

    <div id="news-area">
      <div class="skeleton-grid" id="skeleton">
        <div class="sk-card"><div class="sk-line w30"></div><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w80"></div><div class="sk-line w40"></div></div>
        <div class="sk-card"><div class="sk-line w30"></div><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w80"></div><div class="sk-line w40"></div></div>
        <div class="sk-card"><div class="sk-line w30"></div><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w80"></div><div class="sk-line w40"></div></div>
        <div class="sk-card"><div class="sk-line w30"></div><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w80"></div><div class="sk-line w40"></div></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <span class="app-footer-text">&copy; RSSから取得した記事タイトル・要約の権利は各発行元に帰属します</span>
  </footer>

  <script>
    const state = {
      items: [],
      categories: {},
      activeCategory: 'all',
      activeRange: 'yesterday',
      searchQuery: '',
      generatedAt: '',
    };

    /* ── Utilities ── */
    function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
    function daysAgoStart(n) { const x = startOfDay(new Date()); x.setDate(x.getDate() - n); return x; }

    function formatRelative(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const h = Math.floor((Date.now() - d.getTime()) / 3600000);
      if (h < 1) return 'たった今';
      if (h < 24) return h + '時間前';
      const day = Math.floor(h / 24);
      if (day < 7) return day + '日前';
      return d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
    }

    function isYesterday(iso) {
      if (!iso) return false;
      const d = new Date(iso);
      return d >= daysAgoStart(1) && d < startOfDay(new Date());
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function sourceInitial(label) {
      if (!label) return '?';
      return label.charAt(0).toUpperCase();
    }

    /* ── Greeting ── */
    function setGreeting() {
      const h = new Date().getHours();
      let g = 'こんばんは';
      if (h < 12) g = 'おはようございます';
      else if (h < 18) g = 'こんにちは';
      document.getElementById('greeting').innerHTML = g + '。<strong>今日のマーケインテル</strong>をチェック';
      const now = new Date();
      const wd = ['日','月','火','水','木','金','土'][now.getDay()];
      document.getElementById('mast-date').textContent =
        now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate() + '(' + wd + ')';
    }

    /* ── Data loading ── */
    async function loadData() {
      try {
        const res = await fetch('data/news.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        state.items = Array.isArray(data.items) ? data.items : [];
        state.categories = data.categories || {};
        state.generatedAt = data.generated_at || '';
        render();
      } catch (e) {
        console.error(e);
        document.getElementById('news-area').innerHTML =
          '<div class="empty-state"><div class="e-icon">&#x26A0;&#xFE0F;</div><div class="e-msg">データを読み込めませんでした (' + esc(e.message) + ')</div></div>';
      }
    }

    /* ── Stats ── */
    function countByRange(items, range) {
      const now = new Date();
      const endToday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const startToday = startOfDay(now);
      const startYstd = daysAgoStart(1);
      const start7d = daysAgoStart(7);
      return items.filter(it => {
        if (!it.published_at) return false;
        const d = new Date(it.published_at);
        if (range === 'today')     return d >= startToday && d < endToday;
        if (range === 'yesterday') return d >= startYstd  && d < startToday;
        if (range === '7d')        return d >= start7d    && d < endToday;
        return true;
      }).length;
    }

    function renderStats() {
      document.getElementById('st-today').textContent     = countByRange(state.items, 'today');
      document.getElementById('st-yesterday').textContent  = countByRange(state.items, 'yesterday');
      document.getElementById('st-week').textContent       = countByRange(state.items, '7d');
    }

    /* ── Hero ── */
    function renderHero() {
      const ystd = state.items.filter(it => isYesterday(it.published_at));
      const grid = document.getElementById('hero-grid');
      if (ystd.length === 0) {
        grid.innerHTML = '<div class="hero-empty">前日のニュースはまだありません。<br>GitHub Actions が毎日 JST 7:00 に自動収集します。</div>';
        return;
      }
      const top = ystd.slice(0, 3);
      grid.innerHTML = top.map((it, i) => {
        const cls = i === 0 ? 'hero-card featured' : 'hero-card';
        const summary = i === 0 && it.summary
          ? '<div class="hero-card-summary">' + esc(it.summary) + '</div>' : '';
        return '<a class="' + cls + '" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">'
          + '<div class="hero-card-source">' + esc(it.source_label || '') + '</div>'
          + '<div class="hero-card-title">' + esc(it.title) + '</div>'
          + summary + '</a>';
      }).join('');
    }

    /* ── Category chips ── */
    function renderCatChips() {
      const counts = { all: state.items.length };
      state.items.forEach(it => { counts[it.category] = (counts[it.category] || 0) + 1; });
      const order = ['all','marketing_jp','marketing_global','business','tech','sns'];
      const labels = { all: 'すべて', ...state.categories };
      const el = document.getElementById('cat-chips');
      el.innerHTML = order
        .filter(k => k === 'all' || labels[k])
        .map(k => '<button class="chip' + (k === state.activeCategory ? ' is-active' : '')
          + '" data-cat="' + esc(k) + '" role="tab" aria-selected="' + (k === state.activeCategory) + '">'
          + esc(labels[k] || k) + '<span class="cnt">' + (counts[k] || 0) + '</span></button>').join('');
      el.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', function() {
          state.activeCategory = this.dataset.cat;
          render();
        });
      });
    }

    /* ── Filter ── */
    function filterItems() {
      let items = state.items;
      if (state.activeCategory !== 'all') {
        items = items.filter(it => it.category === state.activeCategory);
      }
      const now = new Date();
      const endToday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const startToday = startOfDay(now);
      const startYstd = daysAgoStart(1);
      const start7d = daysAgoStart(7);
      items = items.filter(it => {
        if (!it.published_at) return state.activeRange === 'all';
        const d = new Date(it.published_at);
        if (state.activeRange === 'today')     return d >= startToday && d < endToday;
        if (state.activeRange === 'yesterday') return d >= startYstd  && d < startToday;
        if (state.activeRange === '7d')        return d >= start7d    && d < endToday;
        return true;
      });
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        items = items.filter(it =>
          (it.title || '').toLowerCase().includes(q)
          || (it.summary || '').toLowerCase().includes(q)
          || (it.source_label || '').toLowerCase().includes(q)
        );
      }
      return items;
    }

    /* ── Card list ── */
    function renderList() {
      const items = filterItems();
      const area = document.getElementById('news-area');
      document.getElementById('section-count').textContent = items.length + '件';

      if (items.length === 0) {
        area.innerHTML = '<div class="empty-state"><div class="e-icon">&#x1F4ED;</div><div class="e-msg">この条件のニュースはありません。<br>期間やカテゴリを変えてみてください。</div></div>';
        return;
      }

      const catLabels = state.categories;
      area.innerHTML = '<div class="news-grid">' + items.map(function(it, idx) {
        var yesterday = isYesterday(it.published_at);
        var delay = Math.min(idx * 40, 600);
        return '<a class="news-card' + (yesterday ? ' is-yesterday' : '') + '" data-cat="' + esc(it.category) + '"'
          + ' href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer"'
          + ' style="animation-delay:' + delay + 'ms">'
          + '<div class="card-accent"></div>'
          + (yesterday ? '<div class="ystd-badge">前日</div>' : '')
          + '<div class="card-body">'
          + '<div class="card-meta">'
          + '<div class="src-avatar">' + esc(sourceInitial(it.source_label)) + '</div>'
          + '<div class="src-info"><span class="src-name">' + esc(it.source_label || '') + '</span>'
          + '<span class="src-time">' + esc(formatRelative(it.published_at)) + '</span></div>'
          + '<span class="card-cat-badge">' + esc(catLabels[it.category] || it.category) + '</span>'
          + '</div>'
          + '<div class="card-title">' + esc(it.title) + '</div>'
          + '<div class="card-summary">' + esc(it.summary || '') + '</div>'
          + '</div>'
          + '<div class="card-footer">記事を読む <span class="arr">&rarr;</span></div>'
          + '</a>';
      }).join('') + '</div>';
    }

    /* ── Master render ── */
    function render() {
      renderStats();
      renderCatChips();
      renderHero();
      renderList();
    }

    /* ── Events ── */
    document.querySelectorAll('.date-chips .chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.date-chips .chip').forEach(function(b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        state.activeRange = btn.dataset.range;
        renderList();
      });
    });

    var searchTimer;
    document.getElementById('search-input').addEventListener('input', function(e) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function() {
        state.searchQuery = e.target.value.trim();
        renderList();
      }, 250);
    });

    document.getElementById('refresh-btn').addEventListener('click', loadData);

    /* ── Init ── */
    setGreeting();
    loadData();
  </script>
