<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Resizer</title>
  <link rel="stylesheet" href="../../assets/app-styles.css">
  <style>
    /* ── App-specific: Banner Resizer ── */

    .step-desc { font-size: var(--text-xs); color: var(--text-faint); margin-left: auto; }

    /* Format selector */
    .format-row { display: flex; align-items: center; gap: 10px; }
    .format-label { font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); }
    .format-btn {
      padding: 6px 18px; border: 1.5px solid var(--border); font-size: 0.82rem;
      font-weight: 700; cursor: pointer; background: var(--surface); color: var(--text-muted);
      transition: all var(--ease); font-family: inherit;
    }
    .format-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

    /* Drop zone */
    .dropzone {
      border: 2px dashed var(--border); padding: 16px; text-align: center;
      cursor: pointer; transition: all 0.2s; background: var(--surface-alt);
    }
    .dropzone:hover, .dropzone.over { border-color: var(--navy); background: var(--border-light); }
    .dropzone-icon { font-size: 1.2rem; margin-bottom: 2px; color: var(--text-faint); }
    .dropzone-text { font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); margin-bottom: 1px; }
    .dropzone-sub { font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; }
    .dropzone input { display: none; }
    .dropzone.has-image {
      padding: 8px 14px; border-style: solid; border-color: var(--navy);
      background: rgba(0,31,51,0.03);
    }
    .dropzone.has-image .dropzone-icon { display: none; }
    .dropzone.has-image .dropzone-text { font-size: 0.75rem; color: var(--navy); }
    .dropzone.has-image .dropzone-sub { color: var(--text-muted); }

    /* Output area — hidden until image uploaded */
    .group-outputs { display: none; margin-top: 12px; }
    .group-outputs.active { display: block; }
    .group-outputs.active.output-cards { display: grid; }

    /* Output cards */
    .output-cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
    .output-card { background: var(--surface-alt); border: 1.5px solid var(--border); padding: 12px; }
    .output-card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .output-card-dot { width: 8px; height: 8px; flex-shrink: 0; }
    .output-card-title { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .output-card-badge {
      display: inline-block; font-size: 0.6rem; font-weight: 700;
      padding: 1px 5px; margin-left: 2px;
    }
    .output-card-meta { font-size: var(--text-xs); color: var(--text-faint); margin-bottom: 6px; }

    .preview-canvas-wrap {
      width: 100%; background: var(--border); overflow: hidden; margin-bottom: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .preview-canvas-wrap canvas { width: 100%; height: auto; display: block; }

    .ai-loading { padding: 12px 8px; font-size: 0.75rem; color: var(--text-muted); text-align: center; line-height: 1.6; }
    .ai-loading-spinner { display: inline-block; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .option-check {
      display: flex; align-items: center; gap: 5px; margin-bottom: 3px;
      font-size: var(--text-xs); color: var(--text-muted); cursor: pointer; user-select: none;
    }
    .option-check input[type="checkbox"] { accent-color: var(--navy); width: 12px; height: 12px; cursor: pointer; }

    .file-size-info { font-size: var(--text-xs); color: var(--text-muted); margin: 4px 0 6px; min-height: 1.1em; }

    .dl-btn {
      width: 100%; padding: 7px; background: var(--bg); color: var(--navy); border: none;
      font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all var(--ease);
      font-family: inherit;
    }
    .dl-btn:hover { background: var(--navy); color: var(--white); }
    .dl-btn:disabled { opacity: 0.4; cursor: default; }
    .dl-btn:disabled:hover { background: var(--bg); color: var(--navy); }

    /* ZIP download */
    .dl-all-step .step-body { padding: 10px 16px; }
    .dl-all-btn {
      width: 100%; padding: 14px; background: var(--navy); color: var(--white); border: none;
      font-size: var(--text-md); font-weight: 700; cursor: pointer; transition: opacity var(--ease);
      letter-spacing: 0.04em; font-family: inherit;
    }
    .dl-all-btn:hover { opacity: 0.85; }

    /* Crop position drag */
    .preview-canvas-wrap.draggable { cursor: grab; position: relative; }
    .preview-canvas-wrap.draggable:active { cursor: grabbing; }
    .crop-hint {
      position: absolute; bottom: 4px; right: 6px;
      font-size: 0.65rem; font-weight: 600; color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.5); padding: 2px 6px; pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 600px) {
      .output-cards { grid-template-columns: 1fr; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand">
    <a href="../../" class="back-btn">← アプリ一覧へ</a>
    <div class="navbar-divider"></div>
    <span class="navbar-title">Banner Resizer</span>
  </div>
</nav>
<div class="container">
  <div class="page-header">
    <h1>Banner Resizer</h1>
    <p class="page-desc">画像をアップロードして、MV・OGP・サムネイルを規定サイズに変換します</p>
  </div>

  <!-- Step 1: Format -->
  <div class="step">
    <div class="step-header">
      <span class="step-num">1</span>
      <span class="step-title">出力形式</span>
      <span class="step-desc">OGPはPNG固定（100KB以下）</span>
    </div>
    <div class="step-body">
      <div class="format-row">
        <span class="format-label">形式：</span>
        <button class="format-btn active" id="btn-webp" onclick="setFormat('webp')">WebP</button>
        <button class="format-btn" id="btn-png" onclick="setFormat('png')">PNG</button>
      </div>
    </div>
  </div>

  <!-- Step 2: MV / OGP -->
  <div class="step">
    <div class="step-header">
      <span class="step-num">2</span>
      <span class="step-title">MV / OGP</span>
      <span class="step-desc">1枚の画像からMVとOGPを生成</span>
    </div>
    <div class="step-body">
      <div class="dropzone" id="dz-mv" role="button" aria-label="MV/OGP用の画像をドラッグ＆ドロップまたはクリックして選択" tabindex="0" onclick="document.getElementById('file-mv').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('file-mv').click()}">
        <div class="dropzone-icon">📤</div>
        <div class="dropzone-text">画像をドロップ or クリック</div>
        <div class="dropzone-sub">推奨: 1920×1080px</div>
        <input type="file" id="file-mv" accept="image/png,image/jpeg,image/webp">
      </div>
      <div class="group-outputs" id="outputs-mv"></div>
    </div>
  </div>

  <!-- Step 3: Thumbnail -->
  <div class="step">
    <div class="step-header">
      <span class="step-num">3</span>
      <span class="step-title">一覧サムネイル（index）</span>
      <span class="step-desc">CMS上で上下24px・左右100pxが自動カット</span>
    </div>
    <div class="step-body">
      <div class="dropzone" id="dz-thumb" role="button" aria-label="サムネイル用の画像をドラッグ＆ドロップまたはクリックして選択" tabindex="0" onclick="document.getElementById('file-thumb').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('file-thumb').click()}">
        <div class="dropzone-icon">📤</div>
        <div class="dropzone-text">画像をドロップ or クリック</div>
        <div class="dropzone-sub">推奨: 1920×1080px</div>
        <input type="file" id="file-thumb" accept="image/png,image/jpeg,image/webp">
      </div>
      <div class="group-outputs" id="outputs-thumb"></div>
    </div>
  </div>

  <!-- Download all -->
  <div class="step dl-all-step">
    <div class="step-body">
      <button class="dl-all-btn" id="dl-all-btn" onclick="downloadAll()">📦 まとめてダウンロード（ZIP）</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@1.0.11/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
<script>
  if (localStorage.getItem('auth') !== '1') { location.href = '/'; }

  // Verify UPNG.js loaded
  if (typeof UPNG === 'undefined') console.warn('⚠ UPNG.js not loaded — PNG8 optimization disabled');
  else console.log('✓ UPNG.js loaded');

  // Group definitions: which sizes belong to which upload
  const GROUPS = [
    {
      id: 'mv',
      sizes: [
        { id: 'banner', label: 'バナー（MV）', w: 1920, h: 1080, dlName: 'img-mv', maxBytes: 1 * 1024 * 1024, color: '#ffb81c', crop: true },
        { id: 'ogp',    label: 'OGP',         w: 1200, h: 630, forcePng: true, aiUpscale: true, dlName: 'img-ogp', maxBytes: 500 * 1024, crop: true, color: '#001f33' },
      ],
    },
    {
      id: 'thumb',
      sizes: [
        { id: 'index', label: '一覧サムネイル（index）', w: 1920, h: 1080, dlName: 'img-index', maxBytes: 1 * 1024 * 1024, color: '#001f33', crop: true, thumbTrim: { top: 24, bottom: 24, left: 100, right: 100 } },
      ],
    },
  ];

  const ALL_SIZES = GROUPS.flatMap(g => g.sizes);
  let format = 'webp';
  const sourceImages = {};  // groupId → Image
  const aiUpscaleFlags = {};
  const cropOffsets = {};   // sizeId → {x: 0~1, y: 0~1} (0=left/top, 0.5=center, 1=right/bottom)
  const cropZooms = {};     // sizeId → zoom level (1.0 = no zoom, 2.0 = 2x zoom in)
  const cropDragAborts = {}; // sizeId → AbortController (for cleaning up event listeners)
  const safeAreaFitFlags = {}; // sizeId → boolean (auto-margin生成モード)

  // ── AI Upscale ────────────────────────────────────────
  let _libsLoading = null;
  let _upscaler = null;

  function loadAILibs() {
    if (_libsLoading) return _libsLoading;
    _libsLoading = (async () => {
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/upscalerjs@1.0.0-beta.18/dist/browser/umd/upscaler.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@1.0.0-beta.16/dist/browser/umd/2x.min.js');
    })();
    return _libsLoading;
  }

  function loadImageFromSrc(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  async function createWithAI(img, w, h, crop, cropOffset, zoom) {
    if (img.width >= w && img.height >= h) {
      return createResized(img, w, h, crop, cropOffset, zoom);
    }
    try {
      await loadAILibs();
      if (!_upscaler) {
        const modelArg = window.ESRGANSlim ? window.ESRGANSlim['2x'] : undefined;
        _upscaler = new Upscaler(modelArg ? { model: modelArg } : {});
      }
      const upscaledSrc = await _upscaler.upscale(img);
      const upscaledImg = await loadImageFromSrc(upscaledSrc);
      return createResized(upscaledImg, w, h, crop, cropOffset, zoom);
    } catch (e) {
      console.warn('AI upscale failed, using standard resize:', e);
      return createResized(img, w, h, crop);
    }
  }

  // ── Format selector ───────────────────────────────────
  function setFormat(f) {
    format = f;
    document.getElementById('btn-png').classList.toggle('active', f === 'png');
    document.getElementById('btn-webp').classList.toggle('active', f === 'webp');
    for (const g of GROUPS) {
      if (sourceImages[g.id]) renderGroup(g);
    }
  }

  // ── Build output cards ────────────────────────────────
  function buildOutputCards() {
    for (const group of GROUPS) {
      const container = document.getElementById('outputs-' + group.id);
      if (group.sizes.length > 1) container.classList.add('output-cards');

      for (const size of group.sizes) {
        if (aiUpscaleFlags[size.id] === undefined) {
          aiUpscaleFlags[size.id] = size.aiUpscale === true;
        }
        const card = document.createElement('div');
        card.className = 'output-card';
        const maxLabel = size.maxBytes >= 1024*1024 ? (size.maxBytes/1024/1024)+'MB' : (size.maxBytes/1024)+'KB';
        card.innerHTML = `
          <div class="output-card-header">
            <span class="output-card-dot" style="background:${size.color}"></span>
            <span class="output-card-title">${size.label}${size.forcePng ? '<span class="output-card-badge" style="color:#001f33;background:#ffb81c;">PNG固定</span>' : ''}</span>
          </div>
          <div class="output-card-meta">${size.w}×${size.h}px　/　上限 ${maxLabel}${size.crop ? '　/　センタークロップ' : ''}</div>
          <div id="small-warn-${size.id}" style="display:none;font-size:0.78rem;color:#c0392b;background:#fff5f4;padding:6px 10px;margin-bottom:8px;font-weight:600;"></div>
          <label class="option-check">
            <input type="checkbox" id="ai-check-${size.id}" ${aiUpscaleFlags[size.id] ? 'checked' : ''}
              onchange="toggleAiUpscale('${group.id}', '${size.id}', this.checked)">
            AIアップスケール（小さい画像を高品質拡大）
          </label>
          <div class="preview-canvas-wrap" id="wrap-${size.id}" style="display:none;"></div>
          ${size.thumbTrim ? `<label class="option-check">
            <input type="checkbox" id="trim-check-${size.id}" checked
              onchange="toggleThumbTrim('${group.id}', '${size.id}', this.checked)">
            サムネイル時のカット領域を表示
          </label>
          <label class="option-check" title="要素を端まで配置していてもCMSで切れないよう、元画像をセーフエリア（${size.w - (size.thumbTrim.left + size.thumbTrim.right)}×${size.h - (size.thumbTrim.top + size.thumbTrim.bottom)}px）内に縮小し、外周はぼかし背景で自動生成します">
            <input type="checkbox" id="safearea-check-${size.id}"
              onchange="toggleSafeAreaFit('${group.id}', '${size.id}', this.checked)">
            セーフエリア内に収めて周囲を自動生成（カット対策）
          </label>` : ''}
          <div class="file-size-info" id="filesize-${size.id}"></div>
          <button class="dl-btn" id="dl-btn-${size.id}" onclick="downloadSingle('${group.id}', '${size.id}')" disabled>ダウンロード</button>
        `;
        container.appendChild(card);
      }
    }
  }

  // ── Drag & Drop ───────────────────────────────────────
  function setupDropZones() {
    for (const group of GROUPS) {
      const dz = document.getElementById('dz-' + group.id);
      const fileInput = document.getElementById('file-' + group.id);

      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('over'));
      dz.addEventListener('drop', e => {
        e.preventDefault();
        dz.classList.remove('over');
        if (e.dataTransfer.files[0]) loadFileForGroup(e.dataTransfer.files[0], group);
      });
      fileInput.addEventListener('change', e => {
        if (e.target.files[0]) loadFileForGroup(e.target.files[0], group);
      });
    }
  }

  function loadFileForGroup(file, group) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        sourceImages[group.id] = img;
        renderGroup(group);
        const dz = document.getElementById('dz-' + group.id);
        dz.classList.add('has-image');
        dz.querySelector('.dropzone-text').textContent = `✅ ${file.name}（クリックで変更）`;
        dz.querySelector('.dropzone-sub').textContent = `${img.width}×${img.height}px`;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── Render group ──────────────────────────────────────
  async function renderGroup(group) {
    const img = sourceImages[group.id];
    if (!img) return;

    // Show output cards
    const outputContainer = document.getElementById('outputs-' + group.id);
    outputContainer.classList.add('active');

    for (const size of group.sizes) {
      // fitWidth: 横幅固定で縦は元画像のアスペクト比に合わせる
      let targetW = size.w;
      let targetH = size.h;
      if (size.fitWidth) {
        targetW = size.w;
        targetH = Math.round(size.w * (img.height / img.width));
      }

      // Show warning if source image is smaller than target
      const warnEl = document.getElementById('small-warn-' + size.id);
      const isSrcSmall = img.width < targetW || img.height < targetH;
      const aiEnabled = !!aiUpscaleFlags[size.id];
      if (isSrcSmall && warnEl) {
        warnEl.style.display = 'block';
        warnEl.innerHTML = `⚠ 元画像（${img.width}×${img.height}）がターゲット（${targetW}×${targetH}）より小さいため、拡大により画質が低下します${!aiEnabled ? '。AIアップスケールの有効化を推奨します' : ''}`;
      } else if (warnEl) {
        warnEl.style.display = 'none';
      }

      // Update displayed size to reflect actual output
      const metaEl = document.querySelector(`#wrap-${size.id}`)?.closest('.output-card')?.querySelector('.output-card-meta');
      if (metaEl && size.fitWidth) {
        const maxLabel = size.maxBytes >= 1024*1024 ? (size.maxBytes/1024/1024)+'MB' : (size.maxBytes/1024)+'KB';
        metaEl.textContent = `${targetW}×${targetH}px　/　上限 ${maxLabel}　/　横幅固定`;
      }

      // Store actual target for download
      size._actualW = targetW;
      size._actualH = targetH;

      // Initialize crop offset (default: center) and zoom (default: 1x)
      if (!cropOffsets[size.id]) cropOffsets[size.id] = { x: 0.5, y: 0.5 };
      if (!cropZooms[size.id]) cropZooms[size.id] = 1;
      const offset = cropOffsets[size.id];
      const zoom = cropZooms[size.id];

      const wrap = document.getElementById('wrap-' + size.id);
      wrap.style.display = 'flex';
      wrap.innerHTML = '';

      const safeAreaFit = !!safeAreaFitFlags[size.id] && !!size.thumbTrim;
      const needsAI = aiEnabled && (img.width < targetW || img.height < targetH);

      if (safeAreaFit) {
        // セーフエリアフィット: zoom/drag も有効化（安全エリア内でパン＆ズーム、範囲外はクリップ）
        let baseImg = img;
        if (needsAI) {
          wrap.innerHTML = '<div class="ai-loading"><span class="ai-loading-spinner">⏳</span><br>AI処理中...</div>';
          try {
            await loadAILibs();
            if (!_upscaler) {
              const modelArg = window.ESRGANSlim ? window.ESRGANSlim['2x'] : undefined;
              _upscaler = new Upscaler(modelArg ? { model: modelArg } : {});
            }
            const upscaledSrc = await _upscaler.upscale(img);
            baseImg = await loadImageFromSrc(upscaledSrc);
          } catch (e) {
            console.warn('AI upscale failed, using original:', e);
          }
          wrap.innerHTML = '';
        }
        const canvas = createWithSafeAreaFit(baseImg, targetW, targetH, size.thumbTrim, offset, zoom);
        canvas.id = 'canvas-' + size.id;
        wrap.appendChild(canvas);
      } else if (needsAI) {
        wrap.innerHTML = '<div class="ai-loading"><span class="ai-loading-spinner">⏳</span><br>AI処理中...</div>';
        const canvas = await createWithAI(img, targetW, targetH, size.crop, offset, zoom);
        canvas.id = 'canvas-' + size.id;
        wrap.innerHTML = '';
        wrap.appendChild(canvas);
      } else {
        const canvas = createResized(img, targetW, targetH, size.crop, offset, zoom);
        canvas.id = 'canvas-' + size.id;
        wrap.appendChild(canvas);
      }

      // ドラッグ位置調整 + ホイール/ピンチズーム（セーフエリアfit中でも有効）
      if (size.crop) {
        wrap.classList.add('draggable');
        const hint = document.createElement('div');
        hint.className = 'crop-hint';
        hint.textContent = safeAreaFit
          ? '✥ 安全エリア内でドラッグ / ホイールでズーム'
          : '✥ ドラッグで位置調整 / ホイールでズーム';
        wrap.appendChild(hint);
        const zoomBadge = document.createElement('div');
        zoomBadge.className = 'crop-hint';
        zoomBadge.id = 'zoom-badge-' + size.id;
        zoomBadge.style.cssText = 'left:6px; right:auto; bottom:4px;';
        zoomBadge.textContent = zoom > 1 ? `🔍 ${Math.round(zoom * 100)}%` : '';
        wrap.appendChild(zoomBadge);
        setupCropDrag(wrap, size.id, group);
      }

      // カット領域オーバーレイ: trim チェックが ON なら safeAreaFit の有無に関わらず描画
      // （safeAreaFit 中でも「どこが切れる領域か」を確認したいケースがあるため両立可能にする）
      if (size.thumbTrim) {
        const trimCheck = document.getElementById('trim-check-' + size.id);
        const show = trimCheck ? trimCheck.checked : true;
        if (show) {
          const canvas = document.getElementById('canvas-' + size.id);
          drawThumbTrimOverlay(canvas, size.thumbTrim);
          canvas.dataset.thumbTrimOverlay = '1';
        }
      }

      document.getElementById('dl-btn-' + size.id).disabled = false;
      updateFileSizeDisplay(size.id, group.id);
    }
  }

  // ── Resize ────────────────────────────────────────────
  function createResized(img, targetW, targetH, crop, cropOffset, zoom) {
    let sx = 0, sy = 0, sw = img.width, sh = img.height;
    if (crop) {
      const ox = cropOffset ? cropOffset.x : 0.5;
      const oy = cropOffset ? cropOffset.y : 0.5;
      const z = Math.max(1, zoom || 1);
      const srcRatio = img.width / img.height;
      const dstRatio = targetW / targetH;
      if (srcRatio > dstRatio) {
        sw = img.height * dstRatio;
        sx = (img.width - sw) * ox;
      } else {
        sh = img.width / dstRatio;
        sy = (img.height - sh) * oy;
      }
      // Apply zoom: shrink crop rectangle (= zoom into the image)
      if (z > 1) {
        const newSw = sw / z;
        const newSh = sh / z;
        sx = sx + (sw - newSw) * ox;
        sy = sy + (sh - newSh) * oy;
        sw = newSw;
        sh = newSh;
      }
    }
    let srcCanvas = document.createElement('canvas');
    srcCanvas.width = sw;
    srcCanvas.height = sh;
    const srcCtx = srcCanvas.getContext('2d');
    srcCtx.imageSmoothingEnabled = true;
    srcCtx.imageSmoothingQuality = 'high';
    srcCtx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

    let curW = sw, curH = sh;
    while (curW / targetW > 2 || curH / targetH > 2) {
      const nextW = Math.max(Math.floor(curW / 2), targetW);
      const nextH = Math.max(Math.floor(curH / 2), targetH);
      const tmp = document.createElement('canvas');
      tmp.width = nextW;
      tmp.height = nextH;
      const tmpCtx = tmp.getContext('2d');
      tmpCtx.imageSmoothingEnabled = true;
      tmpCtx.imageSmoothingQuality = 'high';
      tmpCtx.drawImage(srcCanvas, 0, 0, nextW, nextH);
      srcCanvas = tmp;
      curW = nextW;
      curH = nextH;
    }

    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(srcCanvas, 0, 0, targetW, targetH);
    return canvas;
  }

  // ── Safe-area fit with auto-generated blurred margins ──
  // 元画像をセーフエリア(targetW - L - R, targetH - T - B)内にcontainで配置し、
  // 外周は同画像の拡大ぼかしで埋める。これによりCMSで自動カットされても本来の要素が失われない。
  // zoom > 1 の場合は「元画像の一部を拡大表示」としてセーフエリア内にクリップ描画する。
  // cropOffset は zoom > 1 時の表示位置（0〜1）。1倍時は中央固定で効かない。
  function createWithSafeAreaFit(img, targetW, targetH, thumbTrim, cropOffset, zoom) {
    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // 1. 背景: 拡大カバー＋ぼかし
    // ぼかしフィルタは縁の不透明度を落とすため、AKKODiSネイビーで下塗り
    ctx.fillStyle = '#001f33';
    ctx.fillRect(0, 0, targetW, targetH);

    const srcRatio = img.width / img.height;
    const dstRatio = targetW / targetH;
    let coverW, coverH;
    if (srcRatio > dstRatio) {
      coverH = targetH;
      coverW = coverH * srcRatio;
    } else {
      coverW = targetW;
      coverH = coverW / srcRatio;
    }
    // 1.15倍オーバースキャンしてぼかしの透明エッジを画面外に追い出す
    const overscan = 1.15;
    const bgW = coverW * overscan;
    const bgH = coverH * overscan;
    const bgX = (targetW - bgW) / 2;
    const bgY = (targetH - bgH) / 2;

    ctx.save();
    ctx.filter = 'blur(48px) brightness(0.88) saturate(1.05)';
    ctx.drawImage(img, bgX, bgY, bgW, bgH);
    ctx.restore();

    // 2. 前景: 安全エリア内に配置（zoom で拡大・cropOffset で位置調整、安全エリア外はクリップ）
    const safeW = targetW - thumbTrim.left - thumbTrim.right;
    const safeH = targetH - thumbTrim.top - thumbTrim.bottom;
    const safeRatio = safeW / safeH;
    // ベースは contain（zoom=1 で画像全体がセーフエリア内に収まる）
    let baseW, baseH;
    if (srcRatio > safeRatio) {
      baseW = safeW;
      baseH = baseW / srcRatio;
    } else {
      baseH = safeH;
      baseW = baseH * srcRatio;
    }
    const z = Math.max(1, zoom || 1);
    const dispW = baseW * z;
    const dispH = baseH * z;
    const ox = cropOffset ? cropOffset.x : 0.5;
    const oy = cropOffset ? cropOffset.y : 0.5;
    // ズーム時は画像が安全エリアよりはみ出すので cropOffset でパンニング、
    // はみ出さない軸は中央配置
    const fgX = dispW > safeW
      ? thumbTrim.left - (dispW - safeW) * ox
      : thumbTrim.left + (safeW - dispW) / 2;
    const fgY = dispH > safeH
      ? thumbTrim.top - (dispH - safeH) * oy
      : thumbTrim.top + (safeH - dispH) / 2;

    // セーフエリア外をクリップ（背景のぼかしを上書きしないため）
    ctx.save();
    ctx.beginPath();
    ctx.rect(thumbTrim.left, thumbTrim.top, safeW, safeH);
    ctx.clip();
    ctx.drawImage(img, fgX, fgY, dispW, dispH);
    ctx.restore();

    return canvas;
  }

  // ── Thumb trim overlay ────────────────────────────────
  function drawRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawThumbTrimOverlay(canvas, sz) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = 'rgba(255, 100, 100, 0.3)';
    ctx.fillRect(0, 0, w, sz.top);
    ctx.fillRect(0, h - sz.bottom, w, sz.bottom);
    ctx.fillRect(0, sz.top, sz.left, h - sz.top - sz.bottom);
    ctx.fillRect(w - sz.right, sz.top, sz.right, h - sz.top - sz.bottom);
    ctx.setLineDash([8, 5]);
    ctx.strokeStyle = '#ffb81c';
    ctx.lineWidth = 2;
    ctx.strokeRect(sz.left, sz.top, w - sz.left - sz.right, h - sz.top - sz.bottom);
    ctx.setLineDash([]);
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const safeW = w - sz.left - sz.right, safeH = h - sz.top - sz.bottom;
    const label = `サムネイル安全エリア ${safeW}×${safeH}px`;
    const lw = ctx.measureText(label).width + 16;
    const lx = w / 2 - lw / 2, ly = h - sz.bottom - 30;
    ctx.fillStyle = 'rgba(0, 230, 118, 0.85)';
    drawRoundRect(ctx, lx, ly, lw, 24, 5);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(label, w / 2, ly + 12);
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('サムネイル時にカットされる領域', w / 2, sz.top / 2 || 12);
  }

  // ── Crop position drag + zoom ─────────────────────────
  const ZOOM_MIN = 1, ZOOM_MAX = 3, ZOOM_STEP = 0.1;

  function setupCropDrag(wrap, sizeId, group) {
    // Abort previous listeners for this sizeId to prevent accumulation
    if (cropDragAborts[sizeId]) cropDragAborts[sizeId].abort();
    const ac = new AbortController();
    cropDragAborts[sizeId] = ac;
    const sig = { signal: ac.signal };

    let startX = 0, startY = 0;
    let startOx = 0, startOy = 0;
    let dragging = false;
    let pinchStartDist = 0, pinchStartZoom = 1;
    let rafPending = false;

    function scheduleRerender() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => { rafPending = false; rerenderSingleSize(sizeId, group); });
    }

    // ── Drag (1-finger touch / mouse) ──
    function onStart(e) {
      if (e.touches && e.touches.length >= 2) return;
      e.preventDefault();
      dragging = true;
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX;
      startY = pt.clientY;
      startOx = cropOffsets[sizeId].x;
      startOy = cropOffsets[sizeId].y;
      wrap.style.cursor = 'grabbing';
    }
    function onMove(e) {
      if (!dragging) return;
      if (e.touches && e.touches.length >= 2) { dragging = false; return; }
      e.preventDefault();
      const pt = e.touches ? e.touches[0] : e;
      const dx = -(pt.clientX - startX) / wrap.offsetWidth;
      const dy = -(pt.clientY - startY) / wrap.offsetHeight;
      cropOffsets[sizeId] = {
        x: Math.max(0, Math.min(1, startOx + dx)),
        y: Math.max(0, Math.min(1, startOy + dy))
      };
      scheduleRerender();
    }
    function onEnd() {
      if (!dragging) return;
      dragging = false;
      wrap.style.cursor = '';
      updateFileSizeDisplay(sizeId, group.id);
    }

    // ── Wheel zoom (desktop) ──
    function onWheel(e) {
      e.preventDefault();
      const dir = e.deltaY < 0 ? 1 : -1;
      const cur = cropZooms[sizeId] || 1;
      cropZooms[sizeId] = Math.round(Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, cur + dir * ZOOM_STEP)) * 100) / 100;
      scheduleRerender();
      updateFileSizeDisplay(sizeId, group.id);
    }

    // ── Pinch zoom (touch) ──
    function getPinchDist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }
    function onTouchStart(e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        dragging = false;
        pinchStartDist = getPinchDist(e.touches);
        pinchStartZoom = cropZooms[sizeId] || 1;
      } else if (e.touches.length === 1) {
        onStart(e);
      }
    }
    function onTouchMove(e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = getPinchDist(e.touches);
        const scale = dist / pinchStartDist;
        cropZooms[sizeId] = Math.round(Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom * scale)) * 100) / 100;
        scheduleRerender();
      } else {
        onMove(e);
      }
    }
    function onTouchEnd(e) {
      if (e.touches.length < 2) {
        updateFileSizeDisplay(sizeId, group.id);
      }
      if (e.touches.length === 0) onEnd();
    }

    // ── Double-click reset ──
    function onDblClick(e) {
      e.preventDefault();
      cropOffsets[sizeId] = { x: 0.5, y: 0.5 };
      cropZooms[sizeId] = 1;
      rerenderSingleSize(sizeId, group);
      updateFileSizeDisplay(sizeId, group.id);
    }

    wrap.addEventListener('mousedown', onStart, sig);
    wrap.addEventListener('touchstart', onTouchStart, { passive: false, signal: ac.signal });
    document.addEventListener('mousemove', onMove, sig);
    document.addEventListener('touchmove', onTouchMove, { passive: false, signal: ac.signal });
    document.addEventListener('mouseup', onEnd, sig);
    document.addEventListener('touchend', onTouchEnd, sig);
    wrap.addEventListener('wheel', onWheel, { passive: false, signal: ac.signal });
    wrap.addEventListener('dblclick', onDblClick, sig);
  }

  function rerenderSingleSize(sizeId, group) {
    const size = ALL_SIZES.find(s => s.id === sizeId);
    const img = sourceImages[group.id];
    if (!size || !img) return;
    const targetW = size._actualW || size.w;
    const targetH = size._actualH || size.h;
    const offset = cropOffsets[sizeId];
    const zoom = cropZooms[sizeId] || 1;
    const wrap = document.getElementById('wrap-' + sizeId);
    if (!wrap) return;
    const safeAreaFit = !!safeAreaFitFlags[sizeId] && !!size.thumbTrim;
    const canvas = safeAreaFit
      ? createWithSafeAreaFit(img, targetW, targetH, size.thumbTrim, offset, zoom)
      : createResized(img, targetW, targetH, size.crop, offset, zoom);
    // Update zoom badge
    const badge = document.getElementById('zoom-badge-' + sizeId);
    if (badge) badge.textContent = zoom > 1 ? `🔍 ${Math.round(zoom * 100)}%` : '';
    canvas.id = 'canvas-' + sizeId;
    // Keep hint element, replace only canvas
    const oldCanvas = wrap.querySelector('canvas');
    if (oldCanvas) {
      wrap.replaceChild(canvas, oldCanvas);
    }
    if (size.thumbTrim) {
      const trimCheck = document.getElementById('trim-check-' + sizeId);
      if (trimCheck && trimCheck.checked) {
        drawThumbTrimOverlay(canvas, size.thumbTrim);
        canvas.dataset.thumbTrimOverlay = '1';
      }
    }
  }

  function toggleThumbTrim(groupId, sizeId, show) {
    const img = sourceImages[groupId];
    if (!img) return;
    const size = ALL_SIZES.find(s => s.id === sizeId);
    if (!size || !size.thumbTrim) return;
    // renderGroup に委譲する（safeAreaFit の有無に関わらず現在の canvas を再生成＋オーバーレイ再適用）
    const group = GROUPS.find(g => g.id === groupId);
    if (group) renderGroup(group);
  }

  function toggleSafeAreaFit(groupId, sizeId, enabled) {
    safeAreaFitFlags[sizeId] = enabled;
    // 2つのチェックボックスは独立に動作可能（カット領域表示はユーザー選択を尊重）
    const group = GROUPS.find(g => g.id === groupId);
    if (sourceImages[groupId] && group) renderGroup(group);
  }

  function toggleAiUpscale(groupId, sizeId, enabled) {
    aiUpscaleFlags[sizeId] = enabled;
    const group = GROUPS.find(g => g.id === groupId);
    if (sourceImages[groupId] && group) renderGroup(group);
  }

  // ── File size display ─────────────────────────────────
  async function updateFileSizeDisplay(sizeId, groupId) {
    const size = ALL_SIZES.find(s => s.id === sizeId);
    if (!size) return;
    const el = document.getElementById('filesize-' + sizeId);
    if (!el) return;
    const blob = await getBlob(sizeId, groupId);
    if (!blob) return;
    const label = blob.size >= 1024 * 1024 ? (blob.size / 1024 / 1024).toFixed(1) + 'MB' : (blob.size / 1024).toFixed(0) + 'KB';
    const maxLabel = size.maxBytes >= 1024*1024 ? (size.maxBytes/1024/1024) + 'MB' : (size.maxBytes/1024) + 'KB';
    const over = size.maxBytes && blob.size > size.maxBytes;
    let status;
    if (over) {
      status = '<span style="color:#e53935;font-weight:600;">⚠ 超過</span>';
    } else if (blob._compressed) {
      status = `<span style="color:#2196f3;">自動圧縮済み（Q:${Math.round(blob._appliedQuality * 100)}%）✓</span>`;
    } else if (blob._pngOptimized) {
      status = `<span style="color:#2196f3;">自動最適化済み（PNG8 ${blob._pngColors}色${blob._pngDenoise ? ' +平滑化' : ''}）✓</span>`;
    } else {
      status = '<span style="color:#43a047;">✓</span>';
    }
    el.innerHTML = `📦 ${label} / 上限 ${maxLabel}　${status}`;
  }

  // ── PNG8 optimization (UPNG.js indexed color) ──────────
  // Light denoise: 3×3 box blur to reduce noise before PNG8 quantization
  // This lets the same color count look much smoother (fewer wasted palette entries on noise)
  function denoiseCanvas(srcCanvas) {
    const w = srcCanvas.width, h = srcCanvas.height;
    const srcCtx = srcCanvas.getContext('2d');
    const src = srcCtx.getImageData(0, 0, w, h);
    const dst = srcCtx.createImageData(w, h);
    const sd = src.data, dd = dst.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let r = 0, g = 0, b = 0, a = 0, cnt = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
              const i = (ny * w + nx) * 4;
              r += sd[i]; g += sd[i+1]; b += sd[i+2]; a += sd[i+3];
              cnt++;
            }
          }
        }
        const i = (y * w + x) * 4;
        dd[i] = (r / cnt + 0.5) | 0;
        dd[i+1] = (g / cnt + 0.5) | 0;
        dd[i+2] = (b / cnt + 0.5) | 0;
        dd[i+3] = (a / cnt + 0.5) | 0;
      }
    }
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    out.getContext('2d').putImageData(dst, 0, 0);
    return out;
  }

  function encodePng8(canvas, numColors, denoise) {
    try {
      const src = denoise ? denoiseCanvas(canvas) : canvas;
      const w = src.width, h = src.height;
      const ctx = src.getContext('2d');
      const imgData = ctx.getImageData(0, 0, w, h);
      // UPNG.encode needs a copy of the buffer (not a view)
      const rgba = new Uint8Array(imgData.data);
      const pngArrayBuffer = UPNG.encode([rgba.buffer], w, h, numColors);
      return new Blob([pngArrayBuffer], { type: 'image/png' });
    } catch (e) {
      console.error('UPNG.js encode failed:', e);
      return null;
    }
  }

  // ── Blob generation ───────────────────────────────────
  function getRequestedMimeType(forcePng) {
    if (forcePng) return 'image/png';
    return format === 'webp' ? 'image/webp' : 'image/png';
  }
  function getExtFromMime(mime) {
    if (mime === 'image/webp') return 'webp';
    if (mime === 'image/jpeg') return 'jpg';
    return 'png';
  }

  function getBlob(sizeId, groupId) {
    return new Promise(async resolve => {
      const size = ALL_SIZES.find(s => s.id === sizeId);
      if (!size) { resolve(null); return; }
      const domCanvas = document.getElementById('canvas-' + sizeId);
      let canvas;
      const overlayBaked = domCanvas && domCanvas.dataset.thumbTrimOverlay;
      const dlW = size._actualW || size.w;
      const dlH = size._actualH || size.h;
      if (safeAreaFitFlags[sizeId] && size.thumbTrim && sourceImages[groupId]) {
        // セーフエリアfit: overlay焼き込み時はクリーン版を再生成、そうでなければDOMを再利用
        canvas = overlayBaked
          ? createWithSafeAreaFit(sourceImages[groupId], dlW, dlH, size.thumbTrim, cropOffsets[sizeId], cropZooms[sizeId])
          : domCanvas;
      } else if (overlayBaked && sourceImages[groupId]) {
        canvas = createResized(sourceImages[groupId], dlW, dlH, size.crop, cropOffsets[sizeId], cropZooms[sizeId]);
      } else {
        canvas = domCanvas;
      }
      if (!canvas) { resolve(null); return; }
      const mimeType = getRequestedMimeType(size.forcePng);
      const maxBytes = size.maxBytes;
      const toBlob = (q) => new Promise(r => canvas.toBlob(b => r(b), mimeType, q));
      let blob = await toBlob(0.92);
      // Auto-compress: reduce quality stepwise to meet size limit
      let appliedQuality = 0.92;
      if (maxBytes && blob && blob.size > maxBytes) {
        if (mimeType !== 'image/png') {
          // Lossy format — reduce quality
          const steps = [0.85, 0.80, 0.75, 0.70];
          for (const q of steps) {
            blob = await toBlob(q);
            appliedQuality = q;
            if (blob.size <= maxBytes) break;
          }
        }
        else if (typeof UPNG !== 'undefined') {
          // PNG8 — indexed color via UPNG.js (like TinyPNG)
          // Strategy: try without denoise first, then with denoise
          // Denoise reduces noise → same color count produces smaller files
          // → higher color count fits under limit → better quality
          const colorSteps = [256, 192, 128, 96, 64, 48, 32, 24, 16];
          let fitsBlob = null, fitsColors = 0, fitsDenoise = false;
          let fallbackBlob = null, fallbackColors = 0;

          // Pass 1: no denoise (sharpest)
          for (const nc of colorSteps) {
            const pBlob = encodePng8(canvas, nc, false);
            if (!pBlob) continue;
            if (!fallbackBlob) { fallbackBlob = pBlob; fallbackColors = nc; }
            if (pBlob.size <= maxBytes) {
              fitsBlob = pBlob; fitsColors = nc; fitsDenoise = false;
              break;
            }
          }

          // Pass 2: with denoise — only if pass 1 result uses ≤64 colors
          // (low color = visible banding; denoise lets us use MORE colors)
          if (!fitsBlob || fitsColors <= 64) {
            const denoiseTarget = fitsColors || 999;
            for (const nc of colorSteps) {
              if (fitsBlob && nc <= fitsColors) continue; // only try higher colors
              const pBlob = encodePng8(canvas, nc, true);
              if (!pBlob) continue;
              if (pBlob.size <= maxBytes) {
                // Denoise version fits with MORE colors → better quality
                fitsBlob = pBlob; fitsColors = nc; fitsDenoise = true;
                break;
              }
            }
          }

          if (fitsBlob) {
            blob = fitsBlob;
            blob._pngOptimized = true;
            blob._pngColors = fitsColors;
            blob._pngDenoise = fitsDenoise;
          } else if (fallbackBlob && fallbackBlob.size < blob.size) {
            blob = fallbackBlob;
            blob._pngOptimized = true;
            blob._pngColors = fallbackColors;
          }
        }
      }
      if (blob && blob.type !== mimeType && !blob._actualExt) {
        blob._actualExt = getExtFromMime(blob.type);
      }
      blob._appliedQuality = appliedQuality;
      blob._compressed = appliedQuality < 0.92;
      resolve(blob);
    });
  }

  // ── Download ──────────────────────────────────────────
  function findGroupForSize(sizeId) {
    return GROUPS.find(g => g.sizes.some(s => s.id === sizeId));
  }

  function downloadSingle(groupId, sizeId) {
    const size = ALL_SIZES.find(s => s.id === sizeId);
    if (!size || !document.getElementById('canvas-' + sizeId)) return;
    getBlob(sizeId, groupId).then(blob => {
      if (!blob) return;
      const ext = blob._actualExt || (size.forcePng ? 'png' : format);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${size.dlName}.${ext}`;
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  async function downloadAll() {
    const btn = document.getElementById('dl-all-btn');
    const hasAny = GROUPS.some(g => sourceImages[g.id]);
    if (!hasAny) {
      alert('画像がアップロードされていません。');
      return;
    }
    btn.textContent = '⏳ 生成中...';
    btn.disabled = true;

    const zip = new JSZip();
    for (const group of GROUPS) {
      if (!sourceImages[group.id]) continue;
      for (const size of group.sizes) {
        const blob = await getBlob(size.id, group.id);
        if (!blob) continue;
        const ext = blob._actualExt || (size.forcePng ? 'png' : format);
        zip.file(`${size.dlName}.${ext}`, blob);
      }
    }

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'images_resized.zip';
