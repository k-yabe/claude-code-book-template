<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Task Board</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --p0: #ff4444;
  --p1: #ff8800;
  --p2: #e3b341;
  --p3: #4488ff;
  --col-new: #6e7681;
  --col-ip: #388bfd;
  --col-bl: #f85149;
  --col-done: #3fb950;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* ---- Header ---- */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.header h1 { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.header-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }

select, input[type="text"], textarea {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 13px;
  font-family: inherit;
}
select:focus, input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.btn {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--bg2); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { opacity: 0.85; }
.btn.danger { color: #f85149; border-color: #f85149; }

/* ---- Stats ---- */
.stats {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text2);
}
.stat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.stat-num { font-weight: 700; color: var(--text); }

/* ---- Board ---- */
.board {
  display: flex;
  gap: 12px;
  padding: 16px;
  overflow-x: auto;
  align-items: flex-start;
  min-height: calc(100vh - 100px);
}

.column {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  flex: 1;
  min-width: 220px;
  max-width: 320px;
  display: flex;
  flex-direction: column;
}
.col-header {
  padding: 10px 12px;
  font-weight: 600;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.col-dot { width: 10px; height: 10px; border-radius: 50%; }
.col-count {
  margin-left: auto;
  background: var(--bg3);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 11px;
  color: var(--text2);
}

.card-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 60px; transition: background 0.15s; }
.card-list.drag-over { background: rgba(88,166,255,0.08); outline: 2px dashed #58a6ff; outline-offset: -2px; }
.card[draggable] { cursor: grab; }
.card[draggable]:active { cursor: grabbing; opacity: 0.6; }
.empty-col { text-align: center; color: var(--text2); font-size: 12px; padding: 16px 0; }

/* ---- Card ---- */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--accent); }

.card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.card-id { font-size: 11px; color: var(--text2); font-family: monospace; }
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  color: #fff;
}
.badge.P0 { background: var(--p0); }
.badge.P1 { background: var(--p1); }
.badge.P2 { background: var(--p2); color: #0d1117; }
.badge.P3 { background: var(--p3); }

.card-title { font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.card-assignee { font-size: 11px; color: var(--text2); }
.team-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 500;
}
.team-research    { background: #00808033; color: #00d4aa; border: 1px solid #00d4aa44; }
.team-personal    { background: #c0556033; color: #ff8fab; border: 1px solid #ff8fab44; }
.team-engineering { background: #0d419d33; color: #58a6ff; border: 1px solid #58a6ff44; }
.team-content     { background: #6e40c933; color: #b687f7; border: 1px solid #b687f744; }
.team-business    { background: #9e6a0333; color: #e3b341; border: 1px solid #e3b34144; }
.team-infrastructure { background: #1a7f3733; color: #3fb950; border: 1px solid #3fb95044; }

.blocked-badge { font-size: 11px; color: var(--p0); margin-top: 4px; }
.comment-count { font-size: 11px; color: var(--text2); margin-left: auto; }

/* ---- Modal overlay ---- */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 16px;
}
.overlay.hidden { display: none; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-id { font-size: 12px; color: var(--text2); font-family: monospace; }
.modal-title { font-size: 15px; font-weight: 600; flex: 1; }
.modal-close {
  background: none; border: none; color: var(--text2);
  font-size: 18px; cursor: pointer; padding: 0 4px;
}
.modal-close:hover { color: var(--text); }

.modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.field select, .field input, .field textarea { width: 100%; }
.field textarea { resize: vertical; min-height: 70px; }
.row { display: flex; gap: 10px; }
.row .field { flex: 1; }

.comments-section { border-top: 1px solid var(--border); padding-top: 10px; }
.section-label { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 8px; }
.comment-item { margin-bottom: 8px; padding: 8px; background: var(--bg3); border-radius: 6px; }
.comment-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text2); margin-bottom: 3px; }
.comment-author { font-weight: 600; }
.comment-text { font-size: 12px; line-height: 1.5; }
.comment-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.comment-form textarea { min-height: 50px; font-size: 13px; }
.comment-form-bottom { display: flex; gap: 6px; align-items: center; }
.comment-form-bottom select { flex: 1; }

@media (max-width: 700px) {
  .board { flex-direction: column; }
  .column { max-width: 100%; }
}
</style>
</head>

var ASSIGNEE_LABELS = {
  'human': '👤 human',
  'research-analyst': '🔎 research-analyst',
  'career-advisor': '🧭 career-advisor',
  'tech-lead': '🔧 tech-lead',
  'frontend-engineer': '🎨 frontend-engineer',
  'backend-engineer': '⚙️ backend-engineer',
  'qa-engineer': '🧪 qa-engineer',
  'content-director': '📝 content-director',
  'brand-voice': '🎙️ brand-voice',
  'root-cause': '🔍 root-cause',
  'anti-ai-slop': '🚫 anti-ai-slop',
  'marketing-director': '📣 marketing-director',
  'business-strategist': '💼 business-strategist',
  'partnership-manager': '🤝 partnership-manager',
  'legal-review': '⚖️ legal-review',
  'task-dispatcher': '📬 task-dispatcher'

  'research': 'リサーチ',
  'personal': 'パーソナル',
  'engineering': 'エンジニア',
  'content': 'コンテンツ',
  'business': 'ビジネス',
  'infrastructure': 'インフラ'
};

var TEAM_COLORS = {
  'engineering': '#388bfd',
  'content': '#b687f7',
  'business': '#e3b341',
  'infrastructure': '#3fb950'
};

var GITHUB_BASE = 'https://github.com/k-yabe/claude-code-book-template/blob/main/ai-agent-org/';

function linkifyComment(text) {
  var safe = h(text);
  // context/projects/T001-xxx-output.md → GitHub リンク
  safe = safe.replace(/(context\/projects\/[^\s<]+\.md)/g, function(m) {
    return '<a href="' + GITHUB_BASE + m + '" target="_blank" style="color:#58a6ff">' + m + '</a>';
  });
  // 改行を <br> に
  return safe.replace(/\n/g, '<br>');
}

function h(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    return d.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { tasks = JSON.parse(raw); return; }
  } catch (e) {}
  tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  save();
}

function getPat() { return localStorage.getItem(PAT_KEY) || ''; }
function setPat(t) { localStorage.setItem(PAT_KEY, t); }
function showPatDialog() {
  var cur = getPat();
  var v = prompt('GitHub Personal Access Token を入力してください\n（Contents: Read and write 権限が必要です）', cur);
  if (v === null) return;
  setPat(v.trim());
  setSyncStatus(v.trim() ? '🔑 トークン設定済み' : '🔑 トークン未設定', v.trim() ? '#3fb950' : '#f85149');
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function pushToGitHub() {
  var pat = getPat();
  if (!pat) {
    setSyncStatus('⚠️ GitHubに保存されていません — 🔑 ボタンでトークンを設定してください', '#f85149');
    return Promise.resolve();
  }
  setSyncStatus('保存中...', '#58a6ff');
  var payload = JSON.stringify({ version: '1.0', lastUpdated: new Date().toISOString(), tasks: tasks }, null, 2);
  return fetch(GITHUB_API_URL, { headers: { Authorization: 'token ' + pat, Accept: 'application/vnd.github.v3+json' } })
    .then(function(r) { return r.json(); })
    .then(function(meta) {
      return fetch(GITHUB_API_URL, {
        method: 'PUT',
        headers: { Authorization: 'token ' + pat, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'bot: タスクボードから更新', content: btoa(unescape(encodeURIComponent(payload))), sha: meta.sha })
      });
    })
    .then(function(r) {
      if (r.ok) setSyncStatus('✅ GitHubに保存 ' + new Date().toLocaleTimeString('ja-JP'), '#3fb950');
      else setSyncStatus('⚠️ GitHub保存失敗', '#f85149');
    })
    .catch(function() { setSyncStatus('⚠️ GitHub保存失敗', '#f85149'); });
}

function saveAndPush() {
  save();
  executePush();
}

function executePush() {
  if (pushInFlight) {
    // pushが進行中なら完了後に最新状態で再実行
    pushPending = true;
    return;
  }
  pushInFlight = true;
  pushPending = false;
  pushToGitHub().finally(function() {
    pushInFlight = false;
    if (pushPending) {
      pushPending = false;
      executePush();
    }
  });
}

function setSyncStatus(msg, color) {
  var el = document.getElementById('syncStatus');
  if (el) { el.textContent = msg; el.style.color = color || '#8b949e'; }
}

function loadFromGitHub(silent) {
  if (!silent) setSyncStatus('同期中...', '#58a6ff');
  return fetch(GITHUB_TASKS_URL + '?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var fetched = data.tasks || data;
      if (!Array.isArray(fetched)) throw new Error('invalid');
      tasks = fetched;
      save();
      lastSynced = new Date();
      setSyncStatus('最終同期: ' + lastSynced.toLocaleTimeString('ja-JP'), '#3fb950');
      render();
    })
    .catch(function() {
      setSyncStatus('GitHub取得失敗 — ローカルデータを使用', '#f85149');
      load();
      render();
    });
}

function syncNow() { loadFromGitHub(false); }

function startAutoRefresh() {
  setInterval(function() {
    // モーダルが開いている間は上書きしない
    if (editingId || !document.getElementById('createOverlay').classList.contains('hidden')) return;
    loadFromGitHub(true);
  }, 60000);
}

function nextId() {
  if (!tasks.length) return 'T001';
  var max = 0;
  tasks.forEach(function(t) {
    var n = parseInt(t.id.replace('T', ''), 10);
    if (n > max) max = n;
  });
  var s = String(max + 1);
  while (s.length < 3) s = '0' + s;
  return 'T' + s;
}

function filtered() {
  var fa = document.getElementById('filterAssignee').value;
  var ft = document.getElementById('filterTeam').value;
  var fo = document.getElementById('filterOrg').value;
  var fq = (document.getElementById('filterText').value || '').toLowerCase();
  return tasks.filter(function(t) {
    if (fa && t.assignee !== fa) return false;
    if (ft && t.team !== ft) return false;
    if (fo && t.organization !== fo) return false;
    if (fq) {
      var hay = ((t.title || '') + ' ' + (t.description || '') + ' ' + (t.id || '')).toLowerCase();
      if (hay.indexOf(fq) === -1) return false;
    }
    return true;
  });
}

function render() {
  var ft = filtered();
  var cols = ['new-assigned', 'in-progress', 'blocked', 'done'];
  cols.forEach(function(col) {
    var list = document.getElementById('list-' + col);
    var cnt = document.getElementById('cnt-' + col);
    var colTasks = ft.filter(function(t) { return t.status === col; });
    cnt.textContent = colTasks.length;
    if (!colTasks.length) {
      list.innerHTML = '<div class="empty-col">タスクなし</div>';
      return;
    }
    list.innerHTML = colTasks.map(function(t) { return cardHTML(t); }).join('');
  });
  renderStats();
}

function cardHTML(t) {
  var blocked = (t.status === 'blocked' && t.blockedReason)
    ? '<div class="blocked-badge">⛔ ' + h(t.blockedReason) + '</div>' : '';
  var cc = (t.comments && t.comments.length)
    ? '<span class="comment-count">💬 ' + t.comments.length + '</span>' : '';
  var teamLabel = TEAM_LABELS[t.team] || t.team;
  var assigneeLabel = ASSIGNEE_LABELS[t.assignee] || t.assignee;
  return '<div class="card" draggable="true" ondragstart="onDragStart(event,\'' + h(t.id) + '\')" onclick="openDetail(\'' + h(t.id) + '\')">'
    + '<div class="card-top">'
    + '<span class="card-id">' + h(t.id) + '</span>'
    + '<span class="badge ' + h(t.priority) + '">' + h(t.priority) + '</span>'
    + cc
    + '</div>'
    + '<div class="card-title">' + h(t.title) + '</div>'
    + '<div class="card-meta">'
    + '<span class="card-assignee">' + h(assigneeLabel) + '</span>'
    + '<span class="team-tag team-' + h(t.team) + '">' + h(teamLabel) + '</span>'
    + '</div>'
    + blocked
    + '</div>';
}

function renderStats() {
  var all = tasks;
  var bar = document.getElementById('statsBar');
  var teams = ['engineering', 'content', 'business', 'infrastructure'];
  var html = '<span>📋 総タスク: <span class="stat-num">' + all.length + '</span></span>';
  teams.forEach(function(t) {
    var cnt = all.filter(function(x) { return x.team === t; }).length;
    var color = TEAM_COLORS[t] || '#888';
    html += '<span><span class="stat-dot" style="background:' + color + '"></span>'
      + (TEAM_LABELS[t] || t) + ': <span class="stat-num">' + cnt + '</span></span>';
  });
  bar.innerHTML = html;
}

function openDetail(id) {
  var t = tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  editingId = id;
  document.getElementById('dId').textContent = t.id;
  document.getElementById('dTitle').textContent = t.title;
  document.getElementById('dStatus').value = t.status;
  document.getElementById('dPriority').value = t.priority;
  document.getElementById('dAssignee').value = t.assignee;
  document.getElementById('dTeam').value = t.team;
  document.getElementById('dOrg').value = t.organization || 'private';
  document.getElementById('dDesc').value = t.description || '';
  document.getElementById('dBlockedReason').value = t.blockedReason || '';
  syncBlockedField();
  renderComments(t);
  document.getElementById('cInput').value = '';
  document.getElementById('detailOverlay').classList.remove('hidden');
}

function syncBlockedField() {
  var status = document.getElementById('dStatus').value;
  document.getElementById('dBlockedWrap').style.display = status === 'blocked' ? '' : 'none';
  document.getElementById('retryBtn').style.display = status === 'blocked' ? '' : 'none';
}

function retryTask() {
  var t = tasks.find(function(x) { return x.id === editingId; });
  if (!t) return;
  t.status = 'new-assigned';
  t.blockedReason = '';
  t.updatedAt = new Date().toISOString();
  t.comments.push({ author: 'human', content: '🔁 ブロック解除 — 再実行キューに戻しました', timestamp: new Date().toISOString() });
  saveAndPush();
  document.getElementById('dStatus').value = 'new-assigned';
  document.getElementById('dBlockedReason').value = '';
  syncBlockedField();
  renderComments(t);
  render();
}

function renderComments(t) {
  var el = document.getElementById('dComments');
  if (!t.comments || !t.comments.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text2);padding:4px 0">コメントはまだありません</div>';
    return;
  }
  el.innerHTML = t.comments.map(function(c) {
    return '<div class="comment-item">'
      + '<div class="comment-meta">'
      + '<span class="comment-author">' + h(ASSIGNEE_LABELS[c.author] || c.author) + '</span>'
      + '<span>' + h(fmtDate(c.timestamp)) + '</span>'
      + '</div>'
      + '<div class="comment-text">' + linkifyComment(c.content) + '</div>'
      + '</div>';
  }).join('');
}

function updateField(field, value) {
  var t = tasks.find(function(x) { return x.id === editingId; });
  if (!t) return;
  t[field] = value;
  t.updatedAt = new Date().toISOString();
  if (field === 'assignee') t.assigneeType = value === 'human' ? 'human' : 'ai';
  saveAndPush();
  render();
}

function addComment() {
  var t = tasks.find(function(x) { return x.id === editingId; });
  if (!t) return;
  var content = document.getElementById('cInput').value.trim();
  if (!content) return;
  var author = document.getElementById('cAuthor').value;
  if (!t.comments) t.comments = [];
  t.comments.push({ author: author, content: content, timestamp: new Date().toISOString() });
  t.updatedAt = new Date().toISOString();
  saveAndPush();
  renderComments(t);
  document.getElementById('cInput').value = '';
  render();
}

function deleteTask() {
  if (!confirm('タスク ' + editingId + ' を削除しますか？')) return;
  tasks = tasks.filter(function(t) { return t.id !== editingId; });
  saveAndPush();
  render();
  closeDetail();
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.add('hidden');
  editingId = null;
}

function closeDetailIfBg(e) {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
}

function openCreate() {
  document.getElementById('cTitle').value = '';
  document.getElementById('cDesc').value = '';
  document.getElementById('createOverlay').classList.remove('hidden');
  setTimeout(function() { document.getElementById('cTitle').focus(); }, 50);
}

function closeCreate() {
  document.getElementById('createOverlay').classList.add('hidden');
}

function closeCreateIfBg(e) {
  if (e.target === document.getElementById('createOverlay')) closeCreate();
}

function createTask() {
  var title = document.getElementById('cTitle').value.trim();
  if (!title) { alert('タイトルは必須です'); return; }
  var now = new Date().toISOString();
  var assignee = document.getElementById('cAssignee').value;
  var t = {
    id: nextId(),
    title: title,
    description: document.getElementById('cDesc').value.trim(),
    status: document.getElementById('cStatus').value,
    priority: document.getElementById('cPriority').value,
    assignee: assignee,
    assigneeType: assignee === 'human' ? 'human' : 'ai',
    team: document.getElementById('cTeam').value,
    organization: document.getElementById('cOrg').value,
    createdAt: now,
    updatedAt: now,
    comments: [],
    blockedReason: '',
    tags: []
  };
  tasks.unshift(t);
  saveAndPush();
  render();
  closeCreate();
}

function doExport() {
  var data = { version: '1.0', lastUpdated: new Date().toISOString(), tasks: tasks };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tasks.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function doImport() {
  document.getElementById('fileInput').value = '';
  document.getElementById('fileInput').click();
}

function onFileImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      var imported = data.tasks || data;
      if (!Array.isArray(imported)) throw new Error('tasks配列が見つかりません');
      tasks = imported;
      save();
      render();
      alert(tasks.length + '件のタスクをインポートしました');
    } catch (err) {
      alert('読み込みエラー: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// --- Drag & Drop ---
function onDragStart(e, id) {
  dragId = id;
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function onDrop(e, newStatus) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragId) return;
  var t = tasks.find(function(x) { return x.id === dragId; });
  if (!t || t.status === newStatus) { dragId = null; return; }
  t.status = newStatus;
  t.updatedAt = new Date().toISOString();
  t.comments = t.comments || [];
  t.comments.push({ author: 'human', content: '📋 ステータスを「' + newStatus + '」に変更', timestamp: new Date().toISOString() });
  dragId = null;
  saveAndPush();
  render();
}

loadFromGitHub(false);
startAutoRefresh();
