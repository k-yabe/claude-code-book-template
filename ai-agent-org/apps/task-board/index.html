<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Task Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🤖</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── DARK / LIGHT VARS ── */
html.dark {
  --bg:     #0d1117;
  --bg2:    #161b22;
  --bg3:    #21262d;
  --border: #30363d;
  --text:   #e6edf3;
  --text2:  #8b949e;
  --text3:  #484f58;
  --shadow: rgba(0,0,0,0.4);
  --accent: #2f81f7;
  --human:  #1f6feb;
  --col-new:#6e7681; --col-ip:#388bfd; --col-bl:#f85149; --col-done:#3fb950;
}
html.light {
  --bg:     #ffffff;
  --bg2:    #f6f8fa;
  --bg3:    #eaeef2;
  --border: #d0d7de;
  --text:   #1f2328;
  --text2:  #636c76;
  --text3:  #9a9ea6;
  --shadow: rgba(0,0,0,0.12);
  --accent: #0969da;
  --human:  #0969da;
  --col-new:#6e7681; --col-ip:#0969da; --col-bl:#cf222e; --col-done:#1a7f37;
}
:root {
  --p0:#f85149; --p1:#fb8f44; --p2:#e3b341; --p3:#388bfd;
}
html.light {
  --p0:#cf222e; --p1:#d15b00; --p2:#9a6700; --p3:#0969da;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

/* ── HEADER ── */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.header h1 { font-size: 14px; font-weight: 700; white-space: nowrap; margin-right: 4px; }
.header-filters { display: flex; gap: 6px; align-items: center; }
.header-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

/* ── MAIN ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── BOARD ── */
.board-wrap {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 14px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.column {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 248px;
  min-width: 248px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 56px);
}
.col-header {
  padding: 9px 12px 8px;
  display: flex;
  align-items: center;
  gap: 7px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.col-title { font-size: 11px; font-weight: 600; flex: 1; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; }
.col-count {
  background: var(--bg3);
  font-size: 11px;
  color: var(--text2);
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 500;
}
.card-list {
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 80px;
  flex: 1;
}
.card-list.drag-over {
  background: rgba(47,129,247,0.04);
  outline: 2px dashed var(--accent);
  outline-offset: -4px;
  opacity: 0.7;
  border-radius: 6px;
}

/* ── CARD ── */
.card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: 6px;
  padding: 10px 11px;
  cursor: pointer;
  transition: box-shadow 0.12s, border-color 0.12s, opacity 0.12s;
  position: relative;
}
.card:hover { box-shadow: 0 2px 8px var(--shadow); border-color: var(--text3); }
.card.active { border-color: var(--accent) !important; box-shadow: 0 0 0 2px var(--accent)22; }
.card[draggable]:active { opacity: 0.5; cursor: grabbing; }

/* ステータス別カードスタイル */
#list-in-progress .card {
  background: var(--bg);
  border-color: var(--border);
}
html.dark #list-in-progress .card { background: #0d1117; }
html.light #list-in-progress .card { background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

#list-done .card {
  opacity: 0.45;
  filter: grayscale(20%);
}
#list-done .card:hover { opacity: 0.7; filter: none; }
#list-done .card.active { opacity: 1; filter: none; }

#list-blocked .card { border-color: var(--p0)44; }

.pbl-P0 { border-left-color: var(--p0); }
.pbl-P1 { border-left-color: var(--p1); }
.pbl-P2 { border-left-color: var(--text3); }
.pbl-P3 { border-left-color: var(--p3); }

/* 未読ドット：AIが返信済み・未確認 */
.unread-dot {
  position: absolute;
  top: 8px; right: 8px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--bg3);
}
html.light .unread-dot { box-shadow: 0 0 0 2px var(--bg); }

/* 優先度ラベル */
.prio-pill {
  font-size: 9px; font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: 0.3px;
}
.pp-P0 { background: var(--p0)20; color: var(--p0); }
.pp-P1 { background: var(--p1)20; color: var(--p1); }
.pp-P2 { background: var(--text3)18; color: var(--text3); }
.pp-P3 { background: var(--p3)20; color: var(--p3); }

.card-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 5px;
}
.card-id { font-size: 10px; color: var(--text2); font-family: monospace; }
.card-sep { font-size: 10px; color: var(--text3); }

.card-title {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.45;
  margin-bottom: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-preview {
  font-size: 11px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
  margin-bottom: 7px;
}
.card-footer {
  display: flex;
  align-items: center;
  gap: 5px;
}
.card-agent {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--text2);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-agent-av {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  flex-shrink: 0;
}
.msg-count {
  font-size: 10px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}
.blocked-label { font-size: 10px; color: var(--p0); margin-bottom: 5px; }

/* team chip */
.team-chip { font-size: 10px; padding: 1px 6px; border-radius: 20px; font-weight: 500; flex-shrink: 0; }
.tc-research    { background:#00897b18; color:#00897b; }
.tc-personal    { background:#c2185b18; color:#c2185b; }
.tc-engineering { background:#1565c018; color:#1565c0; }
.tc-content     { background:#6a1b9a18; color:#6a1b9a; }
.tc-business    { background:#e6510018; color:#e65100; }
.tc-infrastructure { background:#2e7d3218; color:#2e7d32; }
html.dark .tc-research    { color:#4db6ac; }
html.dark .tc-personal    { color:#f48fb1; }
html.dark .tc-engineering { color:#64b5f6; }
html.dark .tc-content     { color:#ce93d8; }
html.dark .tc-business    { color:#ffb74d; }
html.dark .tc-infrastructure { color:#81c784; }

/* org badge */
.org-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600; flex-shrink: 0; letter-spacing: 0.2px; }
.org-private     { background:#6e768118; color:#6e7681; }
.org-shift-ai    { background:#388bfd18; color:#388bfd; }
.org-otsunagi    { background:#3fb95018; color:#3fb950; }
.org-akkodis     { background:#fb8f4418; color:#fb8f44; }
html.dark .org-private  { color:#8b949e; }
html.dark .org-shift-ai { color:#58a6ff; }
html.dark .org-otsunagi { color:#56d364; }
html.dark .org-akkodis  { color:#ffa657; }

/* ── DETAIL PANEL ── */
.detail-panel {
  width: 480px;
  flex-shrink: 0;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.22s ease;
}
.detail-panel.hidden {
  width: 0;
  border-left: none;
}

/* panel header */
.panel-hdr {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px 10px;
  flex-shrink: 0;
}
.panel-hdr-row1 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.panel-agent-av {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.panel-agent-name {
  font-size: 12px;
  color: var(--text2);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.panel-hdr-row2 {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 8px;
  color: var(--text);
  word-break: break-word;
}
.panel-hdr-row3 {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* status badge */
.st-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: 5px;
  font-size: 11px; font-weight: 600;
  cursor: pointer; border: none; outline: none;
  letter-spacing: 0.2px;
  transition: filter 0.1s;
}
.st-badge:hover { filter: brightness(1.15); }
.sb-new   { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.sb-prog  { background: #1a40801a; color: var(--col-ip); border: 1px solid var(--col-ip)44; }
.sb-block { background: #cf222e1a; color: var(--col-bl); border: 1px solid var(--col-bl)44; }
.sb-done  { background: #1a7f371a; color: var(--col-done); border: 1px solid var(--col-done)44; }

.prio-chip {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.3px;
}
.pc-P0{background:var(--p0)20;color:var(--p0);border:1px solid var(--p0)50;}
.pc-P1{background:var(--p1)20;color:var(--p1);border:1px solid var(--p1)50;}
.pc-P2{background:var(--p2)20;color:var(--p2);border:1px solid var(--p2)50;}
.pc-P3{background:var(--p3)20;color:var(--p3);border:1px solid var(--p3)50;}

.panel-hdr-id {
  font-size: 10px;
  color: var(--text2);
  font-family: monospace;
  margin-left: auto;
}

/* messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.task-desc-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text2);
  margin-bottom: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.task-desc-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text3);
  margin-bottom: 5px;
  font-weight: 600;
}

.msg-sys {
  text-align: center;
  font-size: 11px;
  color: var(--text3);
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.msg-sys::before, .msg-sys::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.msg-ai { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
.msg-av {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg-ai-body { max-width: 85%; min-width: 0; }
.msg-name {
  font-size: 10px;
  color: var(--text2);
  margin-bottom: 3px;
  padding-left: 2px;
  font-weight: 500;
}
.bubble-ai {
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 9px 12px;
  font-size: 12.5px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  border-radius: 3px 10px 10px 10px;
}
.bubble-ai a { color: var(--accent); text-decoration: none; }
.bubble-ai a:hover { text-decoration: underline; }
.msg-time { font-size: 10px; color: var(--text3); margin-top: 3px; padding-left: 2px; }

.msg-human { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 12px; }
.bubble-human {
  background: var(--human);
  color: #fff;
  padding: 9px 12px;
  font-size: 12.5px;
  line-height: 1.7;
  max-width: 85%;
  white-space: pre-wrap;
  word-break: break-word;
  border-radius: 10px 3px 10px 10px;
}
.bubble-human a { color: #b8d4ff; text-decoration: none; }
.bubble-human a:hover { text-decoration: underline; }
.msg-time-r { font-size: 10px; color: var(--text3); margin-top: 3px; padding-right: 2px; }

/* input */
.chat-input {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
.chat-input textarea {
  flex: 1;
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  font-family: inherit;
  resize: none;
  min-height: 38px;
  max-height: 110px;
  line-height: 1.5;
  outline: none;
  transition: border-color 0.12s;
}
.chat-input textarea:focus { border-color: var(--accent); }
.chat-input textarea::placeholder { color: var(--text3); }
.send-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.12s;
}
.send-btn:hover { opacity: 0.85; }

/* ── CONTROLS ── */
.btn {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.12s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.btn-icon {
  background: none; border: none;
  color: var(--text2);
  cursor: pointer; font-size: 14px;
  padding: 4px 6px; border-radius: 4px;
  line-height: 1;
  transition: color 0.1s, background 0.1s;
}
.btn-icon:hover { color: var(--text); background: var(--bg3); }

input, select {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.12s;
}
input:focus, select:focus { border-color: var(--accent); }

/* theme toggle */
.theme-btn {
  background: none; border: none;
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  padding: 4px 7px;
  border-radius: 6px;
  transition: background 0.1s;
  line-height: 1;
}
.theme-btn:hover { background: var(--bg3); }

/* ── STATUS MENU ── */
.status-menu {
  position: fixed;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  z-index: 500;
  min-width: 150px;
  box-shadow: 0 8px 24px var(--shadow);
  overflow: hidden;
}
.status-menu.hidden { display: none; }
.sm-item {
  padding: 8px 13px;
  cursor: pointer;
  font-size: 12px;
  display: flex; align-items: center; gap: 8px;
  transition: background 0.1s;
}
.sm-item:hover { background: var(--bg2); }
.sm-dot { width: 7px; height: 7px; border-radius: 50%; }

/* ── MODAL ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 400; padding: 16px;
}
.overlay.hidden { display: none; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 100%; max-width: 500px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 16px 48px var(--shadow);
}
.modal-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.modal-header h2 { font-size: 14px; font-weight: 600; flex: 1; }
.modal-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; line-height: 1; }
.modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.row2 { display: flex; gap: 12px; }
.row2 .field { flex: 1; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ── MOBILE ── */
@media (max-width: 800px) {
  .detail-panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    z-index: 200;
    width: 100% !important;
    box-shadow: -4px 0 24px var(--shadow);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    border-left: none;
  }
  .detail-panel:not(.hidden) { transform: translateX(0); }
  .detail-panel.hidden { transform: translateX(100%); width: 100% !important; }
  .header-filters { display: none; }
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="header">
  <h1>🤖 AI Agent</h1>
  <div class="header-filters">
    <input type="search" id="filterText" placeholder="🔍 検索" oninput="render()" style="width:140px">
    <select id="filterOrg" onchange="render()">
      <option value="">組織: 全て</option>
      <option value="private">プライベート</option>
      <option value="shift-ai">SHIFT AI</option>
      <option value="otsunagi">OTSUNAGI</option>
      <option value="akkodis">AKKODiS</option>
    </select>
    <select id="filterTeam" onchange="render()">
      <option value="">チーム: 全て</option>
      <option value="research">リサーチ</option>
      <option value="personal">kunito</option>
      <option value="engineering">エンジニア</option>
      <option value="content">コンテンツ</option>
      <option value="business">ビジネス</option>
    </select>
  </div>
  <div class="header-right">
    <span id="syncStatus" style="font-size:11px;color:var(--text2);white-space:nowrap"></span>
    <button class="theme-btn" id="themeBtn" onclick="toggleThemeManual()" title="テーマ切り替え">🌙</button>
    <button class="btn" onclick="syncNow()">↺ 同期</button>
    <button class="btn" onclick="showPatDialog()">🔑</button>
    <button class="btn primary" onclick="openCreate()">＋ タスク</button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div class="main">

  <!-- ── KANBAN BOARD ── -->
  <div class="board-wrap" id="boardWrap">
    <div class="column">
      <div class="col-header">

<script>
// ── Config ──
var STORAGE_KEY      = 'ai-agent-tasks';

var GITHUB_API_URL   = 'https://api.github.com/repos/k-yabe/claude-code-book-template/contents/ai-agent-org/tasks/tasks.json';
var GITHUB_FILE_BASE = 'https://github.com/k-yabe/claude-code-book-template/blob/main/ai-agent-org/';

var tasks        = [];
var activeId     = null;
var dragId       = null;
var lastSynced   = null;
var pushInFlight = false;

var themeMode    = 'auto'; // 'auto'|'dark'|'light'

var AGENTS = {
  'human':               {e:'👤', c:'#1f6feb'},
  'research-analyst':    {e:'🔎', c:'#00897b'},
  'career-advisor':      {e:'🧭', c:'#c2185b'},
  'tech-lead':           {e:'🔧', c:'#1565c0'},
  'frontend-engineer':   {e:'🎨', c:'#6a1b9a'},

  'business-strategist': {e:'💼', c:'#004d40'},

  'legal-review':        {e:'⚖️', c:'#4e342e'},

};

var TEAM_CSS = {
  research:'tc-research', personal:'tc-personal',

  'private':'個人','shift-ai':'SHIFT AI','otsunagi':'OTSUNAGI','akkodis':'AKKODiS'
};

  'new-assigned': {label:'未着手',  sb:'sb-new',   col:'var(--col-new)'},
  'in-progress':  {label:'進行中',  sb:'sb-prog',  col:'var(--col-ip)'},

};

// ── THEME ──
// Simple sunrise/sunset calculation for Japan (Tokyo: 35.68°N, 139.69°E)
// Falls back to navigator.geolocation if available
var userLat = 35.68, userLon = 139.69;

function calcSunTimes(lat, lon, date) {
  var R = Math.PI / 180;
  var jd = Math.floor(date.getTime() / 86400000) + 2440587.5;
  var n = jd - 2451545.0;
  var L = (280.46 + 0.9856474 * n) % 360;
  var g = (357.528 + 0.9856003 * n) % 360;
  var lam = L + 1.915 * Math.sin(g * R) + 0.020 * Math.sin(2 * g * R);
  var eps = 23.439 - 0.0000004 * n;
  var sinDec = Math.sin(eps * R) * Math.sin(lam * R);
  var dec = Math.asin(sinDec);
  var cosHA = (Math.sin(-0.8333 * R) - Math.sin(lat * R) * sinDec)
              / (Math.cos(lat * R) * Math.cos(dec));
  if (cosHA < -1) return { sunrise: 0, sunset: 24 * 60 }; // polar day
  if (cosHA > 1)  return { sunrise: 12 * 60, sunset: 12 * 60 }; // polar night
  var HA = Math.acos(cosHA) / R;
  // Equation of time (minutes)
  var B = (360 / 365) * (date.getDate() + Math.floor((date.getMonth() + 1 - 1) * 30.5) - 81) * R;
  var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  var TC = 4 * lon + eot;
  var noonUTC = 12 * 60 - TC;
  var tzOffset = date.getTimezoneOffset();
  return {
    sunrise: Math.round(noonUTC - HA * 4 - tzOffset),
    sunset:  Math.round(noonUTC + HA * 4 - tzOffset),
  };
}

function isDaytime() {
  var now = new Date();
  var mins = now.getHours() * 60 + now.getMinutes();
  var times = calcSunTimes(userLat, userLon, now);
  return mins >= times.sunrise && mins < times.sunset;
}

function applyTheme(mode) {
  var html = document.documentElement;
  var btn  = document.getElementById('themeBtn');
  if (mode === 'dark' || (mode === 'auto' && !isDaytime())) {
    html.className = 'dark';
    if (btn) btn.textContent = mode === 'auto' ? '🌙' : '🌙';
  } else {
    html.className = 'light';
    if (btn) btn.textContent = mode === 'auto' ? '☀️' : '☀️';
  }
  if (mode === 'auto') {
    if (btn) btn.title = '自動（日の出/日の入り）';
  }
}

function toggleThemeManual() {
  // cycle: auto → dark → light → auto
  if (themeMode === 'auto') themeMode = 'dark';
  else if (themeMode === 'dark') themeMode = 'light';
  else themeMode = 'auto';
  localStorage.setItem(THEME_KEY, themeMode);
  var btn = document.getElementById('themeBtn');
  if (btn) btn.title = themeMode === 'auto' ? '自動（日の出/日の入り）' : (themeMode === 'dark' ? 'ダークモード' : 'ライトモード');
  applyTheme(themeMode);
}

function startThemeWatcher() {
  // Check every 5 minutes whether theme should switch
  setInterval(function() {
    if (themeMode === 'auto') applyTheme('auto');
  }, 5 * 60 * 1000);
  // Try geolocation for accurate sunrise/sunset
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      if (themeMode === 'auto') applyTheme('auto');
    }, null, { timeout: 5000 });
  }
}

function initTheme() {
  var stored = localStorage.getItem(THEME_KEY);
  themeMode = stored || 'auto';
  applyTheme(themeMode);
  startThemeWatcher();
}

// ── Util ──
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ag(name){ return AGENTS[name]||{e:'🤖',c:'#444'}; }

// 相対時刻（カード表示用）
function relTime(ts){
  if(!ts) return '';
  var diff=Date.now()-new Date(ts).getTime();
  var min=Math.floor(diff/60000);
  if(min<1) return 'たった今';
  if(min<60) return min+'分前';
  var hrs=Math.floor(min/60);
  if(hrs<24) return hrs+'時間前';
  var days=Math.floor(hrs/24);
  if(days<7) return days+'日前';
  var d=new Date(ts);
  return (d.getMonth()+1)+'/'+(d.getDate());
}

// 絶対時刻（チャットパネル用）
function fmtDate(ts){
  if(!ts) return '';
  var d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  return (d.getMonth()+1)+'/'+(d.getDate())+' '+d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}

// linkify: converts URLs and repo file paths to clickable links
function linkify(text){
  var safe = h(text);
  // https:// URLs
  safe = safe.replace(/(https?:\/\/[^\s<>"&]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Repo-relative file paths (e.g. context/context/ai-handoffs/xxx.md)
  safe = safe.replace(/(?<![/"'>])((?:context|tasks|agents|scripts|apps)\/[^\s<>"&()[\]]+\.(?:md|json|js|html|sh|txt))/g, function(m){
    var url = GITHUB_FILE_BASE + m;
    return '<a href="' + url + '" target="_blank" rel="noopener" title="GitHubで開く">' + m + ' ↗</a>';
  });
  return safe;
}

function isSys(c){
  return !c.content ? false :
    c.content.includes('タスクを開始しました') ||
    c.content.includes('📋 ステータスを') ||
    c.content.includes('🔁 ブロック解除') ||
    c.author === 'system';
}

// ── Storage ──
function load(){ var r=localStorage.getItem(STORAGE_KEY); if(r){try{tasks=JSON.parse(r);}catch(e){}} }
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks)); }

// ── GitHub ──
function getPat(){ return localStorage.getItem(PAT_KEY)||''; }
function setPat(t){ localStorage.setItem(PAT_KEY,t); }
function setSyncStatus(msg,color){
  var el=document.getElementById('syncStatus');
  if(el){el.textContent=msg; el.style.color=color||'var(--text2)';}
}
function showPatDialog(){
  var v=prompt('GitHub Personal Access Token\n(Contents: Read and write 権限が必要)',getPat());
  if(v===null) return;
  setPat(v.trim());
  setSyncStatus(v.trim()?'🔑 設定済み':'🔑 未設定', v.trim()?'var(--col-done)':'var(--col-bl)');
}

function saveAndPush(){ save(); executePush(); }
function executePush(){
  if(pushInFlight){pushPending=true;return;}
  pushInFlight=true; pushPending=false;
  pushToGitHub().finally(function(){
    pushInFlight=false;
    if(pushPending){pushPending=false;executePush();}
  });
}
function pushToGitHub(){
  var pat=getPat();
  if(!pat){ setSyncStatus('⚠️ 未保存 — 🔑でトークン設定','var(--col-bl)'); return Promise.resolve(); }
  setSyncStatus('保存中...','var(--accent)');
  var payload=JSON.stringify({version:'1.0',lastUpdated:new Date().toISOString(),tasks:tasks},null,2);
  return fetch(GITHUB_API_URL,{headers:{Authorization:'token '+pat,Accept:'application/vnd.github.v3+json'}})
    .then(function(r){return r.json();})
    .then(function(meta){
      return fetch(GITHUB_API_URL,{
        method:'PUT',
        headers:{Authorization:'token '+pat,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify({message:'bot: タスクボードから更新',content:btoa(unescape(encodeURIComponent(payload))),sha:meta.sha})
      });
    })
    .then(function(r){
      if(r.ok) setSyncStatus('保存済み '+new Date().toLocaleTimeString('ja-JP'),'var(--col-done)');
      else setSyncStatus('⚠️ 保存失敗','var(--col-bl)');
    })
    .catch(function(){setSyncStatus('⚠️ 保存失敗','var(--col-bl)');});
}

function loadFromGitHub(silent){
  if(!silent) setSyncStatus('同期中...','var(--accent)');
  return fetch(GITHUB_TASKS_URL+'?t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(data){
      var f=data.tasks||data;
      if(!Array.isArray(f)) throw new Error('invalid');
      tasks=f; save(); lastSynced=new Date();
      setSyncStatus('同期済み '+lastSynced.toLocaleTimeString('ja-JP'),'var(--col-done)');
      render();
      if(activeId) renderPanel();
    })
    .catch(function(){
      setSyncStatus('取得失敗 — ローカル使用','var(--col-bl)');
      load(); render();
    });
}
function syncNow(){ loadFromGitHub(false); }

function startAutoRefresh(){
  setInterval(function(){
    if(!document.getElementById('statusMenu').classList.contains('hidden')) return;
    if(!document.getElementById('createOverlay').classList.contains('hidden')) return;
    loadFromGitHub(true);
  },60000);
}

// ── ID ──
function nextId(){
  if(!tasks.length) return 'T001';
  var max=0;
  tasks.forEach(function(t){var n=parseInt(t.id.replace('T',''),10);if(n>max)max=n;});
  var s=String(max+1); while(s.length<3)s='0'+s; return 'T'+s;
}

// ── Filter ──
function filtered(){
  var fq=(document.getElementById('filterText').value||'').toLowerCase();
  var ft=document.getElementById('filterTeam').value;
  var fo=document.getElementById('filterOrg').value;
  return tasks.filter(function(t){
    if(ft && t.team!==ft) return false;
    if(fo && t.organization!==fo) return false;
    if(fq){
      var hay=((t.title||'')+' '+(t.id||'')).toLowerCase();
      if(hay.indexOf(fq)===-1) return false;
    }
    return true;
  });
}

// ── RENDER BOARD ──
var EMPTY_MSGS = {
  'new-assigned': 'タスクなし',
  'in-progress':  '進行中のタスクなし',
  'blocked':      'ブロックなし 👍',
  'done':         '完了タスクなし',
};

function render(){
  var ft=filtered();
  ['new-assigned','in-progress','blocked','done'].forEach(function(col){
    var list=document.getElementById('list-'+col);
    var cnt=document.getElementById('cnt-'+col);
    var colTasks=ft.filter(function(t){return t.status===col;});
    cnt.textContent=colTasks.length;
    if(!colTasks.length){
      list.innerHTML='<div style="text-align:center;color:var(--text3);font-size:11px;padding:28px 0 20px;line-height:2">'
        +(col==='blocked'?'✅':'📭')+'<br>'+EMPTY_MSGS[col]+'</div>';
      return;
    }
    list.innerHTML=colTasks.map(cardHTML).join('');
  });
}

function cardHTML(t){
  var a=ag(t.assignee);
  var tc=TEAM_CSS[t.team]||'tc-engineering';
  var tl=TEAM_LABELS[t.team]||t.team;
  var oc=ORG_CSS[t.organization]||'org-private';
  var ol=ORG_LABELS[t.organization]||t.organization||'個人';
  var cc=(t.comments&&t.comments.length)||0;
  var lastComment=null;
  for(var i=cc-1;i>=0;i--){
    if(!isSys(t.comments[i])){ lastComment=t.comments[i]; break; }
  }
  // 未読：最後のコメントがAI（human・systemでない）
  var unread=lastComment && lastComment.author!=='human' && lastComment.author!=='system';
  var preview=lastComment
    ? lastComment.content.replace(/\n/g,' ').slice(0,58)
    : (t.description||'').replace(/\n/g,' ').slice(0,58);
  var blocked=t.status==='blocked'&&t.blockedReason
    ? '<div class="blocked-label">⛔ '+h(t.blockedReason.slice(0,40))+'</div>' : '';
  var timeStr=t.updatedAt?relTime(t.updatedAt):'';
  return '<div class="card pbl-'+h(t.priority)+(activeId===t.id?' active':'')+'" draggable="true"'
    +' ondragstart="onDragStart(event,\''+h(t.id)+'\')"'
    +' onclick="openPanel(\''+h(t.id)+'\')">'
    +(unread?'<div class="unread-dot"></div>':'')
    +'<div class="card-meta">'
    +'<span class="card-id">'+h(t.id)+'</span>'
    +'<span class="card-sep">·</span>'
    +'<span class="prio-pill pp-'+h(t.priority)+'">'+h(t.priority)+'</span>'
    +'<span class="org-badge '+oc+'">'+h(ol)+'</span>'
    +(timeStr?'<span style="margin-left:auto;font-size:10px;color:var(--text3)">'+timeStr+'</span>':'')
    +'</div>'
    +'<div class="card-title">'+h(t.title)+'</div>'
    +(preview?'<div class="card-preview">'+h(preview)+'</div>':'')
    +blocked
    +'<div class="card-footer">'
    +'<div class="card-agent">'
    +'<div class="card-agent-av" style="background:'+a.c+'22;border:1px solid '+a.c+'44">'+a.e+'</div>'
    +'<span>'+h(t.assignee)+'</span>'
    +'</div>'
    +'<span class="team-chip '+tc+'">'+tl+'</span>'
    +(cc?'<span class="msg-count">💬 '+cc+'</span>':'')
    +'</div>'
    +'</div>';
}

// ── DRAG & DROP ──
function onDragStart(e,id){ dragId=id; e.dataTransfer.effectAllowed='move'; }
function onDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function onDrop(e,newStatus){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(!dragId) return;
  var t=tasks.find(function(x){return x.id===dragId;});
  if(!t||t.status===newStatus){dragId=null;return;}
  var old=STATUS_CFG[t.status]||{label:t.status};
  var nw=STATUS_CFG[newStatus]||{label:newStatus};
  t.status=newStatus; t.updatedAt=new Date().toISOString();
  t.comments=t.comments||[];
  t.comments.push({author:'system',content:'📋 ステータスを「'+old.label+'」→「'+nw.label+'」に変更',timestamp:new Date().toISOString()});
  dragId=null; saveAndPush(); render();
  if(activeId===t.id) renderPanelHeader();
}

// ── PANEL ──
function openPanel(id){
  activeId=id;
  document.getElementById('detailPanel').classList.remove('hidden');
  renderPanel();
  render();
  setTimeout(function(){
    var m=document.getElementById('chatMessages');
    if(m) m.scrollTop=m.scrollHeight;
    var inp=document.getElementById('msgInput');
    if(inp) inp.focus();
  },50);
}
function closePanel(){
  document.getElementById('detailPanel').classList.add('hidden');
  activeId=null; render();
}

function renderPanel(){
  renderPanelHeader();
  renderChat();
}

function renderPanelHeader(){
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t) return;
  var a=ag(t.assignee);
  var sc=STATUS_CFG[t.status]||STATUS_CFG['new-assigned'];

  var av=document.getElementById('panelAv');
  av.textContent=a.e;
  av.style.cssText='background:'+a.c+'22;border:1.5px solid '+a.c+'55;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;';

  document.getElementById('panelAgent').textContent=t.assignee;
  document.getElementById('panelTitle').textContent=t.title;

  var tc=TEAM_CSS[t.team]||'tc-engineering';
  var tl=TEAM_LABELS[t.team]||t.team;
  document.getElementById('panelMeta').innerHTML=
    '<button class="st-badge '+sc.sb+'" onclick="toggleStatusMenu(event)">● '+sc.label+' ▾</button>'
    +'<span class="prio-chip pc-'+t.priority+'">'+t.priority+'</span>'
    +'<span class="team-chip '+tc+'">'+tl+'</span>'
    +'<span class="panel-hdr-id">'+h(t.id)+'</span>';
}

// ── STATUS MENU ──
function toggleStatusMenu(e){
  e.stopPropagation();
  var menu=document.getElementById('statusMenu');
  if(menu.classList.contains('hidden')){
    var r=e.target.getBoundingClientRect();
    menu.style.top=(r.bottom+4)+'px'; menu.style.left=r.left+'px';
    menu.classList.remove('hidden');
  } else { menu.classList.add('hidden'); }
}
document.addEventListener('click',function(){ document.getElementById('statusMenu').classList.add('hidden'); });

function setStatus(newStatus){
  document.getElementById('statusMenu').classList.add('hidden');
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t||t.status===newStatus) return;
  var old=STATUS_CFG[t.status]||{label:t.status};
  var nw=STATUS_CFG[newStatus]||{label:newStatus};
  t.status=newStatus; t.updatedAt=new Date().toISOString();
  t.comments=t.comments||[];
  t.comments.push({author:'system',content:'📋 ステータスを「'+old.label+'」→「'+nw.label+'」に変更',timestamp:new Date().toISOString()});
  saveAndPush(); render(); renderPanelHeader(); renderChat();
}

// ── RENDER CHAT ──
function renderChat(){
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t) return;
  var html='';

  if(t.description){
    html+='<div class="task-desc-box">'
      +'<div class="task-desc-label">概要</div>'
      +linkify(t.description)
      +'</div>';
  }

  (t.comments||[]).forEach(function(c){
    if(isSys(c)){
      html+='<div class="msg-sys"><span>'+h(c.content)+'</span>'
        +'<span style="font-size:10px;color:var(--text3);flex-shrink:0">'+fmtDate(c.timestamp)+'</span></div>';
    } else if(c.author==='human'){
      html+='<div class="msg-human">'
        +'<div class="bubble-human">'+linkify(c.content)+'</div>'
        +'<div class="msg-time-r">'+fmtDate(c.timestamp)+'</div>'
        +'</div>';
    } else {
      var a=ag(c.author);
      html+='<div class="msg-ai">'
        +'<div class="msg-av" style="background:'+a.c+'22;border:1px solid '+a.c+'44">'+a.e+'</div>'
        +'<div class="msg-ai-body">'
        +'<div class="msg-name">'+h(c.author)+'</div>'
        +'<div class="bubble-ai">'+linkify(c.content)+'</div>'
        +'<div class="msg-time">'+fmtDate(c.timestamp)+'</div>'
        +'</div>'
        +'</div>';
    }
  });

  var el=document.getElementById('chatMessages');
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

// ── SEND ──
function sendMsg(){
  var input=document.getElementById('msgInput');
  var content=input.value.trim();
  if(!content||!activeId) return;
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t) return;
  t.comments=t.comments||[];
  t.comments.push({author:'human',content:content,timestamp:new Date().toISOString()});
  t.updatedAt=new Date().toISOString();
  input.value=''; input.style.height='auto';
  saveAndPush(); render(); renderChat();
}
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; }

// キーボードショートカット
document.addEventListener('keydown',function(e){
  // inputフォーカス中はスキップ
  var tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'){
    if(e.key==='Escape'){
      if(!document.getElementById('createOverlay').classList.contains('hidden')){ closeCreate(); return; }
      if(!document.getElementById('detailPanel').classList.contains('hidden')){ closePanel(); }
    }
    return;
  }
  if(e.key==='Escape'){
    if(!document.getElementById('createOverlay').classList.contains('hidden')){ closeCreate(); return; }
    if(!document.getElementById('detailPanel').classList.contains('hidden')){ closePanel(); return; }
  }
  if(e.key==='n'||e.key==='N'){ e.preventDefault(); openCreate(); }
  if(e.key==='/'){ e.preventDefault(); document.getElementById('filterText').focus(); }
});

// ── DELETE ──
function deleteActiveTask(){
  if(!activeId||!confirm('タスク '+activeId+' を削除しますか？')) return;
  tasks=tasks.filter(function(t){return t.id!==activeId;});
  activeId=null; saveAndPush();
  document.getElementById('detailPanel').classList.add('hidden');
  render();
}

// ── CREATE ──
function openCreate(){ document.getElementById('createOverlay').classList.remove('hidden'); setTimeout(function(){document.getElementById('cTitle').focus();},50); }
function closeCreate(){ document.getElementById('createOverlay').classList.add('hidden'); }
function closeBg(e,id){ if(e.target===document.getElementById(id)) document.getElementById(id).classList.add('hidden'); }

function createTask(){
  var title=document.getElementById('cTitle').value.trim();
  if(!title){alert('タイトルは必須です');return;}
  var now=new Date().toISOString();
  var assignee=document.getElementById('cAssignee').value;
  var t={
    id:nextId(), title:title,
    description:document.getElementById('cDesc').value.trim(),
    status:'new-assigned',
    priority:document.getElementById('cPriority').value,
    assignee:assignee, assigneeType:assignee==='human'?'human':'ai',
    team:document.getElementById('cTeam').value,
    organization:document.getElementById('cOrg').value,
    createdAt:now, updatedAt:now,
    comments:[], blockedReason:'', tags:[]
  };
  tasks.unshift(t); saveAndPush(); closeCreate(); render(); openPanel(t.id);
}

// ── IMPORT / EXPORT ──
function doExport(){
  var blob=new Blob([JSON.stringify({version:'1.0',lastUpdated:new Date().toISOString(),tasks:tasks},null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tasks.json'; a.click(); URL.revokeObjectURL(a.href);
}
function doImport(){ document.getElementById('fileInput').value=''; document.getElementById('fileInput').click(); }
function onFileImport(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var imported=data.tasks||data;
      if(!Array.isArray(imported)) throw new Error('tasks配列なし');
      tasks=imported; save(); render(); alert(tasks.length+'件インポートしました');
    }catch(err){alert('エラー: '+err.message);}
  };
  reader.readAsText(file);
}

// ── BOOT ──
initTheme();
load();
loadFromGitHub(false);
startAutoRefresh();
</script>
</body>
</html>
