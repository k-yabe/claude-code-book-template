<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Task Board</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0d1117;
  --bg2:    #161b22;
  --bg3:    #21262d;
  --border: #30363d;
  --text:   #e6edf3;
  --text2:  #8b949e;
  --accent: #2f81f7;
  --human:  #1f6feb;
  --p0:#f85149; --p1:#fb8f44; --p2:#e3b341; --p3:#388bfd;
  --col-new:#6e7681; --col-ip:#388bfd; --col-bl:#f85149; --col-done:#3fb950;
  --panel-w: 400px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  flex-shrink: 0;
  z-index: 10;
}
.header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
.header-right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ── MAIN AREA ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── BOARD ── */
.board-wrap {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: margin-right 0.25s;
}
.board-wrap.panel-open { /* no margin needed, panel overlaps */ }

.column {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 260px;
  min-width: 260px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 110px);
}
.col-header {
  padding: 10px 14px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.col-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.col-title { font-size: 13px; font-weight: 600; flex: 1; }
.col-count {
  background: var(--bg3);
  font-size: 11px;
  color: var(--text2);
  padding: 1px 7px;
  border-radius: 10px;
}
.card-list {
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 60px;
  flex: 1;
  transition: background 0.15s;
}
.card-list.drag-over {
  background: rgba(47,129,247,0.06);
  outline: 2px dashed var(--accent);
  outline-offset: -4px;
  border-radius: 6px;
}

/* ── CARD ── */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 12px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
}
.card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)22; }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent)33; }
.card[draggable] { cursor: grab; }
.card[draggable]:active { cursor: grabbing; opacity: 0.6; }

.card-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
}
.card-avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.card-id { font-size: 10px; color: var(--text2); font-family: monospace; }
.priority-pip {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-left: auto;
}
.pip-P0{background:var(--p0)} .pip-P1{background:var(--p1)}
.pip-P2{background:var(--p2)} .pip-P3{background:var(--p3)}

.card-title {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.45;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-footer {
  display: flex;
  align-items: center;
  gap: 6px;
}
.team-chip {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 500;
}
.tc-research    { background:#00897b22; color:#4db6ac; }
.tc-personal    { background:#c2185b22; color:#f48fb1; }
.tc-engineering { background:#1565c022; color:#64b5f6; }
.tc-content     { background:#6a1b9a22; color:#ce93d8; }
.tc-business    { background:#e65100aa; color:#ffcc02; background:#e6510022; color:#ffb74d; }
.tc-infrastructure { background:#2e7d3222; color:#81c784; }

.msg-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 3px;
}
.card-preview {
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
}
.blocked-label { font-size: 10px; color: var(--p0); margin-top: 4px; }

/* ── CHAT PANEL ── */
.chat-panel {
  width: var(--panel-w);
  min-width: var(--panel-w);
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.25s, min-width 0.25s;
}
.chat-panel.hidden {
  width: 0;
  min-width: 0;
  border-left: none;
  overflow: hidden;
}

/* chat header */
.chat-panel-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.cp-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.cp-info { flex: 1; min-width: 0; }
.cp-title {
  font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cp-sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }

/* status badge */
.st-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px;
  border-radius: 20px;
  font-size: 11px; font-weight: 600;
  cursor: pointer; border: none; outline: none;
}
.st-badge:hover { opacity: 0.8; }
.sb-new   { background: var(--bg3); color: var(--text2); }
.sb-prog  { background: #0d2d5e; color: #58a6ff; }
.sb-block { background: #3d1212; color: #f85149; }
.sb-done  { background: #0d3320; color: #3fb950; }

.prio-chip { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.pc-P0{background:var(--p0);color:#fff} .pc-P1{background:var(--p1);color:#0d1117}
.pc-P2{background:var(--p2);color:#0d1117} .pc-P3{background:var(--p3);color:#fff}

/* messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.msg-sys {
  text-align: center;
  font-size: 11px;
  color: var(--text2);
  padding: 6px 0;
}

.msg-ai { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 10px; }
.msg-av {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  align-self: flex-start;
}
.msg-ai-body { max-width: 80%; min-width: 0; }
.msg-name { font-size: 10px; color: var(--text2); margin-bottom: 3px; padding-left: 2px; }
.bubble-ai {
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 9px 13px;
  font-size: 12px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  border-radius: 2px 12px 12px 12px;
}
.bubble-ai a { color: #58a6ff; }
.msg-t-ai { font-size: 10px; color: var(--text2); margin-top: 3px; padding-left: 2px; }

.msg-human { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 10px; }
.bubble-human {
  background: var(--human);
  color: #fff;
  padding: 9px 13px;
  font-size: 12px;
  line-height: 1.65;
  max-width: 80%;
  white-space: pre-wrap;
  word-break: break-word;
  border-radius: 12px 2px 12px 12px;
}
.bubble-human a { color: #cde; }
.msg-t-human { font-size: 10px; color: var(--text2); margin-top: 3px; padding-right: 2px; }

.task-desc-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 13px;
  font-size: 12px;
  line-height: 1.65;
  color: var(--text2);
  margin-bottom: 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
.task-desc-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); margin-bottom: 5px; }

/* input */
.chat-input {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
.chat-input textarea {
  flex: 1;
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  font-family: inherit;
  resize: none;
  min-height: 38px;
  max-height: 110px;
  line-height: 1.5;
  outline: none;
}
.chat-input textarea:focus { border-color: var(--accent); }
.send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.send-btn:hover { opacity: 0.85; }

/* ── CONTROLS ── */
.btn {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.btn.danger  { color: var(--p0); border-color: transparent; background: none; }
.btn-icon { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 4px; }
.btn-icon:hover { color: var(--text); background: var(--bg3); }

input, select, textarea {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 13px;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

/* ── STATUS MENU ── */
.status-menu {
  position: fixed;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  z-index: 500;
  min-width: 150px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  overflow: hidden;
}
.status-menu.hidden { display: none; }
.sm-item {
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  display: flex; align-items: center; gap: 8px;
}
.sm-item:hover { background: var(--bg2); }
.sm-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── MODAL ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 400; padding: 16px;
}
.overlay.hidden { display: none; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 100%; max-width: 500px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.modal-header h2 { font-size: 15px; font-weight: 600; flex: 1; }
.modal-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; line-height: 1; }
.modal-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.field input, .field select, .field textarea { width: 100%; }
.field textarea { resize: vertical; min-height: 80px; }
.row2 { display: flex; gap: 12px; }
.row2 .field { flex: 1; }

/* ── MOBILE ── */
@media (max-width: 800px) {
  .chat-panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    z-index: 200;
    box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    width: 100% !important;
    min-width: 0 !important;
    transform: translateX(100%);
    transition: transform 0.25s;
  }
  .chat-panel:not(.hidden) { transform: translateX(0); }
  .chat-panel.hidden { transform: translateX(100%); width: 100% !important; }
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="header">
  <h1>🤖 AI Agent</h1>
  <input type="search" id="filterText" placeholder="🔍 検索" oninput="render()"
    style="width:160px;padding:5px 10px;font-size:13px">
  <select id="filterOrg" onchange="render()" style="font-size:12px">
    <option value="">組織: 全て</option>
    <option value="private">プライベート</option>
    <option value="shift-ai">SHIFT AI</option>
    <option value="otsunagi">OTSUNAGI</option>
    <option value="akkodis">AKKODiS</option>
  </select>
  <select id="filterTeam" onchange="render()" style="font-size:12px">
    <option value="">チーム: 全て</option>
    <option value="research">リサーチ</option>
    <option value="personal">パーソナル</option>
    <option value="engineering">エンジニア</option>
    <option value="content">コンテンツ</option>
    <option value="business">ビジネス</option>
  </select>
  <div class="header-right">
    <span id="syncStatus" style="font-size:11px;color:var(--text2);white-space:nowrap"></span>
    <button class="btn" onclick="syncNow()">🔄 同期</button>
    <button class="btn" onclick="showPatDialog()">🔑</button>
    <button class="btn primary" onclick="openCreate()">＋ 新規タスク</button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div class="main">

  <!-- ── KANBAN BOARD ── -->
  <div class="board-wrap" id="boardWrap">
    <!-- New Assigned -->
    <div class="column">
      <div class="col-header">
        <span class="col-dot" style="background:var(--col-new)"></span>
        <span class="col-title">未着手</span>
        <span class="col-count" id="cnt-new-assigned">0</span>
      </div>
      <div class="card-list" id="list-new-assigned"
        ondragover="onDragOver(event)" ondrop="onDrop(event,'new-assigned')" ondragleave="onDragLeave(event)"></div>
    </div>
    <!-- In Progress -->
    <div class="column">
      <div class="col-header">
        <span class="col-dot" style="background:var(--col-ip)"></span>
        <span class="col-title">進行中</span>
        <span class="col-count" id="cnt-in-progress">0</span>
      </div>
      <div class="card-list" id="list-in-progress"
        ondragover="onDragOver(event)" ondrop="onDrop(event,'in-progress')" ondragleave="onDragLeave(event)"></div>
    </div>
    <!-- Blocked -->
    <div class="column">
      <div class="col-header">
        <span class="col-dot" style="background:var(--col-bl)"></span>
        <span class="col-title">ブロック中</span>
        <span class="col-count" id="cnt-blocked">0</span>
      </div>
      <div class="card-list" id="list-blocked"
        ondragover="onDragOver(event)" ondrop="onDrop(event,'blocked')" ondragleave="onDragLeave(event)"></div>
    </div>
    <!-- Done -->
    <div class="column">
      <div class="col-header">
        <span class="col-dot" style="background:var(--col-done)"></span>
        <span class="col-title">完了</span>
        <span class="col-count" id="cnt-done">0</span>
      </div>
      <div class="card-list" id="list-done"
        ondragover="onDragOver(event)" ondrop="onDrop(event,'done')" ondragleave="onDragLeave(event)"></div>
    </div>
  </div>

  <!-- ── CHAT PANEL ── -->
  <div class="chat-panel hidden" id="chatPanel">

    <!-- Header -->
    <div class="chat-panel-header">
      <div class="cp-avatar" id="cpAvatar"></div>
      <div class="cp-info">
        <div class="cp-title" id="cpTitle"></div>
        <div class="cp-sub" id="cpSub"></div>
      </div>
      <button class="btn-icon" onclick="deleteActiveTask()" title="削除" style="color:var(--text2)">🗑</button>
      <button class="btn-icon" onclick="closePanel()" title="閉じる">✕</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="chatMessages"></div>

    <!-- Input -->
    <div class="chat-input">
      <textarea id="msgInput" placeholder="メッセージを送信（Shift+Enterで改行）..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>

  </div>

</div>

<!-- ── STATUS MENU ── -->
<div class="status-menu hidden" id="statusMenu">
  <div class="sm-item" onclick="setStatus('new-assigned')"><span class="sm-dot" style="background:var(--col-new)"></span> 未着手</div>
  <div class="sm-item" onclick="setStatus('in-progress')"><span class="sm-dot" style="background:var(--col-ip)"></span> 進行中</div>
  <div class="sm-item" onclick="setStatus('blocked')"><span class="sm-dot" style="background:var(--col-bl)"></span> ブロック中</div>
  <div class="sm-item" onclick="setStatus('done')"><span class="sm-dot" style="background:var(--col-done)"></span> 完了</div>
</div>

<!-- ── CREATE MODAL ── -->
<div class="overlay hidden" id="createOverlay" onclick="closeBg(event,'createOverlay')">
  <div class="modal">
    <div class="modal-header">
      <h2>＋ 新しいタスク</h2>
      <button class="modal-close" onclick="closeCreate()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>タイトル *</label>
        <input type="text" id="cTitle" placeholder="何をしたいか一言で">
      </div>
      <div class="field">
        <label>説明・背景</label>
        <textarea id="cDesc" placeholder="目的・ゴール・詳細など"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>担当者</label>
          <select id="cAssignee">
            <option value="research-analyst">🔎 research-analyst</option>
            <option value="career-advisor">🧭 career-advisor</option>
            <option value="human">👤 human</option>
            <option value="tech-lead">🔧 tech-lead</option>
            <option value="frontend-engineer">🎨 frontend-engineer</option>
            <option value="backend-engineer">⚙️ backend-engineer</option>
            <option value="qa-engineer">🧪 qa-engineer</option>
            <option value="content-director">📝 content-director</option>
            <option value="marketing-director">📣 marketing-director</option>
            <option value="business-strategist">💼 business-strategist</option>
            <option value="partnership-manager">🤝 partnership-manager</option>
            <option value="legal-review">⚖️ legal-review</option>
          </select>
        </div>
        <div class="field">
          <label>優先度</label>
          <select id="cPriority">
            <option value="P0">🔴 P0 緊急</option>
            <option value="P1">🟠 P1 高</option>
            <option value="P2" selected>🟡 P2 中</option>
            <option value="P3">🔵 P3 低</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>チーム</label>
          <select id="cTeam">
            <option value="research">リサーチ</option>
            <option value="personal">パーソナル</option>
            <option value="engineering">エンジニア</option>
            <option value="content">コンテンツ</option>
            <option value="business">ビジネス</option>
          </select>
        </div>
        <div class="field">
          <label>組織</label>
          <select id="cOrg">
            <option value="private" selected>プライベート</option>
            <option value="shift-ai">SHIFT AI</option>
            <option value="otsunagi">OTSUNAGI</option>
            <option value="akkodis">AKKODiS</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeCreate()">キャンセル</button>
      <button class="btn primary" onclick="createTask()">作成</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="onFileImport(event)">

<script>
// ── Config ──
var STORAGE_KEY      = 'ai-agent-tasks';
var PAT_KEY          = 'ai-agent-github-pat';
var GITHUB_TASKS_URL = 'https://raw.githubusercontent.com/k-yabe/claude-code-book-template/main/ai-agent-org/tasks/tasks.json';
var GITHUB_API_URL   = 'https://api.github.com/repos/k-yabe/claude-code-book-template/contents/ai-agent-org/tasks/tasks.json';

var tasks        = [];
var activeId     = null;
var dragId       = null;
var lastSynced   = null;
var pushInFlight = false;
var pushPending  = false;

var AGENTS = {
  'human':               {e:'👤', c:'#1f6feb'},
  'research-analyst':    {e:'🔎', c:'#00897b'},
  'career-advisor':      {e:'🧭', c:'#c2185b'},
  'tech-lead':           {e:'🔧', c:'#1565c0'},
  'frontend-engineer':   {e:'🎨', c:'#6a1b9a'},
  'backend-engineer':    {e:'⚙️', c:'#0277bd'},
  'qa-engineer':         {e:'🧪', c:'#2e7d32'},
  'content-director':    {e:'📝', c:'#4527a0'},
  'brand-voice':         {e:'🎙️', c:'#6d4c41'},
  'root-cause':          {e:'🔍', c:'#37474f'},
  'anti-ai-slop':        {e:'🚫', c:'#bf360c'},
  'marketing-director':  {e:'📣', c:'#f57f17'},
  'business-strategist': {e:'💼', c:'#004d40'},
  'partnership-manager': {e:'🤝', c:'#558b2f'},
  'legal-review':        {e:'⚖️', c:'#4e342e'},
  'task-dispatcher':     {e:'📬', c:'#37474f'},
};

var TEAM_CSS = {
  research:'tc-research', personal:'tc-personal',
  engineering:'tc-engineering', content:'tc-content',
  business:'tc-business', infrastructure:'tc-infrastructure'
};
var TEAM_LABELS = {
  research:'リサーチ', personal:'パーソナル', engineering:'エンジニア',
  content:'コンテンツ', business:'ビジネス', infrastructure:'インフラ'
};
var STATUS_CFG = {
  'new-assigned': {label:'未着手',  sb:'sb-new',   col:'var(--col-new)'},
  'in-progress':  {label:'進行中',  sb:'sb-prog',  col:'var(--col-ip)'},
  'blocked':      {label:'ブロック',sb:'sb-block', col:'var(--col-bl)'},
  'done':         {label:'完了',    sb:'sb-done',  col:'var(--col-done)'},
};

// ── Util ──
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ag(name){ return AGENTS[name]||{e:'🤖',c:'#444'}; }
function fmtDate(ts){
  if(!ts) return '';
  var d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  return (d.getMonth()+1)+'/'+(d.getDate())+' '+d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}
function linkify(text){
  return h(text).replace(/(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function isSys(c){
  return !c.content ? false :
    c.content.includes('タスクを開始しました') ||
    c.content.includes('📋 ステータスを') ||
    c.content.includes('🔁 ブロック解除') ||
    c.author === 'system';
}

// ── Storage ──
function load(){ var r=localStorage.getItem(STORAGE_KEY); if(r){try{tasks=JSON.parse(r);}catch(e){}} }
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks)); }

// ── GitHub ──
function getPat(){ return localStorage.getItem(PAT_KEY)||''; }
function setPat(t){ localStorage.setItem(PAT_KEY,t); }
function setSyncStatus(msg,color){
  var el=document.getElementById('syncStatus');
  if(el){el.textContent=msg; el.style.color=color||'var(--text2)';}
}
function showPatDialog(){
  var v=prompt('GitHub Personal Access Token\n(Contents: Read and write 権限が必要)',getPat());
  if(v===null) return;
  setPat(v.trim());
  setSyncStatus(v.trim()?'🔑 設定済み':'🔑 未設定', v.trim()?'#3fb950':'#f85149');
}

function saveAndPush(){ save(); executePush(); }
function executePush(){
  if(pushInFlight){pushPending=true;return;}
  pushInFlight=true; pushPending=false;
  pushToGitHub().finally(function(){
    pushInFlight=false;
    if(pushPending){pushPending=false;executePush();}
  });
}
function pushToGitHub(){
  var pat=getPat();
  if(!pat){ setSyncStatus('⚠️ 未保存 — 🔑でトークン設定','#f85149'); return Promise.resolve(); }
  setSyncStatus('保存中...','#58a6ff');
  var payload=JSON.stringify({version:'1.0',lastUpdated:new Date().toISOString(),tasks:tasks},null,2);
  return fetch(GITHUB_API_URL,{headers:{Authorization:'token '+pat,Accept:'application/vnd.github.v3+json'}})
    .then(function(r){return r.json();})
    .then(function(meta){
      return fetch(GITHUB_API_URL,{
        method:'PUT',
        headers:{Authorization:'token '+pat,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify({message:'bot: タスクボードから更新',content:btoa(unescape(encodeURIComponent(payload))),sha:meta.sha})
      });
    })
    .then(function(r){
      if(r.ok) setSyncStatus('✅ 保存済み '+new Date().toLocaleTimeString('ja-JP'),'#3fb950');
      else setSyncStatus('⚠️ 保存失敗','#f85149');
    })
    .catch(function(){setSyncStatus('⚠️ 保存失敗','#f85149');});
}

function loadFromGitHub(silent){
  if(!silent) setSyncStatus('同期中...','#58a6ff');
  return fetch(GITHUB_TASKS_URL+'?t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(data){
      var f=data.tasks||data;
      if(!Array.isArray(f)) throw new Error('invalid');
      tasks=f; save(); lastSynced=new Date();
      setSyncStatus('同期済み '+lastSynced.toLocaleTimeString('ja-JP'),'#3fb950');
      render();
      if(activeId) renderChat();
    })
    .catch(function(){
      setSyncStatus('取得失敗 — ローカル使用','#f85149');
      load(); render();
    });
}
function syncNow(){ loadFromGitHub(false); }

function startAutoRefresh(){
  setInterval(function(){
    if(!document.getElementById('statusMenu').classList.contains('hidden')) return;
    if(!document.getElementById('createOverlay').classList.contains('hidden')) return;
    loadFromGitHub(true);
  },60000);
}

// ── ID ──
function nextId(){
  if(!tasks.length) return 'T001';
  var max=0;
  tasks.forEach(function(t){var n=parseInt(t.id.replace('T',''),10);if(n>max)max=n;});
  var s=String(max+1); while(s.length<3)s='0'+s; return 'T'+s;
}

// ── Filter ──
function filtered(){
  var fq=(document.getElementById('filterText').value||'').toLowerCase();
  var ft=document.getElementById('filterTeam').value;
  var fo=document.getElementById('filterOrg').value;
  return tasks.filter(function(t){
    if(ft && t.team!==ft) return false;
    if(fo && t.organization!==fo) return false;
    if(fq){
      var hay=((t.title||'')+' '+(t.id||'')).toLowerCase();
      if(hay.indexOf(fq)===-1) return false;
    }
    return true;
  });
}

// ── RENDER BOARD ──
function render(){
  var ft=filtered();
  ['new-assigned','in-progress','blocked','done'].forEach(function(col){
    var list=document.getElementById('list-'+col);
    var cnt=document.getElementById('cnt-'+col);
    var colTasks=ft.filter(function(t){return t.status===col;});
    cnt.textContent=colTasks.length;
    if(!colTasks.length){
      list.innerHTML='<div style="text-align:center;color:var(--text2);font-size:12px;padding:20px 0">タスクなし</div>';
      return;
    }
    list.innerHTML=colTasks.map(cardHTML).join('');
  });
}

function cardHTML(t){
  var a=ag(t.assignee);
  var tc=TEAM_CSS[t.team]||'tc-engineering';
  var tl=TEAM_LABELS[t.team]||t.team;
  var cc=(t.comments&&t.comments.length)||0;
  var lastMsg=cc?t.comments[cc-1]:null;
  var preview=lastMsg&&!isSys(lastMsg)
    ? lastMsg.content.replace(/\n/g,' ').slice(0,55)
    : (t.description||'').slice(0,55);
  var blocked=t.status==='blocked'&&t.blockedReason
    ? '<div class="blocked-label">⛔ '+h(t.blockedReason)+'</div>' : '';
  return '<div class="card'+(activeId===t.id?' active':'')+'" draggable="true"'
    +' ondragstart="onDragStart(event,\''+h(t.id)+'\')"'
    +' onclick="openPanel(\''+h(t.id)+'\')">'
    +'<div class="card-top">'
    +'<div class="card-avatar" style="background:'+a.c+'22;border:1px solid '+a.c+'44">'+a.e+'</div>'
    +'<span class="card-id">'+h(t.id)+'</span>'
    +'<span class="priority-pip pip-'+t.priority+'"></span>'
    +'</div>'
    +'<div class="card-title">'+h(t.title)+'</div>'
    +(preview?'<div class="card-preview">'+h(preview)+'</div>':'')
    +blocked
    +'<div class="card-footer">'
    +'<span class="team-chip '+tc+'">'+tl+'</span>'
    +'<span class="msg-count">💬 '+cc+'</span>'
    +'</div>'
    +'</div>';
}

// ── DRAG & DROP ──
function onDragStart(e,id){ dragId=id; e.dataTransfer.effectAllowed='move'; }
function onDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function onDrop(e,newStatus){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(!dragId) return;
  var t=tasks.find(function(x){return x.id===dragId;});
  if(!t||t.status===newStatus){dragId=null;return;}
  var old=STATUS_CFG[t.status]||{label:t.status};
  var nw=STATUS_CFG[newStatus]||{label:newStatus};
  t.status=newStatus; t.updatedAt=new Date().toISOString();
  t.comments=t.comments||[];
  t.comments.push({author:'system',content:'📋 ステータスを「'+old.label+'」→「'+nw.label+'」に変更',timestamp:new Date().toISOString()});
  dragId=null; saveAndPush(); render();
  if(activeId===t.id) renderChatHeader();
}

// ── PANEL OPEN/CLOSE ──
function openPanel(id){
  activeId=id;
  document.getElementById('chatPanel').classList.remove('hidden');
  renderChatHeader();
  renderChat();
  render();
  setTimeout(function(){
    var m=document.getElementById('chatMessages');
    m.scrollTop=m.scrollHeight;
  },50);
}
function closePanel(){
  document.getElementById('chatPanel').classList.add('hidden');
  activeId=null; render();
}

// ── CHAT HEADER ──
function renderChatHeader(){
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t) return;
  var a=ag(t.assignee);
  var sc=STATUS_CFG[t.status]||STATUS_CFG['new-assigned'];
  document.getElementById('cpAvatar').textContent=a.e;
  document.getElementById('cpAvatar').style.cssText='background:'+a.c+'22;border:1.5px solid '+a.c+'55;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0';
  document.getElementById('cpTitle').textContent=t.title;
  document.getElementById('cpSub').innerHTML=
    '<button class="st-badge '+sc.sb+'" onclick="toggleStatusMenu(event)">● '+sc.label+' ▾</button>'
    +'<span class="prio-chip pc-'+t.priority+'">'+t.priority+'</span>'
    +'<span style="font-size:11px;color:var(--text2)">'+a.e+' '+h(t.assignee)+'</span>';
}

// ── STATUS MENU ──
function toggleStatusMenu(e){
  e.stopPropagation();
  var menu=document.getElementById('statusMenu');
  if(menu.classList.contains('hidden')){
    var r=e.target.getBoundingClientRect();
    menu.style.top=(r.bottom+4)+'px'; menu.style.left=r.left+'px';
    menu.classList.remove('hidden');
  } else { menu.classList.add('hidden'); }
}
document.addEventListener('click',function(){ document.getElementById('statusMenu').classList.add('hidden'); });

function setStatus(newStatus){
  document.getElementById('statusMenu').classList.add('hidden');
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t||t.status===newStatus) return;
  var old=STATUS_CFG[t.status]||{label:t.status};
  var nw=STATUS_CFG[newStatus]||{label:newStatus};
  t.status=newStatus; t.updatedAt=new Date().toISOString();
  t.comments=t.comments||[];
  t.comments.push({author:'system',content:'📋 ステータスを「'+old.label+'」→「'+nw.label+'」に変更',timestamp:new Date().toISOString()});
  saveAndPush(); render(); renderChatHeader(); renderChat();
}

// ── RENDER CHAT ──
function renderChat(){
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t) return;
  var html='';

  if(t.description){
    html+='<div class="task-desc-box">'
      +'<div class="task-desc-label">📋 タスク概要</div>'
      +linkify(t.description)
      +'</div>';
  }

  (t.comments||[]).forEach(function(c){
    if(isSys(c)){
      html+='<div class="msg-sys">'+h(c.content)+'<span style="margin-left:6px;font-size:10px">'+fmtDate(c.timestamp)+'</span></div>';
    } else if(c.author==='human'){
      html+='<div class="msg-human">'
        +'<div class="bubble-human">'+linkify(c.content)+'</div>'
        +'<div class="msg-t-human">'+fmtDate(c.timestamp)+'</div>'
        +'</div>';
    } else {
      var a=ag(c.author);
      html+='<div class="msg-ai">'
        +'<div class="msg-av" style="background:'+a.c+'22;border:1px solid '+a.c+'44">'+a.e+'</div>'
        +'<div class="msg-ai-body">'
        +'<div class="msg-name">'+h(c.author)+'</div>'
        +'<div class="bubble-ai">'+linkify(c.content)+'</div>'
        +'<div class="msg-t-ai">'+fmtDate(c.timestamp)+'</div>'
        +'</div>'
        +'</div>';
    }
  });

  var el=document.getElementById('chatMessages');
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

// ── SEND ──
function sendMsg(){
  var input=document.getElementById('msgInput');
  var content=input.value.trim();
  if(!content||!activeId) return;
  var t=tasks.find(function(x){return x.id===activeId;});
  if(!t) return;
  t.comments=t.comments||[];
  t.comments.push({author:'human',content:content,timestamp:new Date().toISOString()});
  t.updatedAt=new Date().toISOString();
  input.value=''; input.style.height='';
  saveAndPush(); render(); renderChat();
}
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; }

// ── DELETE ──
function deleteActiveTask(){
  if(!activeId||!confirm('タスク '+activeId+' を削除しますか？')) return;
  tasks=tasks.filter(function(t){return t.id!==activeId;});
  activeId=null; saveAndPush();
  document.getElementById('chatPanel').classList.add('hidden');
  render();
}

// ── CREATE ──
function openCreate(){ document.getElementById('createOverlay').classList.remove('hidden'); setTimeout(function(){document.getElementById('cTitle').focus();},50); }
function closeCreate(){ document.getElementById('createOverlay').classList.add('hidden'); }
function closeBg(e,id){ if(e.target===document.getElementById(id)) document.getElementById(id).classList.add('hidden'); }

function createTask(){
  var title=document.getElementById('cTitle').value.trim();
  if(!title){alert('タイトルは必須です');return;}
  var now=new Date().toISOString();
  var assignee=document.getElementById('cAssignee').value;
  var t={
    id:nextId(), title:title,
    description:document.getElementById('cDesc').value.trim(),
    status:'new-assigned',
    priority:document.getElementById('cPriority').value,
    assignee:assignee, assigneeType:assignee==='human'?'human':'ai',
    team:document.getElementById('cTeam').value,
    organization:document.getElementById('cOrg').value,
    createdAt:now, updatedAt:now,
    comments:[], blockedReason:'', tags:[]
  };
  tasks.unshift(t); saveAndPush(); closeCreate(); render(); openPanel(t.id);
}

// ── IMPORT / EXPORT ──
function doExport(){
  var blob=new Blob([JSON.stringify({version:'1.0',lastUpdated:new Date().toISOString(),tasks:tasks},null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tasks.json'; a.click(); URL.revokeObjectURL(a.href);
}
function doImport(){ document.getElementById('fileInput').value=''; document.getElementById('fileInput').click(); }
function onFileImport(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var imported=data.tasks||data;
      if(!Array.isArray(imported)) throw new Error('tasks配列なし');
      tasks=imported; save(); render(); alert(tasks.length+'件インポートしました');
    }catch(err){alert('エラー: '+err.message);}
  };
  reader.readAsText(file);
}

// ── BOOT ──
load();
loadFromGitHub(false);
startAutoRefresh();
</script>
</body>
</html>
