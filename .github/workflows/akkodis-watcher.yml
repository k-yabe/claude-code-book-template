name: AKKODiS Watcher

on:
  schedule:
    # 毎日 JST 8:00（UTC 23:00）に実行（GitHub遅延を考慮して1時間早め）
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r apps/akkodis-watcher/requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        run: python apps/akkodis-watcher/scraper.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/akkodis-watcher/data/articles.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update akkodis articles [skip ci]"
          # ai-news-collect.yml と同じ cron '0 23 * * *' で並走するため、
          # 単純 push では non-fast-forward で fail することがある。
          # pull --rebase してリトライ。
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push failed (attempt $attempt); fetching & rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || {
              echo "::error::rebase failed; aborting"
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
