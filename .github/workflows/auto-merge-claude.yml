name: Auto-merge Claude branches

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -x
          echo "Branch: $BRANCH"
          gh --version
          echo "Checking for existing PR..."
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // ""' 2>&1 || echo "")
          echo "Existing PR: '$EXISTING'"
          if [ -n "$EXISTING" ]; then
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL=$(gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "auto: merge $BRANCH to main" \
            --body "Automated PR from Claude Code session.")
          echo "Created: $URL"
          NUM=$(echo "$URL" | grep -oE '[0-9]+$')
          echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -x
          echo "Merging PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --squash --delete-branch --admin 2>&1 || \
            gh pr merge "$PR_NUMBER" --squash --delete-branch 2>&1 || \
            (echo "Merge failed — may require manual review. PR is open at:" && \
             gh pr view "$PR_NUMBER" --json url --jq '.url')
