name: Auto-merge Claude branches

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or merge PR (debug artifact)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          {
            echo "=== DEBUG $(date -u) ==="
            echo "Branch: $BRANCH  Repo: $REPO"
            echo
            echo "=== Check existing PR ==="
            curl -sv \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls?head=${REPO%%/*}:${BRANCH}&state=open" 2>&1 | head -60
            echo
            echo "=== Try create PR ==="
            curl -sv -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls" \
              -d "{\"title\":\"auto: merge $BRANCH to main\",\"head\":\"$BRANCH\",\"base\":\"main\",\"body\":\"Automated PR\"}" 2>&1 | head -80
          } > /tmp/debug.log 2>&1
          cp /tmp/debug.log debug-auto-merge.log

      - name: Commit debug log back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug-auto-merge.log
          git commit -m "debug: auto-merge output [skip ci]" || exit 0
          git push origin "${{ github.ref_name }}" || exit 0
