name: Auto-merge Claude branches

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward merge to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Branch: $BRANCH"
          git fetch origin main "$BRANCH"

          # Create PR via API if not exists
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "Creating PR..."
            PR_URL=$(gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "auto: merge $BRANCH to main" \
              --body "Automated PR from Claude Code session. Branch: \`$BRANCH\`")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #$PR_NUMBER"
          else
            echo "Found existing PR #$PR_NUMBER"
          fi

          # Merge the PR (squash)
          echo "Merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --delete-branch --admin || \
            gh pr merge "$PR_NUMBER" --squash --delete-branch
