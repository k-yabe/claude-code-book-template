name: Auto-merge Claude branches

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or get PR (REST)
        id: pr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "Branch: $BRANCH  Repo: $REPO"
          # Check existing open PR
          EXISTING=$(curl -sfL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?head=${REPO%%/*}:${BRANCH}&state=open" \
            | jq -r '.[0].number // ""')
          echo "Existing PR number: '$EXISTING'"
          if [ -n "$EXISTING" ]; then
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$(jq -n --arg t "auto: merge $BRANCH to main" --arg h "$BRANCH" --arg b "main" --arg body "Automated PR from Claude Code session." '{title:$t, head:$h, base:$b, body:$body}')")
          STATUS=$(echo "$RESP" | tail -1 | cut -d: -f2)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $STATUS"
          echo "$BODY" | head -c 2000
          if [ "$STATUS" != "201" ]; then
            exit 1
          fi
          NUM=$(echo "$BODY" | jq -r '.number')
          echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Merge PR (REST)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -e
          echo "Merging PR #$PR_NUMBER"
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -d '{"merge_method":"squash"}')
          STATUS=$(echo "$RESP" | tail -1 | cut -d: -f2)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $STATUS"
          echo "$BODY" | head -c 2000
          if [ "$STATUS" != "200" ]; then
            echo "Merge failed. PR left open for manual review."
            exit 0
          fi
