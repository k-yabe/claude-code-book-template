name: Auto-merge Claude branches

# REQUIREMENT: Repo Settings → Actions → General → Workflow permissions
#   must be set to "Read and write permissions".
# 権限不足時は 403 (x-accepted-github-permissions: pull_requests=write) で失敗する。

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # [skip ci] コミットはスキップ
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or get PR
        id: pr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          OWNER=${REPO%%/*}
          mkdir -p .debug
          # 既存の open PR を確認
          EXISTING=$(curl -sfL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&state=open" \
            | jq -r '.[0].number // ""')
          if [ -n "$EXISTING" ]; then
            echo "Existing PR #$EXISTING"
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "EXISTING PR #$EXISTING found" > .debug/pr.log
            exit 0
          fi
          # 新規作成（詳細ログ付）
          RESP=$(curl -sS -D .debug/headers.txt -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$(jq -n --arg t "auto: merge $BRANCH to main" --arg h "$BRANCH" '{title:$t, head:$h, base:"main", body:"Automated PR from Claude Code session."}')")
          STATUS=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $STATUS" | tee .debug/pr.log
          echo "$BODY" | tee -a .debug/pr.log
          echo "---HEADERS---" >> .debug/pr.log
          cat .debug/headers.txt >> .debug/pr.log
          if [ "$STATUS" != "201" ]; then
            echo "::error::PR作成失敗 (HTTP $STATUS)"
            echo "pr_number=FAIL" >> "$GITHUB_OUTPUT"
          else
            NUM=$(echo "$BODY" | jq -r '.number')
            echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload debug log on failure
        if: steps.pr.outputs.pr_number == 'FAIL'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .debug/
          git commit -m "debug: auto-merge workflow output [skip ci]" || true
          git push origin HEAD:${BRANCH} || true
          exit 1

      - name: Merge PR (squash)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -e
          RESP=$(curl -sS -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -d '{"merge_method":"squash"}')
          STATUS=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $STATUS"
          echo "$BODY" | head -c 500
          if [ "$STATUS" != "200" ]; then
            echo "::warning::マージ失敗 (HTTP $STATUS). ブランチ保護がレビュー必須になっている可能性があります。"
            exit 0
          fi

      - name: Delete branch
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}" || true
