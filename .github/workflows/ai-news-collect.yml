name: AI NEWS 自動収集

on:
  schedule:
    # 毎朝 JST 8:00（UTC 23:00）に実行。GitHub遅延込みで8:10前後を想定。
    - cron: '0 23 * * *'
  workflow_dispatch:
  # main へのトリガーファイル更新でのみ scraper を起動する。
  # 過去 claude/** branch でも起動していたが、auto-merge と workflow が並走する
  # と audio commit が orphaned branch に残る race condition が発生していたため
  # main only に絞った。claude/** で trigger-scraper を更新しても、auto-merge で
  # main にマージされた瞬間に main 側の workflow が起動して main に audio を
  # commit するので機能としては変わらない。
  push:
    branches:
      - main
    paths:
      - 'apps/ai-news/.trigger-scraper'

permissions:
  contents: write

concurrency:
  group: ai-news-collect
  cancel-in-progress: true

jobs:
  collect:
    # [skip ci] が付いた scraper 自身のコミットでは実行しない（無限ループ防止）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r apps/ai-news/requirements.txt

      - name: Install ffmpeg (VOICEVOX WAV → MP3 変換用)
        # ubuntu-latest (24.04) には ffmpeg がプリインストールされていないため明示インストール。
        # ~3-5 秒で完了。VOICEVOX の WAV 出力を MP3 に変換するためだけに使う。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Start AivisSpeech engine (CPU) and warmup synthesis
        # 完全無料・登録不要・商用OK（クレジット表記不要）の日本語特化 TTS。
        # Style-Bert-VITS2 ベースで VOICEVOX よりプロアナウンサー級の自然さ。
        # 初回は default voice model (250MB) + BERT (650MB) を auto-download するため
        # /version 応答まで最大 7 分ほどかかる。warmup synthesis でモデル loading も完了させる。
        # 失敗時は apps/ai-news/data/_aivis_diag.log に診断情報を残し、次回の commit で
        # 内容を main に取り込んで原因特定を容易にする。
        run: |
          mkdir -p apps/ai-news/data
          DIAG="apps/ai-news/data/_aivis_diag.log"
          echo "=== run started: $(date -u +%Y-%m-%dT%H:%M:%SZ) ===" > "$DIAG"
          # Docker pull の状態を別途記録（失敗ならログ確認しやすい）
          {
            echo "--- docker pull ---"
            docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-1.2.0 2>&1
            echo "--- docker pull exit=$? ---"
          } >> "$DIAG"
          docker run -d --rm \
            --name aivisspeech \
            -p 127.0.0.1:10101:10101 \
            ghcr.io/aivis-project/aivisspeech-engine:cpu-1.2.0 >> "$DIAG" 2>&1
          echo "--- docker run exit=$? ---" >> "$DIAG"
          {
            echo "--- python warmup ---"
            python3 - 2>&1 <<'PY'
          import json, sys, time, urllib.request
          base = "http://127.0.0.1:10101"
          # /version 待機（モデル DL 込みなので最大 7 分待つ）
          for i in range(210):
              try:
                  urllib.request.urlopen(base + "/version", timeout=2).read()
                  print(f"aivisspeech /version OK after {i*2}s")
                  break
              except Exception:
                  time.sleep(2)
          else:
              print("::warning::aivisspeech /version did not respond within 420s")
              sys.exit(2)
          # /speakers から使える話者を選択。優先: Anneli > 最初の話者の最初のスタイル
          try:
              speakers = json.loads(urllib.request.urlopen(base + "/speakers", timeout=30).read())
              # 全 speaker / styles を一覧出力（diag log に残るので原因特定しやすい）
              print(f"== /speakers returned {len(speakers)} entries ==")
              for s in speakers:
                  name = s.get("name", "?")
                  styles = s.get("styles", [])
                  print(f"  speaker '{name}': {len(styles)} styles")
                  for st in styles:
                      print(f"    style id={st.get('id')} name='{st.get('name')}'")
              # 1) Anneli を探す（含まれていれば優先）
              picked = next((s for s in speakers if "Anneli" in (s.get("name") or "")), None)
              picked_label = "Anneli" if picked else None
              # 2) 落ち着き系（"落ち着き" "ノーマル" "通常"）スタイルを持つ任意の speaker
              if not picked:
                  for s in speakers:
                      for st in s.get("styles", []):
                          if any(k in (st.get("name") or "") for k in ("ノーマル", "通常", "落ち着き", "Normal")):
                              picked = s
                              picked_label = f"{s.get('name')} (calm style preferred)"
                              break
                      if picked:
                          break
              # 3) それでも無ければ最初の speaker
              if not picked and speakers:
                  picked = speakers[0]
                  picked_label = f"{picked.get('name')} (first available)"
              if not picked or not picked.get("styles"):
                  print(f"::warning::no usable speaker found in {len(speakers)} entries")
                  sys.exit(3)
              # 落ち着き系 style 優先 → 無ければ先頭
              styles = picked.get("styles", [])
              chosen_style = next(
                  (st for st in styles if any(
                      k in (st.get("name") or "") for k in ("落ち着き", "ノーマル", "通常", "Normal"))
                  ),
                  styles[0],
              )
              default_style_id = chosen_style["id"]
              print(f"chosen: {picked_label} / style='{chosen_style.get('name')}' / id={default_style_id}")
              with open("/tmp/aivis_speaker_id", "w") as f:
                  f.write(str(default_style_id))
              with open("/tmp/aivis_speaker_label", "w") as f:
                  f.write(f"{picked.get('name')} ({chosen_style.get('name')})")
          except Exception as e:
              print(f"::warning::failed to fetch /speakers: {e}")
              sys.exit(4)
          # ウォームアップ合成（短文でモデルを load）
          print(f"warming up Anneli (id={default_style_id}, text='テスト')...")
          t0 = time.time()
          try:
              q_url = base + f"/audio_query?speaker={default_style_id}&text=%E3%83%86%E3%82%B9%E3%83%88"
              q = json.loads(urllib.request.urlopen(urllib.request.Request(q_url, method="POST"), timeout=120).read())
              s_req = urllib.request.Request(
                  base + f"/synthesis?speaker={default_style_id}",
                  method="POST",
                  headers={"Content-Type": "application/json", "Accept": "audio/wav"},
                  data=json.dumps(q).encode("utf-8"),
              )
              wav = urllib.request.urlopen(s_req, timeout=300).read()
              if not wav or len(wav) < 1000:
                  print(f"::warning::warmup WAV too small: {len(wav)} bytes")
                  sys.exit(5)
              print(f"aivisspeech warmup OK: {len(wav)} bytes WAV in {time.time()-t0:.1f}s")
              sys.exit(0)
          except Exception as e:
              print(f"::warning::warmup synthesis failed: {e}")
              sys.exit(6)
          PY
            echo "--- python warmup exit=$? ---"
          } >> "$DIAG" 2>&1
          warmup_status=$?
          {
            echo "--- docker logs aivisspeech (last 60) ---"
            docker logs aivisspeech 2>&1 | tail -60 || echo "(no docker logs)"
            echo "--- end ---"
          } >> "$DIAG" 2>&1
          if [ "$warmup_status" -eq 0 ]; then
            echo "AIVISSPEECH_OK=1" >> "$GITHUB_ENV"
            echo "AIVISSPEECH_SPEAKER_ID=$(cat /tmp/aivis_speaker_id 2>/dev/null)" >> "$GITHUB_ENV"
            echo "aivisspeech is ready for scraper"
          else
            echo "AIVISSPEECH_OK=0" >> "$GITHUB_ENV"
            echo "aivisspeech warmup failed (status=$warmup_status); will fall back"
          fi
        continue-on-error: true

      - name: Collect & summarize & generate audio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Google Cloud TTS（無料枠で月100万字、Neural2-B はプロアナウンサー級）が
          # 設定されていれば最優先で使う。それ以外は VOICEVOX/Azure/ElevenLabs/OpenAI。
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # ウォームアップ済みの時だけ scraper が AivisSpeech を叩く。
          # 失敗時は空文字なので scraper は Azure → ElevenLabs → OpenAI に自動フォールバック。
          # AivisSpeech は VOICEVOX API 互換なので環境変数名はそのまま流用。
          VOICEVOX_BASE_URL: ${{ env.AIVISSPEECH_OK == '1' && 'http://127.0.0.1:10101' || '' }}
          VOICEVOX_SPEAKER_ID: ${{ env.AIVISSPEECH_SPEAKER_ID }}
          # AivisSpeech 用に chunk サイズを少し小さめに（モデルが重いため）
          VOICEVOX_CHUNK_CHARS: '500'
          # 合計テキスト長も短めに抑えて synthesis 時間を確保（CPU で長文を一気に作るのが重いため）
          VOICEVOX_MAX_CHARS: '1500'
        run: |
          echo "::group::Python scraper output"
          python -u apps/ai-news/scraper.py
          EXIT_CODE=$?
          echo "::endgroup::"
          echo "Python exit code: $EXIT_CODE"
          echo "::group::Files in data/ after scraper"
          ls -la apps/ai-news/data/ || echo "data/ missing"
          echo "=== debug.json ==="
          cat apps/ai-news/data/debug.json 2>/dev/null || echo "(no debug.json)"
          echo "::endgroup::"
          exit $EXIT_CODE

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 存在するファイルだけ add する（missing は silent skip）
          for f in apps/ai-news/data/news.json apps/ai-news/data/debug.json apps/ai-news/data/_aivis_diag.log; do
            [ -f "$f" ] && git add "$f" && echo "added: $f"
          done
          [ -d apps/ai-news/data/archives ] && git add apps/ai-news/data/archives/
          [ -d apps/ai-news/data/audio ] && git add apps/ai-news/data/audio/
          echo "--- staged files ---"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update ai-news data [skip ci]"
          # akkodis-watcher.yml が同じ cron '0 23 * * *' で並走して main に push するため、
          # 単純な git push では non-fast-forward で fail することがある（1日 1ジョブ失敗の主因）。
          # pull --rebase でリモートを取り込んで再 push をリトライする。
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push failed (attempt $attempt); fetching & rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || {
              echo "::error::rebase failed; aborting"
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
