name: AI NEWS 自動収集

on:
  schedule:
    # 毎朝 JST 8:00（UTC 23:00）に実行。GitHub遅延込みで8:10前後を想定。
    - cron: '0 23 * * *'
  workflow_dispatch:
  # トリガー用ファイルへの push で scraper を任意タイミングで起動
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apps/ai-news/.trigger-scraper'

permissions:
  contents: write

concurrency:
  group: ai-news-collect
  cancel-in-progress: true

jobs:
  collect:
    # [skip ci] が付いた scraper 自身のコミットでは実行しない（無限ループ防止）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r apps/ai-news/requirements.txt

      - name: Install ffmpeg (VOICEVOX WAV → MP3 変換用)
        # ubuntu-latest (24.04) には ffmpeg がプリインストールされていないため明示インストール。
        # ~3-5 秒で完了。VOICEVOX の WAV 出力を MP3 に変換するためだけに使う。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Start VOICEVOX engine (CPU) and warmup synthesis
        # 完全無料・登録不要の日本語ネイティブ TTS。
        # /version は速く返るがモデル loading は初回 synthesis で lazy に走るため
        # ここで短文ウォームアップ合成までやってから次のステップに渡す。
        run: |
          set -euxo pipefail
          docker run -d --rm \
            --name voicevox \
            -p 127.0.0.1:50021:50021 \
            voicevox/voicevox_engine:cpu-latest
          # 1) /version が 200 を返すまで最大 180 秒待つ
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "voicevox /version OK after ${i}x2s"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::warning::voicevox /version did not respond within 180s; falling back to other TTS"
            docker logs voicevox 2>&1 | tail -30 || true
            echo "VOICEVOX_OK=0" >> "$GITHUB_ENV"
            exit 0
          fi
          # 2) ウォームアップ合成（短文で青山龍星モデルをロード、これで以降の合成が速くなる）
          echo "warming up voicevox (speaker=13, short text)..."
          QUERY=$(curl -fsS --max-time 30 -X POST \
            "http://127.0.0.1:50021/audio_query?speaker=13&text=%E3%83%86%E3%82%B9%E3%83%88") \
            || { echo "::warning::audio_query failed"; echo "VOICEVOX_OK=0" >> "$GITHUB_ENV"; exit 0; }
          curl -fsS --max-time 120 -X POST \
            "http://127.0.0.1:50021/synthesis?speaker=13" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            -o /tmp/voicevox-warmup.wav \
            || { echo "::warning::warmup synthesis failed"; echo "VOICEVOX_OK=0" >> "$GITHUB_ENV"; exit 0; }
          if [ -s /tmp/voicevox-warmup.wav ]; then
            echo "voicevox warmup OK ($(wc -c < /tmp/voicevox-warmup.wav) bytes WAV)"
            echo "VOICEVOX_OK=1" >> "$GITHUB_ENV"
          else
            echo "::warning::warmup WAV is empty; falling back"
            echo "VOICEVOX_OK=0" >> "$GITHUB_ENV"
          fi
        continue-on-error: true

      - name: Collect & summarize & generate audio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # ウォームアップ済みの時だけ scraper が VOICEVOX を叩く。
          # 失敗時は空文字なので scraper は Azure → ElevenLabs → OpenAI に自動フォールバック。
          VOICEVOX_BASE_URL: ${{ env.VOICEVOX_OK == '1' && 'http://127.0.0.1:50021' || '' }}
        run: |
          echo "::group::Python scraper output"
          python -u apps/ai-news/scraper.py
          EXIT_CODE=$?
          echo "::endgroup::"
          echo "Python exit code: $EXIT_CODE"
          echo "::group::Files in data/ after scraper"
          ls -la apps/ai-news/data/ || echo "data/ missing"
          echo "=== debug.json ==="
          cat apps/ai-news/data/debug.json 2>/dev/null || echo "(no debug.json)"
          echo "::endgroup::"
          exit $EXIT_CODE

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 存在するファイルだけ add する（missing は silent skip）
          for f in apps/ai-news/data/news.json apps/ai-news/data/debug.json; do
            [ -f "$f" ] && git add "$f" && echo "added: $f"
          done
          [ -d apps/ai-news/data/archives ] && git add apps/ai-news/data/archives/
          [ -d apps/ai-news/data/audio ] && git add apps/ai-news/data/audio/
          echo "--- staged files ---"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: update ai-news data [skip ci]"
            git push
            echo "pushed"
          fi
