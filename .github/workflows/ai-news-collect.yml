name: AI NEWS 自動収集

on:
  schedule:
    # 毎朝 JST 8:00（UTC 23:00）に実行。GitHub遅延込みで8:10前後を想定。
    - cron: '0 23 * * *'
  workflow_dispatch:
  # トリガー用ファイルへの push で scraper を任意タイミングで起動
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apps/ai-news/.trigger-scraper'

permissions:
  contents: write

concurrency:
  group: ai-news-collect
  cancel-in-progress: true

jobs:
  collect:
    # [skip ci] が付いた scraper 自身のコミットでは実行しない（無限ループ防止）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r apps/ai-news/requirements.txt

      - name: Install ffmpeg (VOICEVOX WAV → MP3 変換用)
        # ubuntu-latest (24.04) には ffmpeg がプリインストールされていないため明示インストール。
        # ~3-5 秒で完了。VOICEVOX の WAV 出力を MP3 に変換するためだけに使う。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Start VOICEVOX engine (CPU) and warmup synthesis
        # 完全無料・登録不要の日本語ネイティブ TTS。
        # /version は速く返るがモデル loading は初回 synthesis で lazy に走るため、
        # Python で /version 待機 + ウォームアップ合成までやってから VOICEVOX_OK を export。
        run: |
          docker run -d --rm \
            --name voicevox \
            -p 127.0.0.1:50021:50021 \
            voicevox/voicevox_engine:cpu-latest
          python3 - <<'PY' || warmup_status=$?
          import json, sys, time, urllib.request
          base = "http://127.0.0.1:50021"
          # /version 待機
          for i in range(120):
              try:
                  urllib.request.urlopen(base + "/version", timeout=2).read()
                  print(f"voicevox /version OK after {i*2}s")
                  break
              except Exception:
                  time.sleep(2)
          else:
              print("::warning::voicevox /version did not respond within 240s")
              sys.exit(2)
          # ウォームアップ合成
          print("warming up speaker=13 ('テスト')...")
          t0 = time.time()
          try:
              q_url = base + "/audio_query?speaker=13&text=%E3%83%86%E3%82%B9%E3%83%88"
              q = json.loads(urllib.request.urlopen(urllib.request.Request(q_url, method="POST"), timeout=60).read())
              s_req = urllib.request.Request(
                  base + "/synthesis?speaker=13",
                  method="POST",
                  headers={"Content-Type": "application/json", "Accept": "audio/wav"},
                  data=json.dumps(q).encode("utf-8"),
              )
              wav = urllib.request.urlopen(s_req, timeout=300).read()
              if not wav or len(wav) < 1000:
                  print(f"::warning::warmup WAV too small: {len(wav)} bytes")
                  sys.exit(3)
              print(f"voicevox warmup OK: {len(wav)} bytes WAV in {time.time()-t0:.1f}s")
              sys.exit(0)
          except Exception as e:
              print(f"::warning::warmup synthesis failed: {e}")
              sys.exit(4)
          PY
          warmup_status=${warmup_status:-0}
          if [ "$warmup_status" -eq 0 ]; then
            echo "VOICEVOX_OK=1" >> "$GITHUB_ENV"
            echo "voicevox is ready for scraper"
          else
            echo "VOICEVOX_OK=0" >> "$GITHUB_ENV"
            echo "voicevox warmup failed (status=$warmup_status); will fall back"
            docker logs voicevox 2>&1 | tail -40 || true
          fi
        continue-on-error: true

      - name: Collect & summarize & generate audio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # ウォームアップ済みの時だけ scraper が VOICEVOX を叩く。
          # 失敗時は空文字なので scraper は Azure → ElevenLabs → OpenAI に自動フォールバック。
          VOICEVOX_BASE_URL: ${{ env.VOICEVOX_OK == '1' && 'http://127.0.0.1:50021' || '' }}
        run: |
          echo "::group::Python scraper output"
          python -u apps/ai-news/scraper.py
          EXIT_CODE=$?
          echo "::endgroup::"
          echo "Python exit code: $EXIT_CODE"
          echo "::group::Files in data/ after scraper"
          ls -la apps/ai-news/data/ || echo "data/ missing"
          echo "=== debug.json ==="
          cat apps/ai-news/data/debug.json 2>/dev/null || echo "(no debug.json)"
          echo "::endgroup::"
          exit $EXIT_CODE

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 存在するファイルだけ add する（missing は silent skip）
          for f in apps/ai-news/data/news.json apps/ai-news/data/debug.json; do
            [ -f "$f" ] && git add "$f" && echo "added: $f"
          done
          [ -d apps/ai-news/data/archives ] && git add apps/ai-news/data/archives/
          [ -d apps/ai-news/data/audio ] && git add apps/ai-news/data/audio/
          echo "--- staged files ---"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: update ai-news data [skip ci]"
            git push
            echo "pushed"
          fi
