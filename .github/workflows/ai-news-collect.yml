name: AI NEWS 自動収集

on:
  schedule:
    # 毎朝 JST 8:00（UTC 23:00）に実行。GitHub遅延込みで8:10前後を想定。
    - cron: '0 23 * * *'
  workflow_dispatch:
  # main へのトリガーファイル更新でのみ scraper を起動する。
  # 過去 claude/** branch でも起動していたが、auto-merge と workflow が並走する
  # と audio commit が orphaned branch に残る race condition が発生していたため
  # main only に絞った。claude/** で trigger-scraper を更新しても、auto-merge で
  # main にマージされた瞬間に main 側の workflow が起動して main に audio を
  # commit するので機能としては変わらない。
  push:
    branches:
      - main
    paths:
      - 'apps/ai-news/.trigger-scraper'

permissions:
  contents: write

concurrency:
  group: ai-news-collect
  cancel-in-progress: true

jobs:
  collect:
    # [skip ci] が付いた scraper 自身のコミットでは実行しない（無限ループ防止）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r apps/ai-news/requirements.txt

      - name: Install ffmpeg (MP3チャンク結合用)
        # ubuntu-latest (24.04) には ffmpeg がプリインストールされていないため明示インストール。
        # Google TTS / OpenAI TTS / ElevenLabs の複数チャンクMP3を結合するために使う。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Start AivisSpeech engine (CPU) and warmup synthesis
        # AivisSpeech は TTS フォールバックチェーンの最終手段に降格済み。
        # Google → Azure → ElevenLabs → OpenAI がすべて失敗した場合のみ使用。
        # Docker pull + warmup で最大 7 分かかるため、通常運用では不要。
        # スキップして常に AIVISSPEECH_OK=0 にする。
        run: |
          echo "AIVISSPEECH_OK=0" >> "$GITHUB_ENV"
          echo "AivisSpeech skipped (last-resort fallback, not needed)"
        continue-on-error: true

      - name: Collect & summarize & generate audio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Google Cloud TTS（無料枠で月100万字、Neural2-B はプロアナウンサー級）が
          # 設定されていれば最優先で使う。それ以外は VOICEVOX/Azure/ElevenLabs/OpenAI。
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # ウォームアップ済みの時だけ scraper が AivisSpeech を叩く。
          # 失敗時は空文字なので scraper は Azure → ElevenLabs → OpenAI に自動フォールバック。
          # AivisSpeech は VOICEVOX API 互換なので環境変数名はそのまま流用。
          VOICEVOX_BASE_URL: ${{ env.AIVISSPEECH_OK == '1' && 'http://127.0.0.1:10101' || '' }}
          VOICEVOX_SPEAKER_ID: ${{ env.AIVISSPEECH_SPEAKER_ID }}
          # AivisSpeech 用に chunk サイズを少し小さめに（モデルが重いため）
          VOICEVOX_CHUNK_CHARS: '500'
          # 合計テキスト長も短めに抑えて synthesis 時間を確保（CPU で長文を一気に作るのが重いため）
          VOICEVOX_MAX_CHARS: '1500'
        run: |
          echo "::group::Python scraper output"
          python -u apps/ai-news/scraper.py
          EXIT_CODE=$?
          echo "::endgroup::"
          echo "Python exit code: $EXIT_CODE"
          echo "::group::Files in data/ after scraper"
          ls -la apps/ai-news/data/ || echo "data/ missing"
          echo "=== debug.json ==="
          cat apps/ai-news/data/debug.json 2>/dev/null || echo "(no debug.json)"
          echo "::endgroup::"
          exit $EXIT_CODE

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 存在するファイルだけ add する（missing は silent skip）
          for f in apps/ai-news/data/news.json apps/ai-news/data/debug.json apps/ai-news/data/_aivis_diag.log; do
            [ -f "$f" ] && git add "$f" && echo "added: $f"
          done
          [ -d apps/ai-news/data/archives ] && git add apps/ai-news/data/archives/
          [ -d apps/ai-news/data/audio ] && git add apps/ai-news/data/audio/
          echo "--- staged files ---"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update ai-news data [skip ci]"
          # akkodis-watcher.yml が同じ cron '0 23 * * *' で並走して main に push するため、
          # 単純な git push では non-fast-forward で fail することがある（1日 1ジョブ失敗の主因）。
          # pull --rebase でリモートを取り込んで再 push をリトライする。
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push failed (attempt $attempt); fetching & rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || {
              echo "::error::rebase failed; aborting"
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
